name: Tree context UI checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/tree-ios-context-menu
jobs:
  static-gestures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser scripts, interactions and offline assets
        run: node --test tests/tree-context.test.mjs
      - name: Install Japanese test fonts for visual snapshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test gestures in real headless Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/tane-qa" --no-audit --no-fund axe-core@4.10.3
          TANE_AXE_PATH="$RUNNER_TEMP/tane-qa/node_modules/axe-core/axe.min.js" node --test tests/tree-context.browser.test.mjs tests/qa-matrix.test.mjs tests/product-quality.browser.test.mjs
      - name: Save menu preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-context-visual-previews
          path: test-artifacts/
          if-no-files-found: ignore

<style>
/* 現場ノート：はしご（上が抽象、字下げするほど具体）を作業面にし、選んだ行動の場で操作する。分析シートは下からせり上がる。 */
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#16202A; --ink-2:#56626C; --line:#D5DDDB;
  --accent:#2C47C4; --accent-soft:rgba(44,71,196,.10); --on-accent:#FFFFFF;
  --seed:#B9DA4A; --seed-soft:rgba(185,218,74,.45); --seed-ink:#1F2A00;
  --warn:#B86A1C; --warn-soft:rgba(184,106,28,.12);
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#111518; --surface:#192024; --ink:#E5ECEA; --ink-2:#9AA6A3; --line:#2A3338;
  --accent:#8FA3FF; --accent-soft:rgba(143,163,255,.14); --on-accent:#0D1240;
  --seed:#B3D34C; --seed-soft:rgba(179,211,76,.30); --seed-ink:#1A2300;
  --warn:#E3A35A; --warn-soft:rgba(227,163,90,.14); color-scheme:dark } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(160px + env(safe-area-inset-bottom))}

.bar{position:sticky;top:0;z-index:15;background:var(--paper);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:2px;border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-weight:800;font-size:21px;letter-spacing:.06em;margin:0;line-height:1.2}
.status{font-size:11px;color:var(--ink-2);white-space:nowrap}
.status.alert{color:var(--warn);font-weight:700}
.themes{display:flex;gap:8px;margin:0 -16px 8px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ghost{background:transparent;border-style:dashed;color:var(--ink-2)}
.newtheme{display:flex;gap:6px;margin:0 0 10px}
.newtheme input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.subnav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:10px 0 10px}
.subnav button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--ink-2);font-weight:600}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.subnav .n{font-family:var(--f-mono);font-size:11px;margin-left:3px;opacity:.8}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--ink-2);font-size:11px}
.bottom svg{width:24px;height:24px}
.bottom button[aria-current="true"]{color:var(--ink);font-weight:700}
@media (min-width:900px){ .bottom{left:50%;right:auto;width:520px;transform:translateX(-50%);border:1px solid var(--line);border-radius:16px 16px 0 0} }
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:14px}
@media (min-width:900px){ .grid{grid-template-columns:minmax(0,1fr) 420px;align-items:start} }

.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.focusbar button{border:0;background:none;color:var(--accent);padding:2px 4px;border-radius:4px}
.tapnote{font-size:12px;color:var(--ink-2);margin:0 0 8px}
.rows{display:flex;flex-direction:column;gap:2px}
.item{min-width:0}
.row{display:flex;align-items:stretch;gap:2px;min-width:0}
.indent{flex:none;display:flex}
.indent i{width:16px;flex:none;border-left:1px solid var(--line);margin-left:7px}
.caret{width:30px;flex:none;border:0;background:none;color:var(--ink-2);font-size:11px;border-radius:6px}
.caret:disabled{visibility:hidden}
.node{flex:1;min-width:0;min-height:44px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.item.sel .node{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line1{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.node .t{flex:1;min-width:0;overflow-wrap:anywhere}
.node.root .t{font-weight:700;font-size:17px}
.lv{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-left:2px}
.b{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.b-fr{background:var(--warn-soft);color:var(--warn)}
.b-gone{background:var(--seed);color:var(--seed-ink);font-weight:700}
.b-fade{background:var(--seed-soft);color:var(--ink)}
.b-tag{background:var(--accent-soft);color:var(--accent)}
.b-seed{background:var(--ink);color:var(--paper)}
@media (max-width:600px){ .addbox{padding-left:0!important} }
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:8px 0 10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.act b{font-size:14px;font-weight:700}
.act b i{font-style:normal;color:var(--accent);margin-right:4px}
.act small{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.main b i,.act.main small{color:var(--on-accent)}
.inline{display:flex;gap:6px;align-items:center}
.inline input{flex:1;min-width:0;border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:9px 10px}
.addbox{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
.hint{font-size:12px;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{width:40px;padding:8px 0}
.btn.danger{color:var(--warn)}
.quick{margin-top:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--ink-2);background:var(--surface)}
.empty b{color:var(--ink)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){ .sheet{position:sticky;top:120px;max-height:calc(100vh - 200px);overflow:auto} .sheet .close,.grab{display:none} }
@media (max-width:899px){
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .sheet.open{transform:none}
}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} }
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 0}
.sheet-h{display:flex;gap:10px;align-items:flex-start}
.crumb{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.close{margin-left:auto;border:1px solid var(--line);background:none;border-radius:999px;width:36px;height:36px;flex:none}
.title-in{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font-size:18px;font-weight:700;padding:4px 0;border-radius:0}
.title-in:focus{outline:none;border-color:var(--accent)}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-radius:10px;padding:3px;gap:3px}
.stabs button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;color:var(--ink-2)}
.stabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:700}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px}
.tg[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.tg.seedtg[aria-pressed="true"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 2px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.seg button[data-v="gone"][aria-pressed="true"]{background:var(--seed);color:var(--seed-ink)}
.callout{background:var(--seed-soft);border-radius:8px;padding:8px 12px;font-size:13px}
label.f{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;resize:vertical;min-height:64px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagx{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 10px;font-size:13px}
.score{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.dots{display:flex;gap:3px}
.dots button{width:34px;height:32px;border:1px solid var(--line);background:none;border-radius:6px;font-family:var(--f-mono);font-size:12px}
.dots button[aria-pressed="true"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink);font-weight:700}
.total{font-family:var(--f-mono);font-size:13px}
.muted{color:var(--ink-2);font-size:13px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-align:left}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h4 .sp{flex:1}
.hit{text-align:left;border:0;background:none;padding:6px 0;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.hit .ht{flex:1;min-width:0}
.hit b{font-weight:500;display:block}
.hit small{color:var(--ink-2);font-size:12px;overflow-wrap:anywhere;display:block}
.thm{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;color:var(--ink-2);flex:none}
.mark{background:linear-gradient(transparent 55%,var(--seed-soft) 55%)}
.bars{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.bars span{display:flex;align-items:center;gap:3px}
.bars i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--seed)}
.h2{font-size:13px;letter-spacing:.1em;color:var(--ink-2);margin:8px 0 0;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.stat b{font-family:var(--f-mono);font-size:18px;color:var(--ink);display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:25}
@media (min-width:900px){ .scrim{display:none} }

.topr{display:flex;align-items:center;gap:8px;min-width:0}
.aibtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.ideacard{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.st-idea{background:var(--accent-soft);color:var(--accent)}
.st-testing{background:var(--seed);color:var(--seed-ink);font-weight:700}
.st-hold{background:var(--line);color:var(--ink-2)}
.st-dropped{background:var(--line);color:var(--ink-2);text-decoration:line-through}
.fits{display:flex;flex-wrap:wrap;gap:4px}
.fm{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--ink-2)}
.fm-ok{background:var(--seed-soft);color:var(--ink);border-color:transparent}
.fm-mid{border-color:var(--warn);color:var(--warn)}
.fm-ng{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.nextline{font-size:13px;border-left:3px solid var(--accent);padding-left:8px}
.back{border:0;background:none;color:var(--accent);padding:4px 0;font-size:15px}
.fit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.tri{display:flex;gap:4px}
.tri button{width:42px;height:36px;border:1px solid var(--line);background:none;border-radius:8px;font-size:15px}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink);font-weight:700}
.tri button[aria-pressed="true"][data-v="mid"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.tri button[aria-pressed="true"][data-v="ng"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
label.f .q{font-size:14px;font-weight:700;color:var(--ink)}
label.f small{font-size:12px}
.srcchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:4px 4px 4px 12px;max-width:100%}
.srcchip .linkbtn{overflow-wrap:anywhere}
.srcx{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 8px}
.big{width:100%;padding:13px;font-size:16px;text-align:center;white-space:normal}
a.btn{display:block;text-decoration:none;color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.entry-option{text-align:left;width:100%;white-space:normal;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px}
.entry-option strong{font-size:16px}.entry-option small{font-size:13px;color:var(--ink-2);white-space:normal}
.entry-option.pri small{color:var(--on-accent)}
.biz-section{display:block}
.biz-section>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
.biz-section>summary::-webkit-details-marker{display:none}
.biz-section>summary:after{content:'⌄';float:right;color:var(--ink-2);font-size:17px}
.biz-section[open]>summary:after{content:'⌃'}
.biz-fields{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.import-review{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;background:var(--surface)}
.import-review ul{margin:0;padding-left:20px;font-size:13px}
.origin{font-size:12px;color:var(--ink-2);line-height:1.5}


/* =========================================================
   タネ帳 UI v2 — ChatGPT-inspired minimal design language
   Independent product identity; no OpenAI trademarks/assets.
   ========================================================= */
:root{
  --paper:#FFFFFF;
  --surface:#F7F7F8;
  --ink:#202123;
  --ink-2:#696B70;
  --line:#E7E7EA;
  --accent:#202123;
  --accent-soft:#EBECEF;
  --on-accent:#FFFFFF;
  --seed:#E4F3E8;
  --seed-soft:#EFF8F1;
  --seed-ink:#22623F;
  --warn:#A45B11;
  --warn-soft:#FFF1DD;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#202020;
    --surface:#2B2B2B;
    --ink:#F3F3F3;
    --ink-2:#B8B8BC;
    --line:#434343;
    --accent:#F3F3F3;
    --accent-soft:#393939;
    --on-accent:#171717;
    --seed:#244734;
    --seed-soft:#213A2D;
    --seed-ink:#D1F1DE;
    --warn:#E8AD72;
    --warn-soft:#493522;
    color-scheme:dark;
  }
}
body{font-size:15px;line-height:1.63;letter-spacing:.005em}
.wrap{max-width:1100px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:calc(132px + env(safe-area-inset-bottom))}
.bar{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar-top{gap:14px;min-height:54px;padding-bottom:12px}
.heading{display:flex;flex-direction:column;gap:0;min-width:0}
.eyebrow{display:block;font-size:11px;line-height:1.6;color:var(--ink-2);font-weight:650;letter-spacing:.055em}
h1{font-size:23px;line-height:1.25;letter-spacing:-.027em;font-weight:750}
.status{font-size:11px;line-height:1.3;border-radius:999px;background:var(--surface);color:var(--ink-2);padding:7px 9px;max-width:45%;text-align:center;white-space:normal}
.status.alert{color:var(--warn);background:var(--warn-soft)}
.subnav{border:0;background:var(--surface);border-radius:999px;padding:5px;gap:4px;margin:2px 0 7px}
.subnav button{min-width:0;padding:10px 5px;border-radius:999px;font-size:13px;line-height:1.3;font-weight:600;transition:background .16s ease,color .16s ease}
.subnav button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.grid{margin-top:18px;gap:22px}
.list{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:19px;gap:13px}
.card h4{font-size:17px;line-height:1.4;font-weight:700;letter-spacing:-.015em}
.card p{line-height:1.65}
.h2{color:var(--ink-2);font-size:12px;font-weight:750;letter-spacing:.06em;margin:10px 0 0}
.muted{color:var(--ink-2);font-size:13px;line-height:1.6}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;line-height:1.7}
.empty b{font-size:17px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:650;line-height:1.35;transition:background .15s ease,transform .15s ease}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:12px}
.btn.icon{min-height:44px;width:44px;border-radius:999px;padding:8px 0}
.btn.big{min-height:52px;padding:14px 16px;font-size:15px;border-radius:15px}
.btn.danger{color:var(--warn)}
.entry-option{padding:16px;border-radius:16px;gap:8px}
.entry-option strong{font-size:16px;letter-spacing:-.01em}
.entry-option small{font-size:13px;line-height:1.55}
.welcome{padding:24px 20px;gap:16px}
.welcome h4{font-size:23px;font-weight:750;line-height:1.38;letter-spacing:-.035em}
.welcome .btn.big{margin-top:4px}
.welcome small{line-height:1.6}
.intro-choice h4{font-size:21px;letter-spacing:-.028em}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ghost{background:transparent;border:1px dashed var(--line)}
.themes{margin:0 -18px 14px;padding:0 18px 4px;gap:8px}
.newtheme input,.inline input{min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:10px 13px}
.newtheme input:focus,.inline input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
.tapnote{font-size:13px;margin-bottom:13px;line-height:1.6}
.rows{gap:3px}
.node{min-height:49px;padding:10px 12px;border-radius:14px}
.node.root .t{font-size:17px;font-weight:700}
.item.sel .node{background:var(--surface);border-color:var(--line);box-shadow:0 0 0 2px var(--accent-soft)}
.caret{width:33px;border-radius:10px}
.lv{border-radius:6px;background:var(--surface);border-color:var(--line);font-size:10px}
.actions{gap:8px;padding-top:12px;padding-bottom:13px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px;gap:5px}
.act b{font-size:14px}
.act b i{color:var(--ink)}
.act small{font-size:12px;color:var(--ink-2);line-height:1.5}
.act.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.act.main b i,.act.main small{color:var(--paper)}
.addbox{gap:10px;padding-bottom:16px}
.hint{font-size:13px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;gap:18px}
.sheet-h{align-items:center}
.close{border:1px solid var(--line);background:var(--surface);width:40px;height:40px}
.title-in{font-size:21px;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:10px 12px}
.title-in:focus{outline:2px solid var(--ink);border-color:transparent}
.stabs{background:var(--surface);border-radius:13px;padding:5px}
.stabs button{border-radius:10px;padding:10px 4px}
.stabs button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.sec{gap:10px}
.sec h3{font-size:12px;letter-spacing:.045em}
.tg{min-height:40px;border-radius:999px;padding:9px 13px;background:var(--surface);border:1px solid var(--line)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tg.seedtg[aria-pressed="true"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink)}
.seg{border:0;background:var(--surface);border-radius:13px;padding:4px;gap:3px}
.seg button{border:0;border-radius:10px;min-height:41px;padding:9px 4px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[data-v="gone"][aria-pressed="true"]{background:var(--seed);color:var(--seed-ink)}
textarea{min-height:78px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;line-height:1.6}
textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
label.f{gap:7px;color:var(--ink-2)}
label.f .q{font-size:14px}
label.f small{font-size:12px}
.tagx{background:var(--accent-soft);color:var(--ink);padding:7px 11px;border-radius:999px}
.b{font-size:11px;border-radius:999px;padding:3px 9px}
.b-tag{background:var(--accent-soft);color:var(--ink)}
.b-seed{background:var(--seed);color:var(--seed-ink)}
.b-fr{background:var(--warn-soft)}
.st-idea{background:var(--accent-soft);color:var(--ink)}
.st-testing{background:var(--seed);color:var(--seed-ink)}
.st-hold,.st-dropped{background:var(--line);color:var(--ink-2)}
.srcchip{background:var(--accent-soft);border-radius:999px}
.srcx,.srcchip .linkbtn{color:var(--ink)}
.linkbtn,.back{color:var(--ink);font-weight:650}
.hit{min-height:52px;padding:9px 2px}
.hit:first-of-type{border-top:0}
.hit small{font-size:12px}
.thm{background:var(--paper);border-radius:999px;padding:4px 8px}
.ideacard{gap:13px;white-space:normal;border-radius:20px;padding:18px}
.ideacard h4{font-size:17px}
.biz-section{padding:19px}
.biz-section>summary{font-size:16px;line-height:1.5}
.biz-section>summary:after{font-size:20px}
.biz-fields{gap:18px;margin-top:20px}
.fit{gap:10px;font-size:13px}
.tri button{border-radius:12px;min-height:41px}
.import-review{background:var(--paper);border-radius:15px;padding:16px;gap:12px}
.stat{gap:14px 20px}
.stat b{font-size:20px;font-weight:750}
.steps{gap:11px;padding-left:23px}
.steps li{padding-left:3px}
.bottom{background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(0,0,0,.035);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom button{min-height:56px;padding:9px 2px 7px;border-radius:15px;font-size:11px;gap:4px;font-weight:550}
.bottom svg{width:23px;height:23px}
.bottom button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:750}
.toast{bottom:calc(91px + env(safe-area-inset-bottom));padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(hover:hover){
 .btn:not(:disabled):hover,.act:hover,.chip:hover,.ideacard:hover{filter:brightness(.97)}
 .bottom button:hover{background:var(--surface)}
 .subnav button:not([aria-pressed="true"]):hover{background:var(--line)}
}
@media(max-width:899px){
 .sheet{max-height:87%;border-radius:26px 26px 0 0;padding-bottom:calc(23px + env(safe-area-inset-bottom))}
}
@media(min-width:900px){
 .grid{grid-template-columns:minmax(0,1fr) 400px}
 .sheet{top:136px}
 .bottom{width:580px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
}
@media(max-width:380px){
 .bar-top{gap:7px}
 h1{font-size:21px}
 .status{font-size:10px;padding:6px 7px}
 .bottom button{font-size:10px}
 .card{padding:16px}
}


/* ---- Reference-matched Tane design v3: blue CTA and nested cards ---- */
:root{
  --paper:#FFFFFF;
  --surface:#F3F4F6;
  --ink:#202123;
  --ink-2:#747680;
  --line:#E3E4E8;
  --accent:#3151CB;
  --accent-soft:#E7EBFC;
  --on-accent:#FFFFFF;
  --frame:#FFFFFF;
  --panel:#F3F4F6;
  --panel-line:#EDEEF1;
  --blue-button:#304CC9;
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#0B0B0D;
    --surface:#242426;
    --ink:#F8F8FA;
    --ink-2:#B3B4BC;
    --line:#323236;
    --accent:#5976EB;
    --accent-soft:#252B41;
    --on-accent:#FFFFFF;
    --frame:#0B0B0D;
    --panel:#242426;
    --panel-line:#333336;
    --blue-button:#304CC9;
  }
}
body{background:var(--paper)}
.bar{background:var(--paper)}
.card{background:var(--frame);border:1px solid var(--line);border-radius:22px;padding:18px}
.welcome-frame,.intro-frame{padding:18px 14px 14px;gap:18px}
.welcome-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 6px}
.welcome-heading h3{font-size:18px;font-weight:750;line-height:1.4;letter-spacing:-.018em;margin:0}
.welcome-heading svg{width:23px;height:23px;flex:none;stroke:var(--ink-2);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.welcome-panel{display:flex;flex-direction:column;gap:16px;background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:23px 19px}
.welcome-panel h4{margin:0;font-size:clamp(20px,5.7vw,27px);line-height:1.42;letter-spacing:-.025em;font-weight:760}
.welcome-panel p{font-size:15px;line-height:1.75;margin:0;color:var(--ink)}
.welcome-panel .welcome-help{font-size:12px;color:var(--ink-2);text-align:center}
.welcome-panel .btn.pri.big{width:100%;border-radius:15px;min-height:53px;font-size:16px;font-weight:720}
.frame-step{font-size:12px;color:var(--ink-2)}
.intro-frame .welcome-panel{gap:12px}
.intro-frame .welcome-panel h4{margin-bottom:6px;font-size:20px}
.choice-panel .entry-option{border-radius:16px;min-height:85px}
.choice-panel .entry-option:not(.pri){background:var(--frame)}
.btn.pri,.btn.pri.big,.act.main,.entry-option.pri{background:var(--blue-button);border-color:var(--blue-button);color:#FFFFFF}
.act.main b i,.act.main small{color:#FFFFFF}
.btn.pri:focus-visible,.act.main:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.entry-option.pri small{color:#EDEEFF}
.biz-frame{padding:18px 14px 14px;gap:16px}
.biz-frame-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:0 6px}
.biz-frame-head h4{margin:0;font-size:18px;letter-spacing:-.02em}
.biz-frame-head span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.biz-progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:0 6px}
.biz-progress span{height:5px;border-radius:999px;background:var(--line)}
.biz-progress span.active{background:var(--blue-button)}
.biz-stage-list{display:flex;flex-direction:column;gap:10px}
.biz-stage-list .biz-section{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:17px}
.biz-stage-list .biz-section[open]{padding-bottom:19px}
.biz-section>summary{font-size:15px;line-height:1.55;font-weight:730}
.biz-stage-list textarea{background:var(--frame)}
.biz-stage-list .biz-fields{gap:14px;margin-top:18px}
.ideacard{background:var(--frame)}
.card:not(.welcome-frame):not(.intro-frame):not(.biz-frame){border-color:var(--line)}
.empty,.act{background:var(--panel);border-color:var(--panel-line)}
.bottom{background:var(--paper)}
.bottom button[aria-current="true"]{background:var(--panel)}
.subnav{background:var(--panel)}
@media (prefers-color-scheme:dark){
  .subnav button[aria-pressed="true"]{background:#3A3A3D}
  .stabs button[aria-selected="true"]{background:#37373A}
  .btn:not(.pri):not(.danger),.chip,.thm{background:var(--panel)}
  .choice-panel .entry-option:not(.pri){background:var(--frame)}
  .btn.pri,.btn.pri.big,.act.main,.entry-option.pri{background:var(--blue-button);border-color:var(--blue-button)}
}
@media(max-width:380px){
  .welcome-panel{padding:19px 15px}
  .welcome-frame,.intro-frame,.biz-frame{padding:14px 11px 12px}
}

.seed-ai-actions{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--frame)}
.seed-ai-actions p{margin:0 0 4px;line-height:1.7}
.seed-ai-shortcut{display:flex;flex-wrap:wrap;gap:9px;background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:16px;margin-top:18px;align-items:center}
.seed-ai-shortcut > div{width:100%}
.seed-ai-shortcut p{margin:3px 0 0}
.biz-ai-workflow{gap:11px}
.copy-fallback{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:60;padding:16px;display:flex;align-items:center;justify-content:center}
.copy-fallback-panel{width:min(100%,560px);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:20px}
.copy-fallback-panel h3{font-size:18px;margin:0}
.copy-fallback-panel p{margin:0}
.copy-fallback-panel textarea{min-height:170px;background:var(--paper)}
.copy-fallback-panel button{align-self:flex-end;min-width:94px}
@media(max-width:380px){.seed-ai-shortcut .btn{width:100%}}
.ai-provider-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%}
.ai-provider-links .btn{display:flex;align-items:center;justify-content:center;min-width:0;min-height:48px;white-space:normal;text-align:center;border-radius:14px;padding:10px 8px}
.seed-ai-shortcut .ai-provider-links{flex-basis:100%}

/* AI 3-step interaction: same quiet, neutral treatment for both providers. */
[hidden]{display:none!important}
.seed-ai-actions{display:flex;flex-direction:column;gap:13px;padding:4px 0 0;background:none;border:0;border-radius:0}
.ai-flow{gap:15px}
.ai-flow-step{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--panel-line);border-radius:17px;padding:17px}
.ai-flow-step strong,.ai-flow-choice strong{font-size:15px;font-weight:720;line-height:1.5}
.ai-flow-step p,.ai-flow-choice p{margin:0;line-height:1.65}
.ai-flow-choice{display:flex;flex-direction:column;gap:10px;padding:3px 2px}
.ai-flow .ai-provider-links,.seed-ai-actions .ai-provider-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%}
.ai-provider-links .btn.ai-provider{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);background:var(--frame);color:var(--ink);font-weight:650;text-align:center;border-radius:14px;white-space:normal;padding:10px 8px}
.ai-provider-links .btn.ai-provider:hover{background:var(--panel)}
.ai-flow-step .btn.ai-secondary,.seed-ai-actions .btn.ai-secondary{background:var(--frame);color:var(--ink);border-color:var(--line);border-radius:13px;white-space:normal}
.seed-ai-shortcut{margin-top:18px;display:flex;flex-direction:column;align-items:stretch;background:var(--frame);border-color:var(--line);gap:15px}
.seed-ai-shortcut .ai-provider-links{flex-basis:auto}
.seed-ai-shortcut > div{width:auto}
.biz-ai-workflow{display:flex;flex-direction:column;gap:15px}
@media(max-width:380px){.ai-provider-links .btn.ai-provider{font-size:12px}}

/* 行動カードと左端を揃えたコンパクトな縦並びアクション */
.actions{grid-template-columns:minmax(0,1fr);gap:6px;padding-top:7px;padding-bottom:9px;padding-right:0}
.act{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:7px 11px;border:1px solid var(--panel-line);border-radius:12px;box-shadow:none}
.act b{flex:0 0 auto;font-size:13px;line-height:1.25;white-space:nowrap}
.act small{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;font-size:11px;line-height:1.25}
@media(max-width:360px){
  .act{padding:7px 9px;gap:5px}
  .act b{font-size:12px}
  .act small{font-size:10px}
}

/* ---- 解像度（深さ・広さ・構造・時間） ---- */
.lens-meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lens-btn{border:1px solid var(--panel-line);background:var(--panel);border-radius:13px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;color:var(--ink)}
.lens-btn b{font-size:14px;font-weight:720}
.lens-btn small{font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lens-btn[aria-pressed="true"]{background:var(--frame);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ldots{display:flex;gap:3px}
.ldots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ldots i.on{background:var(--blue-button)}
.lens-body{display:flex;flex-direction:column;gap:12px}
.lens-q{margin:0;font-size:13px;line-height:1.65;color:var(--ink-2)}
.rtree{display:flex;flex-direction:column;gap:8px}
.rcard,.acard,.trow{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.rcard.child{border-left:3px solid var(--blue-button)}
.rhead{display:flex;align-items:center;gap:6px;min-width:0}
.rhead .sp{flex:1}
.rsel{font:inherit;font-size:16px;line-height:1.2;border:1px solid var(--line);background:var(--frame);color:var(--ink);border-radius:999px;padding:4px 8px;min-height:34px;max-width:100%;min-width:0}
.rstar{flex:none;border:1px solid var(--line);background:var(--frame);border-radius:999px;width:34px;height:34px;color:var(--ink-2);font-size:15px}
.rstar[aria-pressed="true"]{background:#F5C84B;border-color:#F5C84B;color:#3A2A00}
.rx{flex:none;border:0;background:none;color:var(--ink-2);width:34px;height:34px;font-size:14px}
.rcard textarea,.acard textarea,.r-add textarea{min-height:52px;background:var(--frame);padding:8px 10px;font-size:16px}
.acard input,.trow input{min-height:40px;border:1px solid var(--line);background:var(--frame);border-radius:10px;padding:7px 10px;font-size:16px;width:100%}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.rst{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--ink-2)}
.rst-gone{background:var(--seed);color:var(--seed-ink);font-weight:700}
.rst-fading{background:var(--seed-soft);color:var(--seed-ink)}
.rst-still{background:var(--accent-soft);color:var(--ink)}
.r-add{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.r-add .inline{justify-content:space-between;flex-wrap:wrap}
.rwhy{display:flex;flex-direction:column;gap:6px}
.kgroup{display:flex;flex-direction:column;gap:6px}
.kgroup h5{margin:0;font-size:12px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.krow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 8px;min-width:0}
.krow span{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow p{margin:0;font-size:14px;overflow-wrap:anywhere}
.trow .seg{background:var(--frame)}
.rcard textarea,.acard textarea,.r-add textarea,#d-res textarea{resize:none;overflow:hidden}
.b-res{background:var(--panel);color:var(--ink-2);border:1px solid var(--panel-line)}
.b-star{background:#FFF4D1;color:#6B4E00}
@media (prefers-color-scheme:dark){.b-star{background:#4A3B12;color:#F7DE84}}
@media(max-width:360px){.lens-btn small{display:none}}

/* AIを使う新規行動作成は、見出しと3ステップを一枚のカードに収める。
   事業化のAIカードと同じ階層: 外側のカード > 内側の手順。 */
.choice-panel .theme-ai-card{display:flex;flex-direction:column;gap:14px;background:var(--frame);border:1px solid var(--line);border-radius:18px;padding:17px;min-width:0}
.choice-panel .theme-ai-card > .entry-option:not(.pri){min-height:0;margin:0;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;gap:3px}
.theme-ai-card > .entry-option strong{font-size:17px;line-height:1.45}
.theme-ai-card > .entry-option small{font-size:12px;line-height:1.5}
.theme-ai-card .seed-ai-actions{gap:12px;padding:12px 0 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;min-width:0}
.theme-ai-card .ai-flow-step{padding:15px;border-radius:15px}
.theme-ai-card .ai-flow-choice{padding:2px 0}
@media(max-width:380px){
  .choice-panel .theme-ai-card{padding:14px}
  .theme-ai-card .ai-flow-step{padding:12px}
}

/* 選択した行動名と操作を、同じL階層のカードの内側にまとめる。 */
.item.sel .node-stack{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 0 0 2px var(--accent-soft);overflow:hidden;
}
.item.sel .node-stack > .node{
  width:100%;flex:none;background:transparent;border:0;
  border-radius:0;box-shadow:none;
}
.item.sel .row > .caret{align-self:flex-start;height:56px;}
.item.sel .node-stack > .actions{
  display:flex;flex-direction:column;gap:0;
  margin:0;padding:0 12px 4px;
  background:transparent;border:0;border-top:1px solid var(--line);
}
.item.sel .node-stack > .actions > .act{
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;
  width:100%;min-width:0;min-height:44px;padding:9px 2px;gap:8px;
  background:transparent;border:0;border-radius:0;box-shadow:none;
  color:var(--ink);text-align:left;
}
.item.sel .node-stack > .actions > .act + .act{border-top:1px solid var(--line)}
.item.sel .node-stack > .actions > .act b{flex:0 0 auto;font-size:13px;line-height:1.3;white-space:nowrap}
.item.sel .node-stack > .actions > .act b i{color:var(--ink);margin-right:4px}
.item.sel .node-stack > .actions > .act small{
  flex:1;min-width:0;text-align:right;font-size:11px;line-height:1.3;
  color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.item.sel .node-stack > .actions > .act.main{background:transparent;color:var(--ink)}
.item.sel .node-stack > .actions > .act.main b,.item.sel .node-stack > .actions > .act.main b i{color:var(--accent)}
.item.sel .node-stack > .actions > .act.main small{color:var(--ink-2)}
.item.sel .node-stack > .addbox{
  margin:0;padding:12px;border-top:1px solid var(--line);
  background:transparent;
}
@media(max-width:380px){
  .item.sel .node-stack > .actions{padding-left:9px;padding-right:9px}
  .item.sel .node-stack > .actions > .act{gap:5px}
  .item.sel .node-stack > .actions > .act b{font-size:12px}
  .item.sel .node-stack > .actions > .act small{font-size:10px}
}

/* iOS風コンテキストメニュー：押し込み、カードプレビュー、半透明アクション */
.idea-card-wrap{position:relative;min-width:0}
.idea-card-wrap .ideacard{width:100%;transform-origin:center center;
  transition:transform .18s cubic-bezier(.2,.75,.25,1),background .18s,box-shadow .18s,border-color .18s}
.idea-card-wrap .ideacard h4{padding-right:35px}
.idea-card-wrap .ideacard.is-pressing{transform:scale(.965);background:var(--panel);
  border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 9px 24px rgba(0,0,0,.12)}
.idea-more{position:absolute;right:10px;top:10px;width:38px;height:38px;
  border:0;border-radius:50%;background:transparent;color:var(--ink-2);
  font-size:24px;line-height:1;display:flex;justify-content:center;align-items:center}
.idea-more:active{background:var(--panel)}
.ideacard{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.idea-menu-overlay{position:fixed;inset:0;z-index:65;display:flex;align-items:center;
  justify-content:center;background:rgba(3,3,8,.46);backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);padding:20px 18px;
  touch-action:pan-y}
.idea-menu-stage{width:min(100%,440px);max-height:calc(100dvh - 40px);
  display:flex;flex-direction:column;gap:11px;min-width:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.idea-menu-stage::-webkit-scrollbar{display:none}
.idea-menu-preview{width:100%;max-height:34dvh;overflow:hidden;pointer-events:none;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:18px;box-shadow:0 24px 55px rgba(0,0,0,.22);
  animation:idea-preview-in .28s cubic-bezier(.2,.85,.25,1) both}
.idea-menu-preview h4{padding:0!important;font-size:17px}
.idea-menu-preview .origin,.idea-menu-preview .nextline{display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.idea-menu{width:100%;padding:0;background:rgba(242,242,247,.96);
  border:1px solid rgba(255,255,255,.22);border-radius:16px;
  overflow:hidden;box-shadow:0 20px 45px rgba(0,0,0,.24);
  animation:idea-options-in .27s cubic-bezier(.2,.85,.25,1) both}
.idea-menu h3.visually-hidden{position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);
  white-space:nowrap;border:0}
.idea-menu-actions,.idea-menu-confirm{display:flex;flex-direction:column;gap:0}
.idea-menu-option{width:100%;min-height:54px;padding:13px 17px;border:0;
  background:transparent;color:#1C1C1E;font-size:15px;font-weight:550;
  text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}
.idea-menu-option svg{height:20px;width:20px;flex:none;stroke:currentColor;stroke-width:1.8;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.idea-menu-option.danger{color:#D92B37}
.idea-menu-option:active,.idea-menu-option.is-hovered{background:rgba(60,60,67,.16)}
.idea-menu-dismiss.is-hovered{background:var(--line)}
.idea-menu:focus{outline:none}
.idea-menu-option:focus:not(:focus-visible){outline:none}
.idea-menu-option:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;position:relative;z-index:1}
.idea-menu{touch-action:none}
.idea-menu-dismiss{width:100%;min-height:50px;flex:none;border:1px solid var(--line);
  border-radius:16px;background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:650;text-align:center}
.idea-menu-confirm p{margin:0;padding:15px 17px;color:#58585F;font-size:13px;line-height:1.5;
  border-bottom:1px solid rgba(60,60,67,.18)}
body.idea-menu-open{overflow:hidden}
@media(prefers-color-scheme:dark){
  .idea-menu{background:rgba(45,45,49,.97);border-color:rgba(255,255,255,.11)}
  .idea-menu-option{color:#F4F4F8}
  .idea-menu-option.danger{color:#FF6B6B}
  .idea-menu-option:active,.idea-menu-option.is-hovered{background:rgba(255,255,255,.16)}
  .idea-menu-confirm p{color:#B6B6C0;border-bottom-color:rgba(255,255,255,.14)}
}
@keyframes idea-preview-in{from{opacity:.2;transform:scale(.92) translateY(12px)}
  to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes idea-options-in{from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){
  .idea-card-wrap .ideacard{transition:none}
  .idea-menu-preview,.idea-menu{animation:none}
}
@media(hover:hover){.idea-more:hover{background:var(--surface)}}

.ai-data-choice{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);line-height:1.5}
.ai-data-choice input{width:18px;height:18px;accent-color:var(--blue-button);margin:0}

/* 絞り込んだツリーからの全体表示 */
.focusbar .focus-reset{flex:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:10px;font-size:13px;font-weight:700;
  padding:8px 11px;margin-right:4px;min-height:36px}
/* 参考ソース：リンクとシンプルな追加フォーム */
.reference-section{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;
  display:flex;flex-direction:column;gap:11px;min-width:0}
.reference-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reference-heading h3{font-size:14px;margin:0;color:var(--ink)}
.reference-heading .muted{font-size:12px}
.reference-items{display:flex;flex-direction:column;gap:0}
.reference-item{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 0}
.reference-item + .reference-item{border-top:1px solid var(--line)}
.reference-item a{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px;
  text-decoration:none;color:var(--ink)}
.reference-item a strong{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.reference-item a small{font-size:11px;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reference-remove{border:0;background:transparent;color:var(--ink-2);
  border-radius:8px;min-width:36px;min-height:36px;font-size:15px}
.reference-add{display:flex;flex-direction:column;gap:8px;min-width:0}
.reference-add input{width:100%;min-width:0;padding:11px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);
  color:var(--ink);font-size:14px;min-height:43px}
.reference-add-row{display:flex;gap:8px;align-items:center;min-width:0}
.reference-add-row input{flex:1}
.reference-add-row .btn{flex:none;min-height:43px}
.reference-error{margin:0;font-size:12px;color:var(--warn)}

/* つながり：本質をまとめて提案してもらうカード */
.tag-ai-workflow{display:flex;flex-direction:column;gap:14px}
.tag-ai-workflow>h4{margin:0}
.tag-ai-workflow>.muted{margin:0;font-size:13px}
.tag-flow-done{font-size:14px;color:var(--ink-2)}
/* 提案の確認は、既存データに触れないチップ選択と自由入力だけ */
.tag-review{color:var(--ink);gap:12px}
.tag-review>p{margin:0;font-size:13px}
.tag-review-node{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.tag-review-node>strong{font-size:14px;overflow-wrap:anywhere}
.tag-review-path{color:var(--ink-2);font-size:11px;overflow-wrap:anywhere}
.tag-review-chips{display:flex;gap:8px;flex-wrap:wrap}
.tag-suggestion-chip{display:inline-flex;align-items:center;gap:6px;min-height:39px;
  padding:8px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--frame);color:var(--ink);font-size:13px;text-align:left;white-space:normal}
.tag-suggestion-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tag-suggestion-chip small{color:var(--ink-2);font-size:10px;flex:none}
.tag-custom-input{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--frame);color:var(--ink);font-size:16px}
.tag-custom-input:focus{outline:2px solid var(--accent);outline-offset:0}
.tag-review .btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* 上部はタネ探しの切替だけ。画面名・保存状態・区切り線を省く。 */
.bar{border-bottom:0;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:0}
.bar .subnav{margin:0 0 2px}
.grid{margin-top:12px}
.backup-hint{color:var(--warn);font-size:13px;line-height:1.5;margin:0}

          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        </button>

    <h3 id="copyFallbackTitle">プロンプトを手動でコピー</h3>
    <p class="muted">自動コピーができませんでした。下の文章を長押しして、すべて選択・コピーしてください。</p>
    <textarea readonly id="copyFallbackText" rows="8" aria-label="コピーするプロンプト"></textarea>

<script>
'use strict';
const KEY='tane.v1', KEY_EXPORT='tane.lastExport', KEY_THEME='tane.theme';
const FRICTIONS=[['parties','複数の当事者'],['docs','書類・情報の手渡し'],['money','お金が動く'],['wait','待ち時間'],['manual','手作業'],['repeat','毎回やり直し']];
const STATUS=[['still','まだある'],['fading','薄れている'],['gone','もう無い'],['unknown','未確認']];
const ELEMENTS=[['alt','代わりの手段で無理やり済ませている'],['now','「なぜ今」がある（技術・規制・コストの変化）'],['money','お金がすでに別の名目で使われている'],['repeat','繰り返し起こり、広がっている'],['gap','大手がやりたがらない理由がある']];
const S={ideas:new Map(),ideaSel:null,nodes:new Map(),theme:null,sel:null,focus:null,tab:'tree',collapsed:new Set(),detailFor:null,sheetTab:'res',lens:'depth',whyFor:null,adding:null,renaming:null,importText:null,confirmReplace:false,themeStart:false,pendingImport:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const wide=()=>matchMedia('(min-width:900px)').matches;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}

/* ---------- 端末内の保存 ---------- */
function loadAll(){ try{ const o=JSON.parse(ls.get(KEY)||'null'); if(o&&Array.isArray(o.nodes)) S.nodes=new Map(o.nodes.filter(n=>n&&n.id).map(n=>[n.id,normNode(n)])); if(o&&Array.isArray(o.ideas)) S.ideas=new Map(o.ideas.filter(n=>n&&n.id).map(n=>[n.id,n])); }catch(e){} }
let saveTimer=null;
function saveNow(){ const ok=ls.set(KEY,JSON.stringify({version:2,savedAt:Date.now(),nodes:[...S.nodes.values()],ideas:[...S.ideas.values()]})); if(!ok) toast('保存できませんでした。端末の空き容量を確認してください。'); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,300); }
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNow(); });

function blank(text,parent,order){return{text,parent,order,frictions:[],why:'',constraint:'',status:'',reasons:[],actors:[],references:[],assume:'',alts:'',since:'',future:'',tags:[],seed:false,scores:{},memo:'',created:Date.now()};}
const rid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const aid=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const RKINDS=[['need','目的・必要'],['tech','技術'],['rule','規制・ルール'],['custom','慣習・文化'],['cost','コスト'],['info','情報の偏り'],['trust','信頼・責任'],['phys','物理・時間']];
const kindLabel=k=>(RKINDS.find(([v])=>v===k)||[0,'未分類'])[1];
const LENSES=[['depth','深さ','なぜを重ねる'],['breadth','広さ','視点を変える'],['struct','構造','分けて選ぶ'],['time','時間','経緯と変化']];
/* 古い「背景・制約」の1欄ずつを、理由カードに移す */
/* 出典URLはhttp/httpsのみ保存・表示する。 */
function referenceURL(value){
  const raw=String(value||'').trim();
  if(!raw||raw.length>4000||/[\s\u0000-\u001f]/.test(raw))return '';
  try{
    const url=new URL(/^[a-z][a-z0-9+.-]*:/i.test(raw)?raw:'https://'+raw);
    return (url.protocol==='https:'||url.protocol==='http:')&&url.hostname&&!url.username&&!url.password?url.href:'';
  }catch(e){return '';}
}
function normNode(n){
  if(!n||typeof n!=='object')return n;
  if(!Array.isArray(n.reasons))n.reasons=[];
  if(!Array.isArray(n.actors))n.actors=[];
  n.references=Array.isArray(n.references)?n.references
    .map(r=>typeof r==='string'?{url:r,title:''}:r)
    .filter(r=>r&&typeof r==='object'&&referenceURL(r.url))
    .map(r=>({id:typeof r.id==='string'&&r.id?r.id:newId(),url:referenceURL(r.url),title:String(r.title||'').slice(0,160)})):[];
  for(const k of ['assume','alts','since','future'])if(typeof n[k]!=='string')n[k]='';
  if(!n.reasons.length&&(n.why||n.constraint)){
    if(n.why)n.reasons.push({id:rid(),text:String(n.why),kind:'need',who:'',status:'',evidence:'',star:false,parent:null});
    if(n.constraint)n.reasons.push({id:rid(),text:String(n.constraint),kind:'',who:'',status:n.status||'',evidence:'',star:false,parent:null});
    n.why='';n.constraint='';
  }
  n.reasons=n.reasons.filter(r=>r&&typeof r.text==='string').map(r=>({id:typeof r.id==='string'&&r.id?r.id:rid(),text:r.text,kind:RKINDS.some(([v])=>v===r.kind)?r.kind:'',who:String(r.who||''),status:['still','fading','gone','unknown'].includes(r.status)?r.status:'',evidence:String(r.evidence||''),star:!!r.star,parent:typeof r.parent==='string'&&r.parent?r.parent:null}));
  const ids=new Set(n.reasons.map(r=>r.id));n.reasons.forEach(r=>{if(r.parent&&(!ids.has(r.parent)||r.parent===r.id))r.parent=null;});
  n.actors=n.actors.filter(a=>a&&(a.name||a.wants||a.pains)).map(a=>({id:typeof a.id==='string'&&a.id?a.id:aid(),name:String(a.name||''),wants:String(a.wants||''),pains:String(a.pains||'')}));
  return n;}
/* 行動全体の「理由は今もある？」：理由カードがあればそこから決める */
function rstatus(n){const rs=n.reasons||[];if(rs.length){if(rs.some(r=>r.status==='gone'))return 'gone';if(rs.some(r=>r.status==='fading'))return 'fading';return '';}return n.status||'';}
function rlevel(n,r){let d=0,x=r,g=0;const m=new Map((n.reasons||[]).map(q=>[q.id,q]));while(x&&x.parent&&m.has(x.parent)&&g++<20){d++;x=m.get(x.parent);}return d;}
function lensScore(n){const rs=n.reasons||[];
  const depth=rs.length?Math.min(3,1+Math.max(...rs.map(r=>rlevel(n,r)))):0;
  const named=(n.actors||[]).filter(a=>a.name.trim()).length;
  const breadth=Math.min(3,Math.min(2,named)+((n.assume||'').trim()||(n.alts||'').trim()?1:0));
  const struct=(rs.length>=2?1:0)+(rs.length&&rs.every(r=>r.kind)?1:0)+(rs.some(r=>r.star)?1:0);
  const time=((n.since||'').trim()?1:0)+(rs.length&&rs.every(r=>r.status)?1:0)+((n.future||'').trim()?1:0);
  return {depth,breadth,struct,time,total:depth+breadth+struct+time};}
const normText=t=>String(t||'').replace(/^仮説：/,'').replace(/[\s　。、．，]/g,'');
function reasonIndex(){const m=new Map();for(const n of S.nodes.values())for(const r of(n.reasons||[])){const k=normText(r.text);if(k.length<4)continue;if(!m.has(k))m.set(k,{text:r.text,kind:r.kind,items:[]});const g=m.get(k);if(!g.items.some(x=>x.n.id===n.id))g.items.push({n,r});if(!g.kind&&r.kind)g.kind=r.kind;}return m;}
function put(id,data){ S.nodes.set(id,{id,...data}); saveSoon(); render(); }
function patch(id,data,quiet){ const n=S.nodes.get(id); if(!n) return; Object.assign(n,data); saveSoon(); if(!quiet) render(); else { renderMain(); renderTabs(); } }
function remove(id){ S.nodes.delete(id); }
const timers={};
function patchLater(id,field,value){ clearTimeout(timers[id+field]); timers[id+field]=setTimeout(()=>patch(id,{[field]:value},true),400); }

/* ---------- ツリーの道具 ---------- */
const kids=id=>[...S.nodes.values()].filter(n=>(n.parent||null)===id).sort((a,b)=>(a.order??0)-(b.order??0)||(a.created??0)-(b.created??0));
const roots=()=>kids(null);
function pathOf(id){const p=[];let n=S.nodes.get(id),g=0;while(n&&g++<60){p.unshift(n);n=n.parent?S.nodes.get(n.parent):null;}return p;}
const rootOf=id=>pathOf(id)[0]?.id||null;
const depth=id=>pathOf(id).length-1;
function descendants(id){const o=[];const w=x=>{for(const k of kids(x)){o.push(k.id);w(k.id);}};w(id);return o;}
const scoreOf=n=>ELEMENTS.reduce((s,[k])=>s+(Number(n.scores?.[k])||0),0);
const themeName=id=>S.nodes.get(rootOf(id))?.text||'';
/* 未設定の行動を最大80件、既存の本質と言葉を揃えてAIに渡す。 */
function untaggedNodes(){
  return [...S.nodes.values()].filter(n=>n.parent!=null&&(!Array.isArray(n.tags)||n.tags.length===0));
}
function buildTagPrompt(){
  const nodes=untaggedNodes().slice(0,80).map(n=>({
    id:n.id,
    text:n.text,
    path:pathOf(n.id).slice(0,-1).map(p=>p.text).join(' › '),
    reasons:(Array.isArray(n.reasons)?n.reasons:[]).slice(0,5).map(r=>r.text)
  }));
  return PROMPT_TAG+'\n\n'+ '```json\n'+JSON.stringify({existingTags:[...tagIndex().keys()],nodes},null,2)+'\n```';
}
function tagIndex(){const m=new Map();for(const n of S.nodes.values())for(const t of(n.tags||[])){if(!m.has(t))m.set(t,[]);m.get(t).push(n);}return m;}

/* ---------- 操作 ---------- */
function addChild(pid,text){const t=text.trim();if(!t)return null;const id=newId();const ks=kids(pid);S.collapsed.delete(pid);put(id,blank(t,pid,ks.length?Math.max(...ks.map(k=>k.order??0))+1:0));return id;}
function addParent(id,text){const t=text.trim();const n=S.nodes.get(id);if(!t||!n)return null;const pid=newId();
  S.nodes.set(pid,{id:pid,...blank(t,n.parent||null,n.order??0)}); n.parent=pid; n.order=0;
  if(S.theme===id){S.theme=pid;ls.set(KEY_THEME,pid);} if(S.focus===id)S.focus=pid; saveSoon(); return pid;}
function addSibling(id,text){const n=S.nodes.get(id);if(!n)return null;if(!n.parent)return addTheme(text);const t=text.trim();if(!t)return null;
  const sib=kids(n.parent);const i=sib.findIndex(s=>s.id===id);const nid=newId();
  S.nodes.set(nid,{id:nid,...blank(t,n.parent,0)});
  const after=[...sib.slice(0,i+1),S.nodes.get(nid),...sib.slice(i+1)]; after.forEach((x,k)=>x.order=k); saveSoon(); return nid;}
function addTheme(text){const t=text.trim();if(!t)return null;const id=newId();S.nodes.set(id,{id,...blank(t,null,roots().length)});S.theme=id;S.focus=null;ls.set(KEY_THEME,id);saveSoon();select(id,false);return id;}
function delNode(id){const n=S.nodes.get(id);if(!n)return;const all=[id,...descendants(id)];
  S.sel=n.parent||null;S.detailFor=null;S.adding=null;if(S.focus&&all.includes(S.focus))S.focus=null;if(!n.parent)S.theme=null;
  for(const x of all)remove(x); saveSoon(); render(); toast('削除しました');}
function move(id,dir){const n=S.nodes.get(id);const sib=kids(n.parent||null);const i=sib.findIndex(s=>s.id===id);const j=i+dir;if(j<0||j>=sib.length)return;
  const r=[...sib];r.splice(i,1);r.splice(j,0,n);r.forEach((x,k)=>x.order=k);saveSoon();render();}
function select(id,openDetail){
  if(S.sel!==id){S.adding=null;}
  S.sel=id; if(id){const r=rootOf(id);if(r&&r!==S.theme){S.theme=r;S.focus=null;ls.set(KEY_THEME,r);}}
  S.tab='tree'; render(); if(openDetail) openSheet(true);
  if(id) requestAnimationFrame(()=>{const el=document.querySelector(`[data-item="${CSS.escape(id)}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<170||r.bottom>innerHeight-20)el.scrollIntoView({block:'center',behavior:'smooth'});}});
}
function openSheet(on){$('#sheet').classList.toggle('open',on);$('#scrim').hidden=!on||wide();}

/* ---------- 描画 ---------- */
function daysSinceExport(){const t=Number(ls.get(KEY_EXPORT)||0);return t?Math.floor((Date.now()-t)/864e5):null;}
function render(){
  const act=document.activeElement; const keep=act&&act.id==='addIn'?{v:act.value}:null;
  if(S.theme&&!S.nodes.has(S.theme))S.theme=null;
  if(!S.theme){const sv=ls.get(KEY_THEME);S.theme=(sv&&S.nodes.has(sv)&&!S.nodes.get(sv).parent)?sv:(roots()[0]?.id||null);}
  if(S.sel&&!S.nodes.has(S.sel))S.sel=null; if(S.focus&&!S.nodes.has(S.focus))S.focus=null;
  renderTabs(); renderMain(); renderSheet();
  if(keep){const i=$('#addIn');if(i){i.value=keep.v;i.focus();}}
}
const THEMES_HTML=`<div class="themes" id="themes"></div><form class="newtheme" id="themeForm" hidden><input id="themeInput" placeholder="起点の行動（例：家を借りる）" aria-label="起点の行動" autocomplete="off"><button class="btn pri" type="submit">作る</button><button class="btn icon" type="button" id="themeCancel" aria-label="やめる">✕</button></form>`;
function renderThemes(){const el=$('#themes');if(!el)return;
  el.innerHTML=roots().map(r=>`<button class="chip" data-theme-id="${esc(r.id)}" aria-pressed="${r.id===S.theme}">${esc(r.text)}</button>`).join('')+`<button class="chip ghost" id="themeNew">＋ 新しい行動</button>`;
  el.querySelectorAll('[data-theme-id]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeId;S.focus=null;ls.set(KEY_THEME,S.theme);S.sel=null;S.adding=null;S.tab='tree';render();openSheet(false);});
  $('#themeNew').onclick=()=>{S.themeStart=true;renderMain();window.scrollTo({top:0});};
  $('#themeForm').onsubmit=e=>{e.preventDefault();const v=$('#themeInput').value;$('#themeInput').value='';$('#themeForm').hidden=true;addTheme(v);};
  $('#themeCancel').onclick=()=>{$('#themeForm').hidden=true;};
}
$('#brandHome').onclick=()=>{S.themeStart=false;S.tab='tree';S.sel=null;S.adding=null;S.focus=null;openSheet(false);render();window.scrollTo({top:0});};
document.querySelectorAll('.bottom [data-area]').forEach(b=>b.onclick=()=>{const a=b.dataset.area,cur=AREA_OF[S.tab];
  S.themeStart=false;
  if(a==='seed')S.tab=cur==='seed'?'tree':(S.lastSeed||'tree');
  else if(a==='biz'){if(cur==='biz')S.ideaSel=null;S.tab='idea';}
  else S.tab='data';
  openSheet(false);render();window.scrollTo({top:0});});
const AREA_OF={tree:'seed',same:'seed',seed:'seed',idea:'biz',data:'data'};
function renderTabs(){const area=AREA_OF[S.tab]||'seed';if(area==='seed')S.lastSeed=S.tab;
  $('#subnav').hidden=area!=='seed';
  document.querySelectorAll('#subnav [data-tab]').forEach(t=>{t.setAttribute('aria-pressed',String(t.dataset.tab===S.tab));t.onclick=()=>{S.tab=t.dataset.tab;if(S.tab!=='tree')openSheet(false);render();window.scrollTo({top:0});};});
  document.querySelectorAll('.bottom [data-area]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.area===area)));
  $('#n-same').textContent=[...tagIndex().values()].filter(a=>a.length>=2).length||'';
  $('#n-seed').textContent=[...S.nodes.values()].filter(n=>n.seed).length||'';
}
function badges(n){const o=[];const fr=(n.frictions||[]).length;
  const st=rstatus(n);if(st==='gone')o.push(`<span class="b b-gone">理由が消えた</span>`);else if(st==='fading')o.push(`<span class="b b-fade">理由が薄れている</span>`);
  const star=(n.reasons||[]).find(r=>r.star);if(star)o.push(`<span class="b b-star">★ ${esc(star.text.length>18?star.text.slice(0,18)+'…':star.text)}</span>`);
  const ls=lensScore(n);if(ls.total)o.push(`<span class="b b-res">解像度 ${ls.total}/12</span>`);
  if(fr)o.push(`<span class="b b-fr">摩擦のサイン ${fr}つ</span>`);
  for(const t of(n.tags||[]))o.push(`<span class="b b-tag">本質：${esc(t)}</span>`);
  if(n.seed)o.push(`<span class="b b-seed">タネ ${scoreOf(n)}点</span>`);
  return o.join('');}
function renderMain(){const m=$('#main');if(S.tab==='tree')return renderTree(m);if(S.tab==='same')return renderSame(m);if(S.tab==='seed')return renderSeeds(m);if(S.tab==='idea')return renderIdeas(m);return renderData(m);}

/* ---------- ツリー ---------- */
function addHint(n,mode){
  if(mode==='up')return `「${n.text}」は、何のためにやっている？　答えをこの行動の1段上に入れます。`;
  if(mode==='down')return `「${n.text}」を、具体的にはどうやっている？　この行動の1段下に入れます。続けて何個でも追加できます。`;
  const p=n.parent&&S.nodes.get(n.parent);return p?`「${p.text}」のために、ほかにどんな行動をしている？　この行動と同じ段に入れます。`:'';
}
function renderTree(m){
  if(S.themeStart){
    m.innerHTML=`<div class="list"><div><button class="back" id="themeStartBack">‹ タネ探しに戻る</button></div>
      <div class="card intro-choice intro-frame">
      <div class="welcome-heading"><h3>新しい行動</h3><span class="frame-step">タネ探しを始める</span></div>
      <div class="welcome-panel choice-panel"><h4>どうやって始めますか？</h4>
        <div class="card ai-flow theme-ai-card">
          <button class="btn entry-option" id="themeStartAI" aria-expanded="true" aria-controls="themeAIActions"><strong>AIと一緒に考える</strong><small>AIと対話してタネを探す</small></button>
          <div class="seed-ai-actions" id="themeAIActions">
          <div class="ai-flow-choice">
            <strong>① AIを開く</strong>
            ${S.nodes.size?'<label class="ai-data-choice"><input type="checkbox" id="themeIncludeData">保存済みの行動も共有</label>':''}
            <div class="ai-provider-links" aria-label="対話するAIを選ぶ">
    <a class="btn ai-provider" data-ai-provider="chatgpt" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a>
    <a class="btn ai-provider" data-ai-provider="claude" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Claude ↗</a>
  </div>
          </div>
          <div class="ai-flow-step">
            <strong>② 結果を取り込む</strong>
            <p class="muted">対話の最後に「保存」と送る</p>
            <button class="btn ai-secondary" id="themeGoImport">JSONを取り込む →</button>
          </div>
        </div>
        </div>
        <button class="btn entry-option" id="themeStartManual"><strong>自分で行動を入力 →</strong><small>起点の行動を入力する</small></button>

function bigrams(s){const t=s.replace(/\s/g,'');const a=new Set();for(let i=0;i<t.length-1;i++)a.add(t.slice(i,i+2));return a;}
function sim(a,b){const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let x=0;for(const g of A)if(B.has(g))x++;return x/(A.size+B.size-x);}
function similarGroups(){const ns=[...S.nodes.values()].filter(n=>n.parent&&(n.text||'').length>=3);
  const par=new Map(ns.map(n=>[n.id,n.id]));const find=x=>{while(par.get(x)!==x)x=par.get(x);return x;};
  const isAnc=(a,b)=>pathOf(b).some(p=>p.id===a);
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){const a=ns[i],b=ns[j];
    if((a.tags||[]).some(t=>(b.tags||[]).includes(t)))continue; if(isAnc(a.id,b.id)||isAnc(b.id,a.id))continue;
    if(a.text.trim()===b.text.trim()||sim(a.text,b.text)>=0.5)par.set(find(a.id),find(b.id));}
  const g=new Map();for(const n of ns){const r=find(n.id);if(!g.has(r))g.set(r,[]);g.get(r).push(n);}
  return [...g.values()].filter(a=>a.length>=2).slice(0,12);}

/* AI提案は既存行動のtagsだけを変える。バックアップの上書きは使わない。 */
function normalizeTagSuggestions(o){
  const rows=new Map();let missing=0;
  for(const suggestion of o.suggestions||[]){
    if(!suggestion||typeof suggestion.id!=='string')continue;
    const n=S.nodes.get(suggestion.id);
    if(!n){missing++;continue;}
    if(!rows.has(n.id))rows.set(n.id,{id:n.id,text:n.text,path:pathOf(n.id).slice(0,-1).map(p=>p.text).join(' › '),tags:[]});
    const row=rows.get(n.id);
    const already=new Set(Array.isArray(n.tags)?n.tags:[]);
    for(const v of Array.isArray(suggestion.tags)?suggestion.tags:[]){
      if(typeof v!=='string')continue;
      const tag=v.trim().slice(0,30);
      if(!tag||already.has(tag)||row.tags.includes(tag))continue;
      if(row.tags.length>=3)break;
      row.tags.push(tag);
    }
  }
  return {rows:[...rows.values()],missing};

/* 長押し直後の指は元のカードがtouchイベントの対象のまま。

let ideaMenuTouchGesture=null;

  const t=e.touches[0];
  ideaMenuTouchGesture={id:t.identifier,x:t.clientX,y:t.clientY,moved:false};
  ideaMenuHover(t.clientX,t.clientY);
},{passive:true});
$('#ideaMenu').addEventListener('touchmove',e=>{
  if(!ideaMenuTouchGesture)return;
  const t=Array.from(e.touches).find(t=>t.identifier===ideaMenuTouchGesture.id);

  if(e.cancelable)e.preventDefault();
  if(Math.hypot(t.clientX-ideaMenuTouchGesture.x,t.clientY-ideaMenuTouchGesture.y)>6)ideaMenuTouchGesture.moved=true;
  ideaMenuHover(t.clientX,t.clientY);
},{passive:false});
$('#ideaMenu').addEventListener('touchend',e=>{
  if(!ideaMenuTouchGesture)return;

  if(!t)return;
  const moved=ideaMenuTouchGesture.moved;
  ideaMenuTouchGesture=null;

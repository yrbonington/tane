<style>
/* 現場ノート：はしご（上が抽象、字下げするほど具体）を作業面にし、選んだ行動の場で操作する。分析シートは下からせり上がる。 */
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#16202A; --ink-2:#56626C; --line:#D5DDDB;
  --accent:#2C47C4; --accent-soft:rgba(44,71,196,.10); --on-accent:#FFFFFF;
  --seed:#B9DA4A; --seed-soft:rgba(185,218,74,.45); --seed-ink:#1F2A00;
  --warn:#B86A1C; --warn-soft:rgba(184,106,28,.12);
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#111518; --surface:#192024; --ink:#E5ECEA; --ink-2:#9AA6A3; --line:#2A3338;
  --accent:#8FA3FF; --accent-soft:rgba(143,163,255,.14); --on-accent:#0D1240;
  --seed:#B3D34C; --seed-soft:rgba(179,211,76,.30); --seed-ink:#1A2300;
  --warn:#E3A35A; --warn-soft:rgba(227,163,90,.14); color-scheme:dark } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(160px + env(safe-area-inset-bottom))}

.bar{position:sticky;top:0;z-index:15;background:var(--paper);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:2px;border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-weight:800;font-size:21px;letter-spacing:.06em;margin:0;line-height:1.2}
.status{font-size:11px;color:var(--ink-2);white-space:nowrap}
.status.alert{color:var(--warn);font-weight:700}
.themes{display:flex;gap:8px;margin:0 -16px 8px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.ghost{background:transparent;border-style:dashed;color:var(--ink-2)}
.newtheme{display:flex;gap:6px;margin:0 0 10px}
.newtheme input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.subnav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:10px 0 10px}
.subnav button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--ink-2);font-weight:600}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.subnav .n{font-family:var(--f-mono);font-size:11px;margin-left:3px;opacity:.8}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--ink-2);font-size:11px}
.bottom svg{width:24px;height:24px}
.bottom button[aria-current="true"]{color:var(--ink);font-weight:700}
@media (min-width:900px){ .bottom{left:50%;right:auto;width:520px;transform:translateX(-50%);border:1px solid var(--line);border-radius:16px 16px 0 0} }
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:14px}
@media (min-width:900px){ .grid{grid-template-columns:minmax(0,1fr) 420px;align-items:start} }

.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.focusbar button{border:0;background:none;color:var(--accent);padding:2px 4px;border-radius:4px}
.tapnote{font-size:12px;color:var(--ink-2);margin:0 0 8px}
.rows{display:flex;flex-direction:column;gap:2px}
.item{min-width:0}
.row{display:flex;align-items:stretch;gap:2px;min-width:0}
.indent{flex:none;display:flex}
.indent i{width:16px;flex:none;border-left:1px solid var(--line);margin-left:7px}
.caret{width:30px;flex:none;border:0;background:none;color:var(--ink-2);font-size:11px;border-radius:6px}
.caret:disabled{visibility:hidden}
.node{flex:1;min-width:0;min-height:44px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.item.sel .node{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line1{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.node .t{flex:1;min-width:0;overflow-wrap:anywhere}
.node.root .t{font-weight:700;font-size:17px}
.lv{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-left:2px}
.b{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.b-fr{background:var(--warn-soft);color:var(--warn)}
.b-gone{background:var(--seed);color:var(--seed-ink);font-weight:700}
.b-fade{background:var(--seed-soft);color:var(--ink)}
.b-tag{background:var(--accent-soft);color:var(--accent)}
.b-seed{background:var(--ink);color:var(--paper)}
@media (max-width:600px){ .actions,.addbox{padding-left:0!important} }
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:8px 0 10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.act b{font-size:14px;font-weight:700}
.act b i{font-style:normal;color:var(--accent);margin-right:4px}
.act small{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.main b i,.act.main small{color:var(--on-accent)}
.inline{display:flex;gap:6px;align-items:center}
.inline input{flex:1;min-width:0;border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:9px 10px}
.addbox{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
.hint{font-size:12px;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{width:40px;padding:8px 0}
.btn.danger{color:var(--warn)}
.quick{margin-top:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--ink-2);background:var(--surface)}
.empty b{color:var(--ink)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){ .sheet{position:sticky;top:120px;max-height:calc(100vh - 200px);overflow:auto} .sheet .close,.grab{display:none} }
@media (max-width:899px){
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .sheet.open{transform:none}
}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} }
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 0}
.sheet-h{display:flex;gap:10px;align-items:flex-start}
.crumb{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.close{margin-left:auto;border:1px solid var(--line);background:none;border-radius:999px;width:36px;height:36px;flex:none}
.title-in{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font-size:18px;font-weight:700;padding:4px 0;border-radius:0}
.title-in:focus{outline:none;border-color:var(--accent)}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-radius:10px;padding:3px;gap:3px}
.stabs button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;color:var(--ink-2)}
.stabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:700}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px}
.tg[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.tg.seedtg[aria-pressed="true"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 2px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.seg button[data-v="gone"][aria-pressed="true"]{background:var(--seed);color:var(--seed-ink)}
.callout{background:var(--seed-soft);border-radius:8px;padding:8px 12px;font-size:13px}
label.f{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;resize:vertical;min-height:64px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagx{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 10px;font-size:13px}
.score{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.dots{display:flex;gap:3px}
.dots button{width:34px;height:32px;border:1px solid var(--line);background:none;border-radius:6px;font-family:var(--f-mono);font-size:12px}
.dots button[aria-pressed="true"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink);font-weight:700}
.total{font-family:var(--f-mono);font-size:13px}
.muted{color:var(--ink-2);font-size:13px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-align:left}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h4 .sp{flex:1}
.hit{text-align:left;border:0;background:none;padding:6px 0;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.hit .ht{flex:1;min-width:0}
.hit b{font-weight:500;display:block}
.hit small{color:var(--ink-2);font-size:12px;overflow-wrap:anywhere;display:block}
.thm{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;color:var(--ink-2);flex:none}
.mark{background:linear-gradient(transparent 55%,var(--seed-soft) 55%)}
.bars{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.bars span{display:flex;align-items:center;gap:3px}
.bars i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--seed)}
.h2{font-size:13px;letter-spacing:.1em;color:var(--ink-2);margin:8px 0 0;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.stat b{font-family:var(--f-mono);font-size:18px;color:var(--ink);display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:25}
@media (min-width:900px){ .scrim{display:none} }

.topr{display:flex;align-items:center;gap:8px;min-width:0}
.aibtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.ideacard{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.st-idea{background:var(--accent-soft);color:var(--accent)}
.st-testing{background:var(--seed);color:var(--seed-ink);font-weight:700}
.st-hold{background:var(--line);color:var(--ink-2)}
.st-dropped{background:var(--line);color:var(--ink-2);text-decoration:line-through}
.fits{display:flex;flex-wrap:wrap;gap:4px}
.fm{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--ink-2)}
.fm-ok{background:var(--seed-soft);color:var(--ink);border-color:transparent}
.fm-mid{border-color:var(--warn);color:var(--warn)}
.fm-ng{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.nextline{font-size:13px;border-left:3px solid var(--accent);padding-left:8px}
.back{border:0;background:none;color:var(--accent);padding:4px 0;font-size:15px}
.fit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.tri{display:flex;gap:4px}
.tri button{width:42px;height:36px;border:1px solid var(--line);background:none;border-radius:8px;font-size:15px}
.tri button[aria-pressed="true"][data-v="ok"]{background:var(--seed);border-color:var(--seed);color:var(--seed-ink);font-weight:700}
.tri button[aria-pressed="true"][data-v="mid"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.tri button[aria-pressed="true"][data-v="ng"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
label.f .q{font-size:14px;font-weight:700;color:var(--ink)}
label.f small{font-size:12px}
.srcchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:4px 4px 4px 12px;max-width:100%}
.srcchip .linkbtn{overflow-wrap:anywhere}
.srcx{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 8px}
.big{width:100%;padding:13px;font-size:16px;text-align:center;white-space:normal}
a.btn{display:block;text-decoration:none;color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.entry-option{text-align:left;width:100%;white-space:normal;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px}
.entry-option strong{font-size:16px}.entry-option small{font-size:13px;color:var(--ink-2);white-space:normal}
.entry-option.pri small{color:var(--on-accent)}
.biz-section{display:block}
.biz-section>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
.biz-section>summary::-webkit-details-marker{display:none}
.biz-section>summary:after{content:'⌄';float:right;color:var(--ink-2);font-size:17px}
.biz-section[open]>summary:after{content:'⌃'}
.biz-fields{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.import-review{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;background:var(--surface)}
.import-review ul{margin:0;padding-left:20px;font-size:13px}
.origin{font-size:12px;color:var(--ink-2);line-height:1.5}


/* =========================================================
   タネ帳 UI v2 — ChatGPT-inspired minimal design language
   Independent product identity; no OpenAI trademarks/assets.
   ========================================================= */
:root{
  --paper:#FFFFFF;
  --surface:#F7F7F8;
  --ink:#202123;
  --ink-2:#696B70;
  --line:#E7E7EA;
  --accent:#202123;
  --accent-soft:#EBECEF;
  --on-accent:#FFFFFF;
  --seed:#E4F3E8;
  --seed-soft:#EFF8F1;
  --seed-ink:#22623F;
  --warn:#A45B11;
  --warn-soft:#FFF1DD;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#202020;
    --surface:#2B2B2B;
    --ink:#F3F3F3;
    --ink-2:#B8B8BC;
    --line:#434343;
    --accent:#F3F3F3;
    --accent-soft:#393939;
    --on-accent:#171717;
    --seed:#244734;
    --seed-soft:#213A2D;
    --seed-ink:#D1F1DE;
    --warn:#E8AD72;
    --warn-soft:#493522;
    color-scheme:dark;
  }
}
body{font-size:15px;line-height:1.63;letter-spacing:.005em}
.wrap{max-width:1100px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:calc(132px + env(safe-area-inset-bottom))}
.bar{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar-top{gap:14px;min-height:54px;padding-bottom:12px}
.heading{display:flex;flex-direction:column;gap:0;min-width:0}
.eyebrow{display:block;font-size:11px;line-height:1.6;color:var(--ink-2);font-weight:650;letter-spacing:.055em}
h1{font-size:23px;line-height:1.25;letter-spacing:-.027em;font-weight:750}
.status{font-size:11px;line-height:1.3;border-radius:999px;background:var(--surface);color:var(--ink-2);padding:7px 9px;max-width:45%;text-align:center;white-space:normal}
.status.alert{color:var(--warn);background:var(--warn-soft)}
.subnav{border:0;background:var(--surface);border-radius:999px;padding:5px;gap:4px;margin:2px 0 7px}
.subnav button{min-width:0;padding:10px 5px;border-radius:999px;font-size:13px;line-height:1.3;font-weight:600;transition:background .16s ease,color .16s ease}
.subnav button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.grid{margin-top:18px;gap:22px}
.list{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:19px;gap:13px}
.card h4{font-size:17px;line-height:1.4;font-weight:700;letter-spacing:-.015em}
.card p{line-height:1.65}
.h2{color:var(--ink-2);font-size:12px;font-weight:750;letter-spacing:.06em;margin:10px 0 0}
.muted{color:var(--ink-2);font-size:13px;line-height:1.6}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;line-height:1.7}
.empty b{font-size:17px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:650;line-height:1.35;transition:background .15s ease,transform .15s ease}

:root{

  --line:#E3E4E8;

  --panel-line:#EDEEF1;

}

    --paper:#0B0B0D;
    --surface:#242426;
    --ink:#F8F8FA;
    --ink-2:#B3B4BC;

    <div class="subnav" id="subnav" role="tablist">
      <button data-tab="tree">ツリー</button>
      <button data-tab="same">つながり<span class="n" id="n-same"></span></button>

    </div>
  </header>
  <div class="grid">
    <main id="main" style="min-width:0"></main>
    <aside class="sheet" id="sheet" aria-label="選んだ行動の分析"></aside>

<nav class="bottom" aria-label="メインメニュー">
  <button data-area="seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg><span>タネ探し</span></button>
  <button data-area="biz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/><path d="M15 8h3v3"/></svg><span>事業化</span></button>
  <button data-area="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10h8M8 14h5"/><path d="M20 11.5a8 8 0 0 1-8 8c-1.4 0-2.9-.4-4.1-1.1L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/></svg><span>AIと対話</span></button>
  <button data-area="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>データ</span></button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const KEY='tane.v1', KEY_EXPORT='tane.lastExport', KEY_THEME='tane.theme';
const FRICTIONS=[['parties','複数の当事者'],['docs','書類・情報の手渡し'],['money','お金が動く'],['wait','待ち時間'],['manual','手作業'],['repeat','毎回やり直し']];
const STATUS=[['still','まだある'],['fading','薄れている'],['gone','もう無い'],['unknown','未確認']];
const ELEMENTS=[['alt','代わりの手段で無理やり済ませている'],['now','「なぜ今」がある（技術・規制・コストの変化）'],['money','お金がすでに別の名目で使われている'],['repeat','繰り返し起こり、広がっている'],['gap','大手がやりたがらない理由がある']];
const S={ideas:new Map(),ideaSel:null,nodes:new Map(),theme:null,sel:null,focus:null,tab:'tree',collapsed:new Set(),detailFor:null,sheetTab:'cut',adding:null,renaming:null,importText:null,confirmReplace:false,themeStart:false,pendingImport:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const wide=()=>matchMedia('(min-width:900px)').matches;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}

/* ---------- 端末内の保存 ---------- */
function loadAll(){ try{ const o=JSON.parse(ls.get(KEY)||'null'); if(o&&Array.isArray(o.nodes)) S.nodes=new Map(o.nodes.filter(n=>n&&n.id).map(n=>[n.id,n])); if(o&&Array.isArray(o.ideas)) S.ideas=new Map(o.ideas.filter(n=>n&&n.id).map(n=>[n.id,n])); }catch(e){} }
let saveTimer=null;
function saveNow(){ const ok=ls.set(KEY,JSON.stringify({version:2,savedAt:Date.now(),nodes:[...S.nodes.values()],ideas:[...S.ideas.values()]})); if(!ok) toast('保存できませんでした。端末の空き容量を確認してください。'); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,300); }
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNow(); });

function blank(text,parent,order){return{text,parent,order,frictions:[],why:'',constraint:'',status:'',tags:[],seed:false,scores:{},memo:'',created:Date.now()};}
function put(id,data){ S.nodes.set(id,{id,...data}); saveSoon(); render(); }
function patch(id,data,quiet){ const n=S.nodes.get(id); if(!n) return; Object.assign(n,data); saveSoon(); if(!quiet) render(); else { renderMain(); renderTabs(); } }
function remove(id){ S.nodes.delete(id); }
const timers={};
function patchLater(id,field,value){ clearTimeout(timers[id+field]); timers[id+field]=setTimeout(()=>patch(id,{[field]:value},true),400); }

/* ---------- ツリーの道具 ---------- */
const kids=id=>[...S.nodes.values()].filter(n=>(n.parent||null)===id).sort((a,b)=>(a.order??0)-(b.order??0)||(a.created??0)-(b.created??0));
const roots=()=>kids(null);
function pathOf(id){const p=[];let n=S.nodes.get(id),g=0;while(n&&g++<60){p.unshift(n);n=n.parent?S.nodes.get(n.parent):null;}return p;}
const rootOf=id=>pathOf(id)[0]?.id||null;
const depth=id=>pathOf(id).length-1;
function descendants(id){const o=[];const w=x=>{for(const k of kids(x)){o.push(k.id);w(k.id);}};w(id);return o;}
const scoreOf=n=>ELEMENTS.reduce((s,[k])=>s+(Number(n.scores?.[k])||0),0);
const themeName=id=>S.nodes.get(rootOf(id))?.text||'';
function tagIndex(){const m=new Map();for(const n of S.nodes.values())for(const t of(n.tags||[])){if(!m.has(t))m.set(t,[]);m.get(t).push(n);}return m;}

/* ---------- 操作 ---------- */
function addChild(pid,text){const t=text.trim();if(!t)return null;const id=newId();const ks=kids(pid);S.collapsed.delete(pid);put(id,blank(t,pid,ks.length?Math.max(...ks.map(k=>k.order??0))+1:0));return id;}
function addParent(id,text){const t=text.trim();const n=S.nodes.get(id);if(!t||!n)return null;const pid=newId();
  S.nodes.set(pid,{id:pid,...blank(t,n.parent||null,n.order??0)}); n.parent=pid; n.order=0;
  if(S.theme===id){S.theme=pid;ls.set(KEY_THEME,pid);} if(S.focus===id)S.focus=pid; saveSoon(); return pid;}
function addSibling(id,text){const n=S.nodes.get(id);if(!n)return null;if(!n.parent)return addTheme(text);const t=text.trim();if(!t)return null;
  const sib=kids(n.parent);const i=sib.findIndex(s=>s.id===id);const nid=newId();
  S.nodes.set(nid,{id:nid,...blank(t,n.parent,0)});
  const after=[...sib.slice(0,i+1),S.nodes.get(nid),...sib.slice(i+1)]; after.forEach((x,k)=>x.order=k); saveSoon(); return nid;}
function addTheme(text){const t=text.trim();if(!t)return null;const id=newId();S.nodes.set(id,{id,...blank(t,null,roots().length)});S.theme=id;S.focus=null;ls.set(KEY_THEME,id);saveSoon();select(id,false);return id;}
function delNode(id){const n=S.nodes.get(id);if(!n)return;const all=[id,...descendants(id)];
  S.sel=n.parent||null;S.detailFor=null;S.adding=null;if(S.focus&&all.includes(S.focus))S.focus=null;if(!n.parent)S.theme=null;
  for(const x of all)remove(x); saveSoon(); render(); toast('削除しました');}
function move(id,dir){const n=S.nodes.get(id);const sib=kids(n.parent||null);const i=sib.findIndex(s=>s.id===id);const j=i+dir;if(j<0||j>=sib.length)return;
  const r=[...sib];r.splice(i,1);r.splice(j,0,n);r.forEach((x,k)=>x.order=k);saveSoon();render();}
function select(id,openDetail){
  if(S.sel!==id){S.adding=null;}
  S.sel=id; if(id){const r=rootOf(id);if(r&&r!==S.theme){S.theme=r;S.focus=null;ls.set(KEY_THEME,r);}}
  S.tab='tree'; render(); if(openDetail) openSheet(true);
  if(id) requestAnimationFrame(()=>{const el=document.querySelector(`[data-item="${CSS.escape(id)}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<170||r.bottom>innerHeight-20)el.scrollIntoView({block:'center',behavior:'smooth'});}});
}
function openSheet(on){$('#sheet').classList.toggle('open',on);$('#scrim').hidden=!on||wide();}

/* ---------- 描画 ---------- */
function daysSinceExport(){const t=Number(ls.get(KEY_EXPORT)||0);return t?Math.floor((Date.now()-t)/864e5):null;}
function render(){
  const act=document.activeElement; const keep=act&&act.id==='addIn'?{v:act.value}:null;
  const d=daysSinceExport(); const st=$('#status');
  if(S.nodes.size && (d===null||d>=7)){ st.textContent=d===null?'バックアップ未作成':`バックアップ ${d}日前`; st.className='status alert'; }
  else { st.textContent='この端末に保存'; st.className='status'; }
  if(S.theme&&!S.nodes.has(S.theme))S.theme=null;
  if(!S.theme){const sv=ls.get(KEY_THEME);S.theme=(sv&&S.nodes.has(sv)&&!S.nodes.get(sv).parent)?sv:(roots()[0]?.id||null);}
  if(S.sel&&!S.nodes.has(S.sel))S.sel=null; if(S.focus&&!S.nodes.has(S.focus))S.focus=null;
  renderTabs(); renderMain(); renderSheet();
  if(keep){const i=$('#addIn');if(i){i.value=keep.v;i.focus();}}
}

/* ---------- つながり ---------- */
function bigrams(s){const t=s.replace(/\s/g,'');const a=new Set();for(let i=0;i<t.length-1;i++)a.add(t.slice(i,i+2));return a;}
function sim(a,b){const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let x=0;for(const g of A)if(B.has(g))x++;return x/(A.size+B.size-x);}
function similarGroups(){const ns=[...S.nodes.values()].filter(n=>n.parent&&(n.text||'').length>=3);
  const par=new Map(ns.map(n=>[n.id,n.id]));const find=x=>{while(par.get(x)!==x)x=par.get(x);return x;};
  const isAnc=(a,b)=>pathOf(b).some(p=>p.id===a);
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){const a=ns[i],b=ns[j];
    if((a.tags||[]).some(t=>(b.tags||[]).includes(t)))continue; if(isAnc(a.id,b.id)||isAnc(b.id,a.id))continue;
    if(a.text.trim()===b.text.trim()||sim(a.text,b.text)>=0.5)par.set(find(a.id),find(b.id));}
  const g=new Map();for(const n of ns){const r=find(n.id);if(!g.has(r))g.set(r,[]);g.get(r).push(n);}
  return [...g.values()].filter(a=>a.length>=2).slice(0,12);}
function hitBtn(n){return `<button class="hit" data-go="${esc(n.id)}"><span class="ht"><b>${esc(n.text)}</b><small>${esc(pathOf(n.id).slice(1,-1).map(p=>p.text).join(' › '))}</small></span><span class="thm">${esc(themeName(n.id))}・L${depth(n.id)}</span></button>`;}
function bindGo(m){m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go,true));}
function renderSame(m){
  const groups=[...tagIndex().entries()].map(([t,ns])=>({t,ns,themes:new Set(ns.map(n=>rootOf(n.id))).size})).sort((a,b)=>b.themes-a.themes||b.ns.length-a.ns.length);
  const cross=groups.filter(g=>g.themes>=2),within=groups.filter(g=>g.themes<2&&g.ns.length>=2),single=groups.filter(g=>g.ns.length<2);const cand=similarGroups();
  const card=g=>`<div class="card"><h4><span class="${g.ns.length>=2?'mark':''}">${esc(g.t)}</span><span class="b ${g.themes>=2?'b-gone':'b-tag'}">${g.themes>=2?`${g.themes}テーマ・`:''}${g.ns.length}か所</span><span class="sp"></span><button class="linkbtn" data-mkidea-tag="${esc(g.t)}">事業案にする</button><button class="linkbtn" data-rename="${esc(g.t)}">名前を変える</button></h4>
    ${S.renaming===g.t?`<form class="inline" data-renform="${esc(g.t)}"><input value="${esc(g.t)}" aria-label="新しい名前"><button class="btn pri sm" type="submit">変更</button></form>`:''}${g.ns.map(hitBtn).join('')}</div>`;
  m.innerHTML=`<div class="list">
    <p class="muted" style="margin:0">行動ごとに「本質的には何をしているか」を書くと、同じ本質を持つ行動がここに集まります。「車の」など場面の言葉を外した書き方（例：モノの価値を決める）にすると、テーマをまたいでつながりやすくなります。</p>
    <p class="h2">テーマをまたいでつながる本質</p>${cross.length?cross.map(card).join(''):`<div class="muted">2つ以上のテーマで同じ本質が書かれると、ここに出ます。</div>`}
    <p class="h2">同じテーマの中で繰り返し出てくる本質</p>${within.length?within.map(card).join(''):`<div class="muted">まだありません。</div>`}
    <p class="h2">文言が似ている行動（同じ本質かもしれないもの）</p>
    ${cand.length?cand.map((ns,i)=>`<div class="card"><h4>${esc(ns[0].text)}<span class="b b-tag">${ns.length}か所</span></h4>${ns.map(hitBtn).join('')}<form class="inline" data-candform="${i}"><input placeholder="共通の本質（例：審査を受ける）" aria-label="共通の本質"><button class="btn sm" type="submit">この本質でまとめる</button></form></div>`).join(''):`<div class="muted">文言が似ている行動が見つかると、ここに候補として出ます。</div>`}
    ${single.length?`<p class="h2">1か所だけの本質</p><div class="card">${single.map(g=>`<div class="tags"><span class="b b-tag">${esc(g.t)}</span></div>${g.ns.map(hitBtn).join('')}`).join('')}</div>`:''}
  </div>`;
  bindGo(m); bindMkIdea(m);
  m.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{S.renaming=S.renaming===b.dataset.rename?null:b.dataset.rename;renderMain();const i=m.querySelector('[data-renform] input');if(i)i.focus();});
  m.querySelectorAll('[data-renform]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const from=f.dataset.renform;const to=f.querySelector('input').value.trim();S.renaming=null;
    if(to&&to!==from){for(const n of S.nodes.values())if((n.tags||[]).includes(from))n.tags=[...new Set(n.tags.map(t=>t===from?to:t))];saveSoon();toast('名前を変えました');}render();});
  m.querySelectorAll('[data-candform]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;const ns=cand[Number(f.dataset.candform)];
    for(const n of ns){const cur=n.tags||[];if(!cur.includes(v))n.tags=[...cur,v];}saveSoon();render();toast(`「${v}」で${ns.length}か所をまとめました`);});
}
function renderSeeds(m){const all=[...S.nodes.values()];
  const seeds=all.filter(n=>n.seed).sort((a,b)=>scoreOf(b)-scoreOf(a));
  const gone=all.filter(n=>!n.seed&&(n.status==='gone'||n.status==='fading'));
  const dig=all.filter(n=>!n.seed&&(n.frictions||[]).length>=2&&!n.why&&!n.constraint);

  </div>`; bindGo(m); bindMkIdea(m);}

/* ---------- データ（バックアップ） ---------- */
function exportJSON(){return JSON.stringify({app:'tane',version:2,exportedAt:Date.now(),nodes:[...S.nodes.values()],ideas:[...S.ideas.values()]},null,1);}
function stamp(){const d=new Date();const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;}
function markExported(){ls.set(KEY_EXPORT,String(Date.now()));render();}
function parseBackup(text){let o=null;const t=String(text||'').trim();
  try{o=JSON.parse(t);}catch(e){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{o=JSON.parse(t.slice(a,b+1));}catch(e2){}}}
  if(!o||typeof o!=='object') throw new Error('JSONとして読み取れませんでした。AIの出力やバックアップの中身を、最初の { から最後の } まで丸ごと貼ってください。');
  const arr=Array.isArray(o)?o:Array.isArray(o.nodes)?o.nodes:[]; const iarr=Array.isArray(o.ideas)?o.ideas:[];
  const nodes=arr.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string').map(n=>({...blank('',null,0),...n}));
  const ideas=iarr.filter(x=>x&&typeof x.id==='string').map(x=>({...blankIdea('',[]),...x,title:String(x.title||'無題の事業案')}));
  if(!nodes.length&&!ideas.length) throw new Error('読み込める行動や事業案が入っていませんでした。');
  return {nodes,ideas};}
function importData(d,outSel){let add=0,upd=0,ia=0,iu=0;
  for(const n of d.nodes){if(S.nodes.has(n.id))upd++;else add++;S.nodes.set(n.id,n);}
  for(const x of d.ideas){if(S.ideas.has(x.id))iu++;else ia++;S.ideas.set(x.id,x);}
  saveNow();S.sel=null;S.detailFor=null;S.focus=null;S.theme=null;S.ideaSel=null;render();
  const el=$(outSel);if(el)el.textContent=`取り込みました：行動 新規${add}件・更新${upd}件／事業案 新規${ia}件・更新${iu}件`;toast('取り込みました');}
function reviewImport(d){

    ${d.nodes.length+d.ideas.length>7?'<span class="muted">ほかにも取り込むデータがあります。</span>':''}

/* ---------- AIと対話 ---------- */
const PROMPT_SEED="あなたは「市場のタネ帳」の相棒です。わたしが日常や仕事で観察した人の行動を一緒に分解し、新しい市場のタネを探します。最後に、タネ帳アプリに読み込めるJSONを出力します。\n\n# あなたの役割\n- この会話は「広げる」段階です。判断を急がず、小さな違和感や、当たり前すぎて誰も気にしていない行動も拾います。事業として成り立つかの厳しい評価はしません（それは事業化の段階でやります）。\n- わたしの観察を引き出し、整理し、問いを投げる相棒です。答えを決めるのはわたしです。\n- わたしが見たこと（事実）と、あなたの推測（仮説）をはっきり分けてください。あなたの推測を書くときは、文頭に「仮説：」と付けます。\n- わたしが言っていない行動や事実を、勝手に足さないでください。候補を出すのは歓迎ですが、採用するかはわたしが決めます。\n\n# 話し方\n- 日本語で、スマホで読みやすいように短く話してください。1回の返事は、長くても画面1枚分までにします。\n- 質問は1回に1つだけにします。\n- 前置きや褒め言葉は省き、すぐ本題に入ります。\n\n# 進め方\n次の順に進めます。わたしが別の順を望んだら、それに合わせてください。\n\n1. 始める\n   最初に「新しいテーマを始めますか？それとも、タネ帳から書き出したJSONを貼りますか？」と聞いてください。\n   - JSONが貼られたら、中身を読み取り、テーマと行動のツリーを短くまとめて見せてから続けます。\n   - 新しいテーマなら、テーマ名（例：家を借りる）を聞きます。\n\n2. 行動を書き出す\n   そのテーマで人がやっている行動を、思いつくまま挙げてもらいます。違和感がなくても、普通にやっている行動で構いません。\n   書き出しが終わったら、番号付きの一覧にして見せます。\n\n3. 上下に動かす（抽象化・具体化）\n   気になる行動を1つ選んでもらい、次の2つの問いで上下に動かします。\n   - 抽象化：「それは何のためにやっている？」（答えを1段上に置く）\n   - 具体化：「具体的にはどうやっている？」（答えを1段下に置く）\n   複数の当事者が関わる、書類や情報を人が手で集めて渡す、お金が動く、といった行動は、具体化して掘る価値が高いと伝えてください。\n   深く掘りすぎて話が細かくなりすぎたら、一度上に戻ることを提案してください。\n\n4. 分解する\n   掘った行動について、次を1つずつ聞きます。\n   - 摩擦のサイン：複数の当事者／書類・情報の手渡し／お金が動く／待ち時間／手作業／毎回やり直し、のうちどれがあるか\n   - 背景：なぜ人はこのやり方をしているのか\n   - 制約：何がこのやり方を強いているのか（技術、規制、慣習、コスト、情報の偏りなど）\n   - その制約は今もあるか：まだある／薄れている／もう無い／未確認\n   「制約が消えた・薄れているのに、行動だけが残っている」ものが見つかったら、市場のタネの典型として強調してください。\n\n5. 本質を書く\n   それぞれの行動が「本質的には何をしているか」を短く言い表します（例：協定価額を決める → モノの価値を決める）。\n   場面の言葉（車の、家の、など）を外した言い方にして、他のテーマともつながるようにします。すでに使っている本質の言い方があれば、それを優先して使います。\n   同じ本質が別の行動や別のテーマにも出てきたら、そのつながりを指摘してください。\n\n6. タネとして評価する\n   わたしが「これはタネかも」と言った行動は、次の5つを0〜2点で一緒に採点します。点の理由も一言添えてください。\n   - alt：代わりの手段で無理やり済ませている\n   - now：「なぜ今」がある（技術・規制・コストの変化）\n   - money：お金がすでに別の名目で使われている\n   - repeat：繰り返し起こり、広がっている\n   - gap：大手がやりたがらない理由がある\n   有望なタネが出てきたら、「アプリのタネ候補で『事業案にする』を押し、事業化用のプロンプトで詰めましょう」と伝えてください。\n\n# わたしが使う合図\n- 「まとめ」：今のツリーを、字下げした一覧で見せてください（各行に、本質・摩擦・制約の状態・タネの点数があれば添える）。\n- 「保存」または「JSON」：下の形式でJSONを出力してください。\n- 「戻る」：1つ前の段階に戻ります。\n\n# JSONの出力ルール\n「保存」と言われたら、説明を最小限にして、次の形式のJSONを1つのコードブロックで出力します。\n\n- JSONとして正しい形にします。コメント、末尾のカンマ、全角の引用符は使いません。\n- nodes には、この会話で新しく作った行動と、内容を変えた行動だけを入れます。変えていない既存の行動は入れません。\n- 既存の行動（最初に貼られたJSONにあったもの）を変えたときは、その id をそのまま使います。アプリは同じ id を上書きします。\n- 新しい行動の id は、他と重ならないように「t」＋今日の日付8桁＋「-」＋3桁の連番にします（例：t20261010-001）。日付が分からなければ、最初にわたしに聞いてください。\n- parent には親の行動の id を入れます。テーマ（いちばん上）だけ null にします。既存の行動の下に足すときは、その既存の id を parent に入れます。\n- order は、同じ親の中での並び順です（0から）。\n- frictions は次の英語のキーだけを使います：parties（複数の当事者）、docs（書類・情報の手渡し）、money（お金が動く）、wait（待ち時間）、manual（手作業）、repeat（毎回やり直し）。\n- status は次のどれかです：still（まだある）、fading（薄れている）、gone（もう無い）、unknown（未確認）、\"\"（未記入）。\n- tags には「本質」の言い方を文字列で入れます。\n- seed は、タネ候補なら true です。scores は alt, now, money, repeat, gap をそれぞれ 0〜2 の数字で入れます。\n- why（背景）、constraint（制約）は、わたしが同意した内容だけを入れます。あなたの仮説のままのものは、memo に「仮説：〜」として入れます。\n- 行動が多くて1回で出し切れないときは、「続く」と書いて分割し、わたしが「続き」と言ったら残りを出します。分割したそれぞれが、単独で正しいJSONになるようにします。\n\n形式の例：\n```json\n{\n  \"app\": \"tane\",\n  \"version\": 1,\n  \"exportedAt\": 0,\n  \"nodes\": [\n    {\n      \"id\": \"t20261010-001\",\n      \"text\": \"家を借りる\",\n      \"parent\": null,\n      \"order\": 0,\n      \"frictions\": [],\n      \"why\": \"\",\n      \"constraint\": \"\",\n      \"status\": \"\",\n      \"tags\": [],\n      \"seed\": false,\n      \"scores\": {},\n      \"memo\": \"\"\n    },\n    {\n      \"id\": \"t20261010-002\",\n      \"text\": \"入居審査を受ける\",\n      \"parent\": \"t20261010-001\",\n      \"order\": 0,\n      \"frictions\": [\"parties\", \"docs\", \"wait\"],\n      \"why\": \"貸主が、家賃を払い続けられる人かを事前に確かめたい。\",\n      \"constraint\": \"借り手の支払い能力を示す共通の情報がなく、毎回書類で証明するしかない。\",\n      \"status\": \"fading\",\n      \"tags\": [\"支払い能力を証明する\"],\n      \"seed\": true,\n      \"scores\": {\"alt\": 2, \"now\": 1, \"money\": 1, \"repeat\": 2, \"gap\": 1},\n      \"memo\": \"仮説：保証会社ごとに審査をやり直している\"\n    }\n  ]\n}\n```\n\nでは、始めてください。\n";
const PROMPT_BIZ="あなたは、わたしの事業案を一緒に詰める相棒であり、厳しめの審査役です。わたしは「市場のタネ帳」というノートで、人の行動を観察・分解して市場のタネを探しています。この会話では、そのタネから生まれた事業案を、「進める／形を変える／保留／やめる」のどれかを判断できるところまで詰めます。最後に、タネ帳アプリに読み込めるJSONを出力します。\n\n# あなたの役割\n- この会話は「絞る」段階です。甘い評価はしません。根拠のない楽観には「その根拠は？」と聞き返してください。\n- 弱い点は、遠慮せずに具体的に指摘してください。×なら×と言います。やめる判断も前進です。\n- ただし、否定だけで終わらせず、「どう変えれば成り立つか」も一緒に考えてください。\n- わたしが言ったこと（事実）と、あなたの推測をはっきり分けます。推測には文頭に「仮説：」を付けます。\n- 数字は、粗くても桁が合っていることを重視します。分からない数字は、わたしに聞くか、置いた前提を明示して概算します。\n\n# 話し方\n- 日本語で、スマホで読みやすいように短く話してください。1回の返事は、長くても画面1枚分までにします。\n- 質問は1回に1つだけにします。\n- 前置きや褒め言葉は省き、すぐ本題に入ります。\n\n# 進め方\n1. 最初に、「今回の事業案」にある事業案と元になったタネを3行で要約し、この事業案の一番弱い点を3つ挙げてください。そのうえで、どこから詰めるかをわたしに選んでもらいます。\n2. 次の項目を1つずつ詰めます。わたしの答えが薄いときは、問いを変えて深掘りします。\n   - 顧客：具体的な1人（1社）を思い描けるか。話を聞ける知り合いはいるか\n   - 困りごと：どのくらいの頻度で、どのくらい痛いか。今いくら、何時間を使っているか\n   - 代わりの手段：今はどう済ませているか。それで困っていない人は誰か\n   - なぜ今：何が変わったからできるのか。5年前にできなかった理由は何か\n   - 解決の仮説：何を提供するか。いちばん小さく試すなら何か\n   - 誰がお金を払うか：どの予算名目のお金か。1件あたりいくらか\n   - 市場の大きさ：顧客数×単価で桁を出す。国内と海外の両方\n   - 競合と代替：同じことをしている会社、似たことをしている会社、「何もしない」という選択\n   - 勝てる理由：「わたしについて」に書いた強みとどうつながるか。真似されにくいか\n   - 15年計画との相性：次の4つを ○／△／× で判定し、理由を一言添えます\n     - margin：利益率30%以上を狙えるか\n     - national：全国・海外に売れるか\n     - stage1：最初は受託で稼ぎながら検証できるか\n     - campus：将来つくりたい自社拠点（「わたしについて」に書いた構想）と噛み合うか\n   - 次の一手：1週間以内にできる具体的な行動。誰に何を聞くか。どんな答えなら進め、どんな答えならやめるか\n3. 一通り詰めたら、「進める／形を変える／保留／やめる」のどれがよいか、理由を添えて提案してください。決めるのはわたしです。\n   形を変える場合は、新しい事業案として分けるか、今の事業案を書き換えるかをわたしに聞いてください。\n\n# わたしが使う合図\n- 「まとめ」：今の事業案を、項目ごとに短く一覧で見せてください。\n- 「保存」または「JSON」：下の形式でJSONを出力してください。\n\n# JSONの出力ルール\n「保存」と言われたら、説明を最小限にして、次の形式のJSONを1つのコードブロックで出力します。\n\n- JSONとして正しい形にします。コメント、末尾のカンマ、全角の引用符は使いません。\n- 出力するのは ideas だけです。この会話で変えた事業案と、新しく分けた事業案を入れます。\n- 渡された事業案を変えたときは、その id をそのまま使います。アプリは同じ id を上書きします。\n- 新しく分けた事業案の id は「i」＋今日の日付8桁＋「-」＋3桁の連番にします（例：i20261010-001）。日付が分からなければ、わたしに聞いてください。sources は元の事業案のものを引き継ぎます。\n- 各項目の入れ先は次のとおりです：customer（顧客）、pain（困りごと）、alt（代わりの手段）、whyNow（なぜ今）、solution（解決の仮説）、payer（誰がお金を払うか。1件あたりの金額も）、edge（勝てる理由）、next（次の一手。進める・やめる基準も）。\n- 市場の大きさと競合は、memo に「市場：〜」「競合：〜」の形で入れます。元の memo にあった内容は消さずに残します。\n- fit は margin, national, stage1, campus のそれぞれに \"ok\"（○）、\"mid\"（△）、\"ng\"（×）、\"\"（未判定）のどれかを入れます。理由は fitNote にまとめます。\n- status は \"idea\"（アイデア）、\"testing\"（検証中）、\"hold\"（保留）、\"dropped\"（やめた）のどれかです。やめた場合は dropReason に理由を入れます。\n- わたしが同意していない推測をどこかの項目に入れるときは、文頭の「仮説：」を付けたままにします。\n\n形式の例：\n```json\n{\n  \"app\": \"tane\",\n  \"version\": 2,\n  \"ideas\": [\n    {\n      \"id\": \"i20261010-001\",\n      \"title\": \"支払い能力をまとめて証明できる仕組み\",\n      \"status\": \"testing\",\n      \"sources\": [\n        {\n          \"type\": \"node\",\n          \"id\": \"t20261010-002\"\n        },\n        {\n          \"type\": \"tag\",\n          \"name\": \"支払い能力を証明する\"\n        }\n      ],\n      \"customer\": \"都市部で賃貸物件を探す20〜30代の会社員と、その審査をする保証会社\",\n      \"pain\": \"物件ごと、保証会社ごとに同じ書類を出して審査をやり直している。引っ越しのたびに数日かかる\",\n      \"alt\": \"源泉徴収票や在籍証明を毎回集めて、紙や画像で提出している\",\n      \"whyNow\": \"仮説：給与や口座の情報を本人同意で連携できる仕組みが広がってきた\",\n      \"solution\": \"一度の確認で、複数の審査先に支払い能力を証明できるサービス。まずは保証会社1社の審査書類チェックを受託する\",\n      \"payer\": \"保証会社。審査1件あたりの人件費の一部（仮説：1件数百円〜千円台）\",\n      \"edge\": \"会計の知識で、収入や支払い能力の見方を設計できる\",\n      \"fit\": {\n        \"margin\": \"mid\",\n        \"national\": \"ok\",\n        \"stage1\": \"ok\",\n        \"campus\": \"\"\n      },\n      \"fitNote\": \"審査書類チェックの受託から始めれば、稼ぎながら検証できる\",\n      \"next\": \"保証会社の審査担当2人に、1件あたりの審査時間と、一番手間がかかる書類を聞く。半分以上が書類集めと答えたら進める\",\n      \"dropReason\": \"\",\n      \"memo\": \"市場：仮説：国内の賃貸契約は年間数百万件。競合：大手保証会社の自社システム、何もしない\"\n    }\n  ]\n}\n```\n\n# わたしについて\n（ここに自分の強みや経歴を書いておくと、事業案を考えるときに使われます）\n\n# 今回の事業案\n（アプリから、ここに事業案と元になったタネが入ります。入っていなければ、どの事業案を詰めるか、わたしに聞いてください）\n\nでは、始めてください。\n";
const KEY_PROFILE='tane.profile';
const PROFILE_SLOT='（ここに自分の強みや経歴を書いておくと、事業案を考えるときに使われます）';
const BIZ_SLOT='（アプリから、ここに事業案と元になったタネが入ります。入っていなければ、どの事業案を詰めるか、わたしに聞いてください）';
function buildSeedPrompt(withData){let p=PROMPT_SEED;
  if(withData)p+='\n\n---\n以下は、いまのタネ帳のJSONです。これを読み取ってから始めてください。\n```json\n'+exportJSON()+'\n```';return p;}
function relatedNodes(x){const out=new Map();const add=n=>{for(const q of pathOf(n.id))out.set(q.id,q);};
  for(const sc of(x.sources||[])){if(sc.type==='node'){const n=S.nodes.get(sc.id);if(n)add(n);}else if(sc.type==='tag'){for(const n of S.nodes.values())if((n.tags||[]).includes(sc.name))add(n);}}
  return [...out.values()];}
function buildBizPrompt(x){let p=PROMPT_BIZ;const prof=(ls.get(KEY_PROFILE)||'').trim();if(prof)p=p.replace(PROFILE_SLOT,prof);
  if(x)p=p.replace(BIZ_SLOT,'次のJSONの ideas が今回詰める事業案、nodes が元になったタネと、その上の階層の行動です。\n```json\n'+JSON.stringify({ideas:[x],nodes:relatedNodes(x)},null,1)+'\n```');
  return p;}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('コピーしました。Claudeに貼り付けてください');}
  catch(e){if(S.tab!=='ai')S.aiFrom=S.tab;S.tab='ai';S.fallbackText=text;openSheet(false);render();window.scrollTo({top:0});}}
function renderAI(m){
  const fromArea=AREA_OF[S.aiFrom||'tree']||'seed';
  const cur=fromArea==='biz'&&S.ideaSel?S.ideas.get(S.ideaSel):null;
  const live=[...S.ideas.values()].filter(x=>x.status!=='dropped').sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));
  const list=cur?[cur,...live.filter(x=>x.id!==cur.id)]:live;
  const seedCard=`<div class="card"><h4>タネを探す</h4><p class="muted" style="margin:0">観察した行動を、AIと一緒に上下に動かして分解し、タネを探します。判断を急がず、広げる段階です。</p>
    <button class="btn ${fromArea==='seed'?'pri':''} big" id="cpData">今のタネ帳と一緒にコピー</button>
    <button class="btn big" id="cpNew">プロンプトだけコピー（新しいテーマから）</button></div>`;
  const bizCard=`<div class="card"><h4>事業案を詰める</h4><p class="muted" style="margin:0">詰めたい事業案を選ぶと、その事業案と元になったタネを添えて、厳しめの相棒用のプロンプトをコピーします。</p>
    ${list.length?list.map((x,i)=>`<button class="btn big ${fromArea==='biz'&&i===0?'pri':''}" data-cpidea="${esc(x.id)}">「${esc(x.title||'無題の事業案')}」を詰める</button>`).join(''):`<span class="muted">まだ事業案がありません。タネ探しの「タネ候補」から「事業案にする」で作れます。</span>`}</div>`;
  m.innerHTML=`<div class="list">
    <div><button class="back" id="aiBack">‹ 戻る</button></div>
    <div class="card"><ol class="muted steps"><li>下のボタンでプロンプトをコピーする</li><li>「Claudeを開く」で新しいチャットに貼って送る</li><li>対話の最後に「保存」と送り、出てきたJSONをコピーする</li><li>「データ」の「取り込む」に貼る</li></ol>
      <a class="btn big" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Claudeを開く ↗</a>
      <button class="btn big" id="goImport">AIの結果を取り込む（データへ）</button></div>
    <textarea id="cpFallback" rows="5" readonly hidden aria-label="コピー用の文章"></textarea>
    ${fromArea==='biz'?bizCard+seedCard:seedCard+bizCard}
    <div class="card"><h4>わたしについて</h4>
      <p class="muted" style="margin:0">自分の強み、経歴、つくりたい拠点の構想などを書いておくと、事業案を詰めるプロンプトに入ります。この端末の中だけに保存されます。</p>
      <textarea id="prof" rows="4" placeholder="例：持っている資格、仕事の経験、得意なこと、将来つくりたい拠点の構想" aria-label="わたしについて"></textarea></div>
  </div>`;
  if(S.fallbackText){const t=$('#cpFallback');t.hidden=false;t.value=S.fallbackText;S.fallbackText=null;t.focus();t.select();toast('自動でコピーできませんでした。この欄を全選択してコピーしてください');}
  $('#cpData').onclick=()=>copyText(buildSeedPrompt(true));
  $('#cpNew').onclick=()=>copyText(buildSeedPrompt(false));
  m.querySelectorAll('[data-cpidea]').forEach(b=>b.onclick=()=>{const x=S.ideas.get(b.dataset.cpidea);if(x)copyText(buildBizPrompt(x));});
  $('#goImport').onclick=()=>{S.tab='data';S.openPaste=true;render();window.scrollTo({top:0});};
  $('#aiBack').onclick=()=>{S.tab=S.aiFrom&&S.aiFrom!=='ai'?S.aiFrom:'tree';render();window.scrollTo({top:0});};
  const pf=$('#prof');pf.value=ls.get(KEY_PROFILE)||'';pf.oninput=e=>ls.set(KEY_PROFILE,e.target.value);
}

/* ---------- 分析シート ---------- */
function renderSheet(){const sh=$('#sheet');const n=S.sel&&S.nodes.get(S.sel);
  if(!n){S.detailFor=null;sh.innerHTML=`<div class="sec"><h3>使い方</h3><ol class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
    <li>テーマを作り、観察した行動をそのまま書き出す。</li>
    <li>行動をタップして、「↑抽象化する」で何のためかを上に、「↓具体化する」で具体的なやり方を下に足す。</li>
    <li>「分析する」で、摩擦のサイン、背景、制約、その制約が今もあるかを書く。</li>
    <li>行動ごとに「本質的には何をしているか」を書く。同じ本質はテーマをまたいでつながる。</li>
    <li>気になる行動はタネ候補にして、5つの要素で採点する。</li></ol></div>`;return;}
  if(S.detailFor!==n.id){buildSheet(n);S.detailFor=n.id;}else syncSheet(n);}
const STABS=[['cut','分解'],['tag','本質'],['seed','タネ'],['etc','その他']];
function buildSheet(n){const id=n.id;const sh=$('#sheet');
  sh.innerHTML=`<div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><div style="min-width:0;flex:1"><div class="crumb" id="d-crumb"></div></div><button class="close" id="d-close" aria-label="閉じる">✕</button></div>
  <input class="title-in" id="d-text" aria-label="行動" autocomplete="off">
  <div class="stabs" role="tablist">${STABS.map(([k,l])=>`<button role="tab" data-st="${k}">${l}</button>`).join('')}</div>
  <div class="panel" data-panel="cut">
    <div class="sec"><h3>摩擦のサイン</h3><div class="toggles" id="d-fr">${FRICTIONS.map(([k,l])=>`<button class="tg" data-fr="${k}">${l}</button>`).join('')}</div></div>
    <label class="f">なぜそうしているのか（背景）<textarea id="d-why" rows="2"></textarea></label>
    <label class="f">何がそうさせているのか（制約）<textarea id="d-con" rows="2"></textarea></label>
    <div class="sec"><h3>その制約は今もある？</h3><div class="seg" id="d-st">${STATUS.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</div>
    <div class="callout" id="d-gone" hidden>制約が消えたのに行動だけが残っています。市場のタネの典型的な形です。</div></div>
  </div>
  <div class="panel" data-panel="tag" hidden>
    <div class="sec"><h3>この行動は、本質的には何をしている？</h3><div class="tags" id="d-tags"></div>
    <form class="inline" id="d-tagf"><input id="d-tag-in" list="d-taglist" placeholder="例：モノの価値を決める" aria-label="本質" autocomplete="off"><datalist id="d-taglist"></datalist><button class="btn" type="submit">追加</button></form>
    <div class="tags" id="d-tagq"></div></div>
    <div class="sec"><h3>同じ本質を持つ行動</h3><div id="d-same"></div></div>
  </div>
  <div class="panel" data-panel="seed" hidden>
    <button class="tg seedtg" id="d-seed">タネ候補にする</button>
    <div class="score" id="d-score">${ELEMENTS.map(([k,l])=>`<div class="srow"><span>${l}</span><div class="dots">${[0,1,2].map(v=>`<button data-sk="${k}" data-sv="${v}" aria-label="${l} ${v}">${v}</button>`).join('')}</div></div>`).join('')}<div class="total" id="d-total"></div></div>
    <button class="btn" id="d-mkidea">この行動から事業案を作る</button>
  </div>
  <div class="panel" data-panel="etc" hidden>
    <label class="f">メモ<textarea id="d-memo" rows="4"></textarea></label>
    <div class="sec"><h3>並び順</h3><div class="inline"><button class="btn sm" id="d-mu">▲ 上へ</button><button class="btn sm" id="d-md">▼ 下へ</button></div></div>
    <div class="sec"><h3>削除</h3><div><button class="btn sm danger" id="d-del">この行動を削除</button></div></div>
  </div>`;
  sh.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.sheetTab=b.dataset.st;showSheetTab();});
  $('#d-close').onclick=()=>openSheet(false);
  $('#d-text').oninput=e=>patchLater(id,'text',e.target.value);
  $('#d-why').oninput=e=>patchLater(id,'why',e.target.value);
  $('#d-con').oninput=e=>patchLater(id,'constraint',e.target.value);
  $('#d-memo').oninput=e=>patchLater(id,'memo',e.target.value);
  $('#d-fr').querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{const cur=new Set(S.nodes.get(id).frictions||[]);cur.has(b.dataset.fr)?cur.delete(b.dataset.fr):cur.add(b.dataset.fr);patch(id,{frictions:[...cur]});});
  $('#d-st').querySelectorAll('button').forEach(b=>b.onclick=()=>{const cur=S.nodes.get(id).status;patch(id,{status:cur===b.dataset.v?'':b.dataset.v});});
  const addTag=v=>{v=v.trim();if(!v)return;const cur=S.nodes.get(id).tags||[];if(!cur.includes(v))patch(id,{tags:[...cur,v]});};
  $('#d-tagf').onsubmit=e=>{e.preventDefault();addTag($('#d-tag-in').value);$('#d-tag-in').value='';};
  $('#d-tagq').addEventListener('click',e=>{const b=e.target.closest('[data-qt]');if(b)addTag(b.dataset.qt);});
  $('#d-same').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)select(b.dataset.go,true);});
  $('#d-seed').onclick=()=>patch(id,{seed:!S.nodes.get(id).seed});
  $('#d-mkidea').onclick=()=>{openSheet(false);mkIdea([{type:'node',id}],S.nodes.get(id).text);};
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const sc={...(S.nodes.get(id).scores||{})};sc[b.dataset.sk]=Number(b.dataset.sv);patch(id,{scores:sc});});
  $('#d-mu').onclick=()=>move(id,-1);$('#d-md').onclick=()=>move(id,1);
  const del=$('#d-del');let armed=false;
  del.onclick=()=>{if(!armed){armed=true;const c=descendants(id).length;del.textContent=c?`下の${c}件もまとめて削除する`:'本当に削除する';setTimeout(()=>{armed=false;if(del.isConnected)del.textContent='この行動を削除';},3500);return;}openSheet(false);delNode(id);};
  showSheetTab();syncSheet(n,true);}
function showSheetTab(){document.querySelectorAll('#sheet [data-st]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.st===S.sheetTab)));document.querySelectorAll('#sheet [data-panel]').forEach(p=>p.hidden=p.dataset.panel!==S.sheetTab);}
function syncSheet(n,first){
  const setVal=(sel,v)=>{const el=$(sel);if(el&&(first||document.activeElement!==el))el.value=v||'';};
  const cr=pathOf(n.id).slice(0,-1).map(p=>p.text).join(' › ');
  $('#d-crumb').textContent=`L${depth(n.id)}${cr?'　'+cr+' ›':''}`;
  setVal('#d-text',n.text);setVal('#d-why',n.why);setVal('#d-con',n.constraint);setVal('#d-memo',n.memo);
  const fr=new Set(n.frictions||[]);$('#d-fr').querySelectorAll('[data-fr]').forEach(b=>b.setAttribute('aria-pressed',String(fr.has(b.dataset.fr))));
  $('#d-st').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(n.status===b.dataset.v)));
  $('#d-gone').hidden=n.status!=='gone';
  const tags=n.tags||[];
  $('#d-tags').innerHTML=tags.map(t=>`<button class="tagx" data-rm="${esc(t)}" aria-label="${esc(t)}を外す">${esc(t)} ✕</button>`).join('')||`<span class="muted">まだありません</span>`;
  $('#d-tags').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>patch(n.id,{tags:(S.nodes.get(n.id).tags||[]).filter(t=>t!==b.dataset.rm)}));
  const idx=tagIndex();const others=[...idx.keys()].filter(t=>!tags.includes(t));
  $('#d-taglist').innerHTML=others.map(t=>`<option value="${esc(t)}"></option>`).join('');
  $('#d-tagq').innerHTML=others.length?`<span class="muted">これまでに書いた本質：</span>`+others.slice(0,8).map(t=>`<button class="tagx" data-qt="${esc(t)}">＋ ${esc(t)}</button>`).join(''):'';
  const same=[];for(const t of tags)for(const m of(idx.get(t)||[]))if(m.id!==n.id&&!same.some(s=>s.id===m.id))same.push(m);
  $('#d-same').innerHTML=same.length?same.map(hitBtn).join(''):`<span class="muted">同じ本質を持つ行動はまだありません。</span>`;
  $('#d-seed').setAttribute('aria-pressed',String(!!n.seed));$('#d-seed').textContent=n.seed?'タネ候補にしている':'タネ候補にする';
  $('#d-score').hidden=!n.seed;
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.setAttribute('aria-pressed',String((Number(n.scores?.[b.dataset.sk])||0)===Number(b.dataset.sv))));
  $('#d-total').textContent=`合計 ${scoreOf(n)} / 10`;}

/* ---------- 起動 ---------- */
$('#scrim').onclick=()=>openSheet(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.adding){S.adding=null;renderMain();}else openSheet(false);}});
loadAll();
if(!S.nodes.size) S.tab='tree';
render();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>

の偏り／信頼・責任／物理・時間）。どの理由が一番強くこの行動を縛っているかを、一緒に1つ選びます。摩擦のサイン（複数の当事者／書類・情報の手渡し／お金が動く／待ち時間／手作業／毎回やり直し）も確認します。\n   - 時間：いつから、どんな経緯でこうなったか。それぞれの理由は今もあるか（まだある／薄れている／もう無い／未確認）と、その根拠。この先どう変わりそうか。\n   ほかの行動で出てきた理由と同じものがあれば、同じ言い方にそろえて、そのつながりを指摘してください。\n   「理由が消えた・薄れているのに、行動だけが残っている」ものが見つかったら、市場のタネの典型として強調してください。\n   4つのうち、まだ薄い視点があれば、そこを掘ることを提案してください。\n   最後に、掘り出した理由の中から「一番深く、一番強くこの行動を縛っている理由」を1つ選びます。表面の症状ではなく、そこを解けば行動そのものが変わる理由を選ぶよう、わたしに問いかけてください。\n   完璧を目指さず、「一番効いている理由が1つ選べて、それが今もあるかを判定できた」ら、その行動の掘り下げは十分です。次の行動か、次の段階へ進むことを提案してください。\n\n5. 本質を書く\n   それぞれの行動が「本質的には何をしているか」、つまり「何の一種か」を短く言い表します（例：協定価額を決める → モノの価値を決める、通勤する → 移動する）。目的（何のため）ではない点に注意してください。\n   本質は、行動を書き出したあとでまとめて付けます。書き出しの途中で本質を考えさせないでください。\n   2と3でメモした本質の候補があれば、まずそれを見せて、そのまま使うか、言い直すかをわたしに選んでもらいます。\n   場面の言葉（車の、家の、など）を外した言い方にして、別の起点の行動ともつながるようにします。すでに使っている本質の言い方があれば、それを優先して使います。\n   同じ本質が別の行動や別の起点の行動の下にも出てきたら、そのつながりを指摘してください。\n\n6. タネとして評価する\n   わたしが「これはタネかも」と言った行動は、次の5つを0〜2点で一緒に採点します。点の理由も一言添えてください。\n   - alt：代わりの手段で無理やり済ませている\n   - now：「なぜ今」がある（技術・規制・コストの変化）\n   - money：お金がすでに別の名目で使われている\n   - repeat：繰り返し起こり、広がっている\n   - gap：大手がやりたがらない理由がある\n   有望なタネが出てきたら、「アプリのタネ候補で『事業案にする』を押し、事業化用のプロンプトで詰めましょう」と伝えてください。\n\n# わたしが使う合図\n- 「まとめ」：今のツリーを、字下げした一覧で見せてください（各行に、本質・一番効いている理由・その理由が今もあるか・タネの点数があれば添える）。\n- 「保存」または「JSON」：下の形式でJSONを出力してください。\n- 「戻る」：1つ前の段階に戻ります。\n\n# JSONの出力ルール\n「保存」と言われたら、説明を最小限にして、次の形式のJSONを1つのコードブロックで出力します。\n\n- JSONとして正しい形にします。コメント、末尾のカンマ、全角の引用符は使いません。\n- nodes には、この会話で新しく作った行動と、内容を変えた行動だけを入れます。変えていない既存の行動は入れません。\n- 既存の行動（最初に貼られたJSONにあったもの）を変えたときは、その id をそのまま使います。アプリは同じ id を上書きします。\n- 新しい行動の id は、他と重ならないように「t」＋今日の日付8桁＋「-」＋3桁の連番にします（例：t20261010-001）。理由と当事者の id も同じ考え方です。日付が分からなければ、最初にわたしに聞いてください。\n- parent には親の行動の id を入れます。起点の行動（L0）だけ null にします。既存の行動の下に足すときは、その既存の id を parent に入れます。\n- order は、同じ親の中での並び順です（0から）。\n- frictions は次の英語のキーだけを使います：parties（複数の当事者）、docs（書類・情報の手渡し）、money（お金が動く）、wait（待ち時間）、manual（手作業）、repeat（毎回やり直し）。\n- reasons には、この行動をしている理由を入れます。各理由は id, text, kind, who, status, evidence, star, parent を持ちます。\n  - id は「r」＋今日の日付8桁＋「-」＋3桁の連番にします（例：r20261010-001）。\n  - kind は need（目的・必要）、tech（技術）、rule（規制・ルール）、custom（慣習・文化）、cost（コスト）、info（情報の偏り）、trust（信頼・責任）、phys（物理・時間）、\"\"（未分類）のどれかです。\n  - who は、その理由が誰の都合かを、actors の name で入れます。分からなければ \"\" にします。\n  - status は still（まだある）、fading（薄れている）、gone（もう無い）、unknown（未確認）、\"\"（未記入）のどれかです。evidence に、その根拠を一言入れます。\n  - star は、一番強くこの行動を縛っている理由だけ true にします（行動ごとに1つまで）。\n  - parent は、「なぜそうなっている？」で掘った元の理由の id です。いちばん上の理由は null にします。\n- actors には当事者を入れます。各当事者は id（「a」＋日付8桁＋「-」＋連番）, name, wants（望んでいること）, pains（困っていること）を持ちます。\n- assume（当たり前だと思っている前提）、alts（ほかのやり方）、since（いつから・どんな経緯で）、future（この先の変化）は文章で入れます。\n- 既存の行動の reasons や actors を変えたときは、その行動の reasons と actors を全部出し直します（アプリは行動ごと上書きします）。\n- 理由・当事者・前提は、わたしが同意した内容だけを入れます。あなたの仮説のままのものは、文頭に「仮説：」を付けます。\n- 行動が多くて1回で出し切れないときは、「続く」と書いて分割し、わたしが「続き」と言ったら残りを出します。分割したそれぞれが、単独で正しいJSONになるようにします。\n\n形式の例：\n```json\n{\n  \"app\": \"tane\",\n  \"version\": 3,\n  \"exportedAt\": 0,\n  \"nodes\": [\n    {\n      \"id\": \"t20261010-001\",\n      \"text\": \"家を借りる\",\n      \"parent\": null,\n      \"order\": 0,\n      \"frictions\": [],\n      \"reasons\": [],\n      \"actors\": [],\n      \"assume\": \"\",\n      \"alts\": \"\",\n      \"since\": \"\",\n      \"future\": \"\",\n      \"tags\": [],\n      \"seed\": false,\n      \"scores\": {},\n      \"memo\": \"\"\n    },\n    {\n      \"id\": \"t20261010-002\",\n      \"text\": \"入居審査を受ける\",\n      \"parent\": \"t20261010-001\",\n      \"order\": 0,\n      \"frictions\": [\n        \"parties\",\n        \"docs\",\n        \"wait\"\n      ],\n      \"reasons\": [\n        {\n          \"id\": \"r20261010-001\",\n          \"text\": \"貸主が、家賃を払い続けられる人かを事前に確かめたい\",\n          \"kind\": \"need\",\n          \"who\": \"貸主\",\n          \"status\": \"still\",\n          \"evidence\": \"\",\n          \"star\": false,\n          \"parent\": null\n        },\n        {\n          \"id\": \"r20261010-002\",\n          \"text\": \"借り手の支払い能力を示す共通の情報がない\",\n          \"kind\": \"info\",\n          \"who\": \"保証会社\",\n          \"status\": \"fading\",\n          \"evidence\": \"仮説：給与や口座の情報を本人同意で連携する仕組みが広がっている\",\n          \"star\": true,\n          \"parent\": \"r20261010-001\"\n        },\n        {\n          \"id\": \"r20261010-003\",\n          \"text\": \"審査の結果を他社に渡せない\",\n          \"kind\": \"rule\",\n          \"who\": \"保証会社\",\n          \"status\": \"unknown\",\n          \"evidence\": \"\",\n          \"star\": false,\n          \"parent\": \"r20261010-002\"\n        }\n      ],\n      \"actors\": [\n        {\n          \"id\": \"a20261010-001\",\n          \"name\": \"貸主\",\n          \"wants\": \"家賃を確実に受け取りたい\",\n          \"pains\": \"滞納のリスク\"\n        },\n        {\n          \"id\": \"a20261010-002\",\n          \"name\": \"保証会社\",\n          \"wants\": \"審査を早く安く済ませたい\",\n          \"pains\": \"書類の確認に人手がかかる\"\n        }\n      ],\n      \"assume\": \"支払い能力は書類で証明するもの\",\n      \"alts\": \"仮説：海外では信用スコアで即日審査\",\n      \"since\": \"保証会社の利用が当たり前になってから、会社ごとに審査するようになった\",\n      \"future\": \"仮説：本人同意のデータ連携で、審査は数分になる\",\n      \"tags\": [\n        \"支払い能力を証明する\"\n      ],\n      \"seed\": true,\n      \"scores\": {\n        \"alt\": 2,\n        \"now\": 1,\n        \"money\": 1,\n        \"repeat\": 2,\n        \"gap\": 1\n      },\n      \"memo\": \"\"\n    }\n  ]\n}\n```\n\nでは、始めてください。\n";
const PROMPT_BIZ="あなたは、わたしの事業案を一緒に詰める相棒であり、厳しめの審査役です。わたしは「市場のタネ帳」というノートで、人の行動を観察・分解して市場のタネを探しています。この会話では、そのタネから生まれた事業案を、「進める／形を変える／保留／やめる」のどれかを判断できるところまで詰めます。最後に、タネ帳アプリに読み込めるJSONを出力します。\n\n# あなたの役割\n- この会話は「絞る」段階です。甘い評価はしません。根拠のない楽観には「その根拠は？」と聞き返してください。\n- 弱い点は、遠慮せずに具体的に指摘してください。×なら×と言います。やめる判断も前進です。\n- ただし、否定だけで終わらせず、「どう変えれば成り立つか」も一緒に考えてください。\n- わたしが言ったこと（事実）と、あなたの推測をはっきり分けます。推測には文頭に「仮説：」を付けます。\n- 数字は、粗くても桁が合っていることを重視します。分からない数字は、わたしに聞くか、置いた前提を明示して概算します。\n\n# 話し方\n- 日本語で、スマホで読みやすいように短く話してください。1回の返事は、長くても画面1枚分までにします。\n- 質問は1回に1つだけにします。\n- 前置きや褒め言葉は省き、すぐ本題に入ります。\n\n# 進め方\n次の順に進めます。各段階で、わたしの答えが薄いときは、問いを変えて深掘りしてください。\n\n1. 解く理由を決める\n   最初に、「今回の事業案」にある事業案と元になったタネを3行で要約します。元のタネの reasons（理由の構造）を読み、この事業案が「どの理由を解くための打ち手か」をはっきりさせます。star が付いた理由があれば、それが第一候補です。\n   - その理由は、表面の症状ではなく根本の理由か\n   - その理由は今もあるか、消えかけているか（消えかけているなら、それが「なぜ今」になります）\n   どの理由を解くのかが曖昧な事業案は、まずそこを決めます。決まらなければ、この事業案は弱いとはっきり伝えてください。\n\n2. 打ち手を広げてから選ぶ\n   選んだ理由に対して、打ち手をすぐ1つに決めず、まず3〜5個並べます。製品やサービスだけでなく、仕組みの作り替え、他業界のやり方の持ち込み、当事者の組み替え、ルール側への働きかけなども含めます。\n   並べた打ち手を、効き目（その理由がどれだけ解けるか）、始めやすさ、真似されにくさ、わたしの強みとの相性で比べ、1つ選びます。選ばなかった打ち手も記録に残します。\n\n3. 事業として詰める\n   選んだ打ち手について、次を1つずつ詰めます。\n   - 顧客：具体的な1人（1社）を思い描けるか。話を聞ける知り合いはいるか\n   - 困りごと：どのくらいの頻度で、どのくらい痛いか。今いくら、何時間を使っているか\n   - 代わりの手段：今はどう済ませているか。それで困っていない人は誰か\n   - なぜ今：何が変わったからできるのか。5年前にできなかった理由は何か\n   - 誰がお金を払うか：どの予算名目のお金か。1件あたりいくらか\n   - 市場の大きさ：顧客数×単価で桁を出す。国内と海外の両方\n   - 競合と代替：同じことをしている会社、似たことをしている会社、「何もしない」という選択\n   - 勝てる理由：わたしの実際の経験や強みとどうつながるか。真似されにくいか\n   - 15年計画との相性：次の4つを ○／△／× で判定し、理由を一言添えます\n     - margin：利益率30%以上を狙えるか\n     - national：全国・海外に売れるか\n     - stage1：最初は受託で稼ぎながら検証できるか\n     - campus：将来の自社拠点構想と噛み合うか。構想が未定なら未判定にする\n\n4. 仮説を立てて、行動を決める\n   考え続けるのではなく、確かめに行く形にします。\n   - 検証する仮説：確かめられる形で1〜3個書きます（例：「保証会社の審査担当は、1件あたり30分以上を書類集めに使っている」）。いちばん外れたら困る仮説から順に並べます。\n   - いちばん小さな試し方：作るより先に、人に話を聞く、手作業で代行してみる、などの方法を優先します。1週間以内にできることにします。\n   - 聞く質問：意見ではなく事実を聞く質問を3〜5個作ります。「欲しいですか？」「使いますか？」ではなく、「最後にそれで困ったのはいつで、そのときどうしましたか？」「そのために今いくら払っていますか？」の形にします。\n   - 判断の基準：どんな答えが何人から返ってきたら進め、どんな答えならやめるかを、先に決めます。\n\n5. 判断する\n   一通り詰めたら、「進める／形を変える／保留／やめる」のどれがよいか、理由を添えて提案してください。決めるのはわたしです。\n   形を変える場合は、新しい事業案として分けるか、今の事業案を書き換えるかをわたしに聞いてください。\n   完璧を目指さず、「解く理由・打ち手・確かめる仮説・次の行動」が決まったら、詰めるのをやめて動くことを勧めてください。\n\n# わたしが使う合図\n- 「まとめ」：今の事業案を、項目ごとに短く一覧で見せてください。\n- 「保存」または「JSON」：下の形式でJSONを出力してください。\n\n# JSONの出力ルール\n「保存」と言われたら、説明を最小限にして、次の形式のJSONを1つのコードブロックで出力します。\n\n- JSONとして正しい形にします。コメント、末尾のカンマ、全角の引用符は使いません。\n- 出力するのは ideas だけです。この会話で変えた事業案と、新しく分けた事業案を入れます。\n- 渡された事業案を変えたときは、その id をそのまま使います。アプリは同じ id を上書きします。\n- 新しく分けた事業案の id は「i」＋今日の日付8桁＋「-」＋3桁の連番にします（例：i20261010-001）。日付が分からなければ、わたしに聞いてください。sources は元の事業案のものを引き継ぎます。\n- 各項目の入れ先は次のとおりです：customer（顧客）、pain（困りごと）、alt（代わりの手段）、whyNow（なぜ今）、solution（解く理由と、選んだ打ち手。最初に「解く理由：〜」、次に「打ち手：〜」の形で書きます）、payer（誰がお金を払うか。1件あたりの金額も）、edge（勝てる理由）、next（いちばん小さな試し方、聞く質問、進める・やめる基準）。\n- memo には、「選ばなかった打ち手：〜」「検証する仮説：〜」「市場：〜」「競合：〜」の形で入れます。元の memo にあった内容は消さずに残します。\n- fit は margin, national, stage1, campus のそれぞれに \"ok\"（○）、\"mid\"（△）、\"ng\"（×）、\"\"（未判定）のどれかを入れます。理由は fitNote にまとめます。\n- status は \"idea\"（アイデア）、\"testing\"（検証中）、\"hold\"（保留）、\"dropped\"（やめた）のどれかです。やめた場合は dropReason に理由を入れます。\n- わたしが同意していない推測をどこかの項目に入れるときは、文頭の「仮説：」を付けたままにします。\n\n形式の例：\n```json\n{\n  \"app\": \"tane\",\n  \"version\": 2,\n  \"ideas\": [\n    {\n      \"id\": \"i20261010-001\",\n      \"title\": \"支払い能力をまとめて証明できる仕組み\",\n      \"status\": \"testing\",\n      \"sources\": [\n        {\n          \"type\": \"node\",\n          \"id\": \"t20261010-002\"\n        },\n        {\n          \"type\": \"tag\",\n          \"name\": \"支払い能力を証明する\"\n        }\n      ],\n      \"customer\": \"都市部で賃貸物件を探す20〜30代の会社員と、その審査をする保証会社\",\n      \"pain\": \"物件ごと、保証会社ごとに同じ書類を出して審査をやり直している。引っ越しのたびに数日かかる\",\n      \"alt\": \"源泉徴収票や在籍証明を毎回集めて、紙や画像で提出している\",\n      \"whyNow\": \"仮説：給与や口座の情報を本人同意で連携できる仕組みが広がってきた\",\n      \"solution\": \"解く理由：借り手の支払い能力を示す共通の情報がない。打ち手：一度の確認で、複数の審査先に支払い能力を証明できるサービス。まずは保証会社1社の審査書類チェックを受託する\",\n      \"payer\": \"保証会社。審査1件あたりの人件費の一部（仮説：1件数百円〜千円台）\",\n      \"edge\": \"会計の知識で、収入や支払い能力の見方を設計できる\",\n      \"fit\": {\n        \"margin\": \"mid\",\n        \"national\": \"ok\",\n        \"stage1\": \"ok\",\n        \"campus\": \"\"\n      },\n      \"fitNote\": \"審査書類チェックの受託から始めれば、稼ぎながら検証できる\",\n      \"next\": \"試し方：保証会社の審査担当5人に話を聞く。質問：最後に審査が詰まったのはいつで、何の書類待ちだったか／1件に何分かかっているか。基準：3人以上が1件30分以上を書類集めに使っていれば進める。1人以下ならやめる\",\n      \"dropReason\": \"\",\n      \"memo\": \"選ばなかった打ち手：保証会社向けの審査AI、不動産会社向けの書類回収代行。検証する仮説：審査担当は1件あたり30分以上を書類集めに使っている。市場：仮説：国内の賃貸契約は年間数百万件。競合：大手保証会社の自社システム、何もしない\"\n    }\n  ]\n}\n```\n\n# 今回の事業案\n（アプリから、ここに事業案と元になったタネが入ります。入っていなければ、どの事業案を詰めるか、わたしに聞いてください）\n\nでは、始めてください。\n";
const BIZ_SLOT='（アプリから、ここに事業案と元になったタネが入ります。入っていなければ、どの事業案を詰めるか、わたしに聞いてください）';
function buildSeedPrompt(withData){let p=PROMPT_SEED;
  if(withData)p+='\n\n---\n以下は、いまのタネ帳のJSONです。これを読み取ってから始めてください。\n```json\n'+exportJSON()+'\n```';return p;}
function relatedNodes(x){const out=new Map();const add=n=>{for(const q of pathOf(n.id))out.set(q.id,q);};
  for(const sc of(x.sources||[])){if(sc.type==='node'){const n=S.nodes.get(sc.id);if(n)add(n);}else if(sc.type==='tag'){for(const n of S.nodes.values())if((n.tags||[]).includes(sc.name))add(n);}}
  return [...out.values()];}
function buildBizPrompt(x){let p=PROMPT_BIZ;
  if(x)p=p.replace(BIZ_SLOT,'次のJSONの ideas が今回詰める事業案、nodes が元になったタネと、その上の階層の行動です。\n```json\n'+JSON.stringify({ideas:[x],nodes:relatedNodes(x)},null,1)+'\n```');
  return p;}
/* AIを開く時点でプロンプトを入力しておく。長文だけ自動コピーで補う。 */
function bindAIPromptLinks(root,getPrompt){
  if(!root)return;
  root.querySelectorAll('[data-ai-provider]').forEach(link=>{
    const base=link.dataset.aiProvider==='chatgpt'?'https://chatgpt.com/':'https://claude.ai/new';
    link.addEventListener('click',event=>{
      const prompt=getPrompt();
      const encoded=encodeURIComponent(prompt);
      // 長大な URL や Claude の入力文字数制限を避ける。
      if(prompt.length>13000||encoded.length>60000){
        link.href=base;
        if(navigator.clipboard?.writeText){
          navigator.clipboard.writeText(prompt).then(()=>toast('長文のプロンプトをコピーしました')).catch(()=>copyText(prompt));
        }else copyText(prompt);
      }else link.href=base+'?q='+encoded;
    });
  });
}
async function copyText(text){
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('clipboard unsupported');
    await navigator.clipboard.writeText(text);
    toast('コピーしました');
  }catch(e){
    const dialog=$('#copyFallback');
    const field=$('#copyFallbackText');
    field.value=text;dialog.hidden=false;field.focus();field.select();
    toast('下の欄を長押ししてコピーしてください');
  }
}
function openImport(){S.themeStart=false;S.tab='data';S.openPaste=true;openSheet(false);render();window.scrollTo({top:0});}


/* ---------- 解像度（深さ・広さ・構造・時間） ---------- */
const STLABEL={still:'まだある',fading:'薄れている',gone:'もう無い',unknown:'未確認'};
function kindOptions(sel){return `<option value="">種類：未分類</option>`+RKINDS.map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');}
function whoOptions(n,sel){const names=(n.actors||[]).map(a=>a.name.trim()).filter(Boolean);if(sel&&!names.includes(sel))names.push(sel);
  return `<option value="">誰の都合：未設定</option>`+names.map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('');}
function rchildren(n,pid){return (n.reasons||[]).filter(r=>(r.parent||null)===pid);}
function updateMeter(n){const ls=lensScore(n);document.querySelectorAll('#d-res [data-lens]').forEach(b=>b.querySelectorAll('.ldots i').forEach((i,k)=>i.classList.toggle('on',ls[b.dataset.lens]>k)));}
function growAll(box){box.querySelectorAll('textarea').forEach(t=>{const g=()=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';};g();t.addEventListener('input',g);});}
function commitRes(n,re){n.updated=Date.now();saveSoon();renderMain();renderTabs();if(re)renderRes(n);else updateMeter(n);}
function renderRes(n){const box=$('#d-res');if(!box)return;const ls=lensScore(n);const lens=S.lens||'depth';
  const meter=`<div class="lens-meter" role="tablist" aria-label="解像度の4つの視点">${LENSES.map(([k,l,h])=>`<button class="lens-btn" role="tab" data-lens="${k}" aria-pressed="${k===lens}"><b>${l}</b><span class="ldots">${[1,2,3].map(i=>`<i class="${ls[k]>=i?'on':''}"></i>`).join('')}</span><small>${h}</small></button>`).join('')}</div>`;
  let body='';
  if(lens==='depth'){
    const card=(r,lvl)=>`<div class="rcard ${lvl?'child':''}" style="margin-left:${Math.min(lvl,4)*14}px" data-r="${esc(r.id)}">
      <div class="rhead"><select class="rsel" data-rk="${esc(r.id)}" aria-label="理由の種類">${kindOptions(r.kind)}</select><span class="sp"></span><button class="rstar" data-rs="${esc(r.id)}" aria-pressed="${!!r.star}" aria-label="一番効いている理由にする">★</button><button class="rx" data-rx="${esc(r.id)}" aria-label="この理由を削除">✕</button></div>
      <textarea data-rt="${esc(r.id)}" rows="2" aria-label="理由">${esc(r.text)}</textarea>
      <div class="rmeta"><select class="rsel" data-rw="${esc(r.id)}" aria-label="誰の都合か">${whoOptions(n,r.who)}</select>${r.status?`<span class="rst rst-${r.status}">${STLABEL[r.status]}</span>`:''}</div>
      ${S.whyFor===r.id?`<form class="rwhy" data-rwf="${esc(r.id)}"><textarea rows="2" placeholder="なぜそうなっている？" aria-label="なぜそうなっている？"></textarea><div class="btnrow"><button class="btn pri sm" type="submit">掘る</button><button class="btn sm" type="button" data-rwx>やめる</button></div></form>`:`<div><button class="linkbtn" data-rwhy="${esc(r.id)}">＋ なぜそうなっている？</button></div>`}
    </div>`;
    const walk=(pid,lvl)=>rchildren(n,pid).map(r=>card(r,lvl)+walk(r.id,lvl+1)).join('');
    const mine=new Set((n.reasons||[]).map(r=>normText(r.text)));
    const others=[...reasonIndex().values()].filter(g=>!mine.has(normText(g.text))).sort((a,b)=>b.items.length-a.items.length).slice(0,6);
    body=`<p class="lens-q"><b>なぜこの行動をしている？</b> 答えに「なぜそうなっている？」を重ね、症状ではなく根本の理由まで掘ります。理由はいくつあっても構いません。</p>
      <div class="rtree">${walk(null,0)||'<span class="muted">まだ理由がありません。</span>'}</div>
      <form class="r-add" id="r-add"><textarea id="r-add-in" rows="2" placeholder="例：保険会社が車の価値を自力で判断できない" aria-label="新しい理由"></textarea>
        <div class="inline"><select class="rsel" id="r-add-kind" aria-label="理由の種類">${kindOptions('')}</select><button class="btn pri sm" type="submit">理由を追加</button></div>
        ${others.length?`<div class="tags"><span class="muted">ほかの行動で書いた理由：</span>${others.map((g,i)=>`<button class="tagx" type="button" data-rq="${i}">＋ ${esc(g.text.length>24?g.text.slice(0,24)+'…':g.text)}</button>`).join('')}</div>`:''}
      </form>`;
    box.innerHTML=meter+body;
    box.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{const g=others[Number(b.dataset.rq)];n.reasons.push({id:rid(),text:g.text,kind:g.kind||'',who:'',status:'',evidence:'',star:false,parent:null});commitRes(n,true);toast('同じ理由としてつなげました');});
  }else if(lens==='breadth'){
    body=`<p class="lens-q"><b>誰の視点で見ると、理由は変わる？</b> 当事者ごとに、望むことと困っていることを書きます。前提を疑い、ほかのやり方も考えます。</p>
      <div class="rtree">${(n.actors||[]).map(a=>`<div class="acard" data-a="${esc(a.id)}"><div class="rhead"><input data-af="name" data-aid="${esc(a.id)}" value="${esc(a.name)}" placeholder="当事者（例：保険会社）" aria-label="当事者"><button class="rx" data-ax="${esc(a.id)}" aria-label="この当事者を削除">✕</button></div>
        <label class="f">望んでいること<textarea data-af="wants" data-aid="${esc(a.id)}" rows="2">${esc(a.wants)}</textarea></label>
        <label class="f">困っていること・恐れていること<textarea data-af="pains" data-aid="${esc(a.id)}" rows="2">${esc(a.pains)}</textarea></label></div>`).join('')||'<span class="muted">まだ当事者がいません。</span>'}</div>
      <div><button class="btn sm" id="a-add" type="button">＋ 当事者を追加</button></div>
      <label class="f">当たり前だと思っている前提は？<textarea data-nf="assume" rows="2" placeholder="例：保険の価値は書類で証明するもの">${esc(n.assume)}</textarea></label>
      <label class="f">ほかのやり方はない？（代わりの手段・他業界のやり方）<textarea data-nf="alts" rows="2">${esc(n.alts)}</textarea></label>`;
    box.innerHTML=meter+body;
  }else if(lens==='struct'){
    const rs=n.reasons||[];const fr=new Set(n.frictions||[]);
    const groups=[...RKINDS,['','未分類']].map(([k,l])=>({k,l,items:rs.filter(r=>(r.kind||'')===k)})).filter(g=>g.items.length);
    const idx=reasonIndex();
    const shared=rs.map(r=>({r,g:idx.get(normText(r.text))})).filter(x=>x.g&&x.g.items.length>=2);
    body=`<p class="lens-q"><b>どの理由が一番効いている？</b> 理由を種類で分け、行動を一番強く縛っている理由に★を付けます。</p>
      ${groups.length?groups.map(g=>`<div class="kgroup"><h5>${g.l}　${g.items.length}</h5>${g.items.map(r=>`<div class="krow"><button class="rstar" data-rs="${esc(r.id)}" aria-pressed="${!!r.star}" aria-label="一番効いている理由にする">★</button><span>${esc(r.text)}</span><select class="rsel" data-rk="${esc(r.id)}" aria-label="理由の種類">${kindOptions(r.kind)}</select></div>`).join('')}</div>`).join(''):'<span class="muted">「深さ」で理由を書くと、ここで分けて比べられます。</span>'}
      <div class="sec"><h3>摩擦のサイン</h3><div class="toggles">${FRICTIONS.map(([k,l])=>`<button class="tg" data-fr="${k}" aria-pressed="${fr.has(k)}">${l}</button>`).join('')}</div></div>
      ${shared.length?`<div class="sec"><h3>同じ理由がある、ほかの行動</h3>${shared.map(x=>`<div class="muted">${esc(x.r.text)}</div>${x.g.items.filter(y=>y.n.id!==n.id).map(y=>hitBtn(y.n)).join('')}`).join('')}</div>`:''}`;
    box.innerHTML=meter+body;
    box.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{const cur=new Set(n.frictions||[]);cur.has(b.dataset.fr)?cur.delete(b.dataset.fr):cur.add(b.dataset.fr);n.frictions=[...cur];commitRes(n,true);});
    box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  }else{
    const rs=n.reasons||[];const gone=rs.some(r=>r.status==='gone');
    body=`<p class="lens-q"><b>いつから、なぜこうなった？ その理由は今もある？</b> 理由が消えたのに行動だけが残っているところが、市場のタネです。</p>
      <label class="f">いつから、どんな経緯でこうなった？<textarea data-nf="since" rows="2" placeholder="例：中古車の相場情報が紙の雑誌しかなかった頃から">${esc(n.since)}</textarea></label>
      <div class="tlist">${rs.map(r=>`<div class="trow"><p>${r.star?'★ ':''}${esc(r.text)}</p><div class="seg">${Object.entries(STLABEL).map(([k,l])=>`<button data-tst="${esc(r.id)}" data-v="${k}" aria-pressed="${r.status===k}">${l}</button>`).join('')}</div><input data-tev="${esc(r.id)}" value="${esc(r.evidence)}" placeholder="根拠（例：2022年に電子契約が解禁）" aria-label="根拠"></div>`).join('')||'<span class="muted">「深さ」で理由を書くと、ここで今もあるかを判定できます。</span>'}</div>
      ${gone?'<div class="callout">理由が消えたのに、行動だけが残っています。市場のタネの典型的な形です。</div>':''}
      <label class="f">この先どう変わりそう？<textarea data-nf="future" rows="2" placeholder="例：相場データの公開が進み、5年後には自動で決まる">${esc(n.future)}</textarea></label>`;
    box.innerHTML=meter+body;
    box.querySelectorAll('[data-tst]').forEach(b=>b.onclick=()=>{const r=n.reasons.find(x=>x.id===b.dataset.tst);if(!r)return;r.status=r.status===b.dataset.v?'':b.dataset.v;commitRes(n,true);});
    box.querySelectorAll('[data-tev]').forEach(t=>t.oninput=()=>{const r=n.reasons.find(x=>x.id===t.dataset.tev);if(r){r.evidence=t.value;commitRes(n,false);}});
  }
  /* 共通の操作 */
  growAll(box);
  box.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{S.lens=b.dataset.lens;S.whyFor=null;renderRes(n);});
  box.querySelectorAll('[data-rk]').forEach(sl=>sl.onchange=()=>{const r=n.reasons.find(x=>x.id===sl.dataset.rk);if(r){r.kind=sl.value;commitRes(n,S.lens==='struct');}});
  box.querySelectorAll('[data-rw]').forEach(sl=>sl.onchange=()=>{const r=n.reasons.find(x=>x.id===sl.dataset.rw);if(r){r.who=sl.value;commitRes(n,false);}});
  box.querySelectorAll('[data-rt]').forEach(t=>t.oninput=()=>{const r=n.reasons.find(x=>x.id===t.dataset.rt);if(r){r.text=t.value;commitRes(n,false);}});
  box.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const r=n.reasons.find(x=>x.id===b.dataset.rs);if(!r)return;const on=!r.star;n.reasons.forEach(x=>x.star=false);r.star=on;commitRes(n,true);});
  box.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{const r=n.reasons.find(x=>x.id===b.dataset.rx);if(!r)return;n.reasons.forEach(x=>{if(x.parent===r.id)x.parent=r.parent||null;});n.reasons=n.reasons.filter(x=>x!==r);commitRes(n,true);toast('理由を削除しました');});
  box.querySelectorAll('[data-rwhy]').forEach(b=>b.onclick=()=>{S.whyFor=b.dataset.rwhy;renderRes(n);const t=box.querySelector('[data-rwf] textarea');if(t)t.focus();});
  box.querySelectorAll('[data-rwf]').forEach(f=>{f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('textarea').value.trim();if(!v)return;const p=n.reasons.find(x=>x.id===f.dataset.rwf);n.reasons.push({id:rid(),text:v,kind:'',who:p?p.who:'',status:'',evidence:'',star:false,parent:f.dataset.rwf});S.whyFor=null;commitRes(n,true);};
    const x=f.querySelector('[data-rwx]');if(x)x.onclick=()=>{S.whyFor=null;renderRes(n);};});
  const ra=$('#r-add');if(ra)ra.onsubmit=e=>{e.preventDefault();const v=$('#r-add-in').value.trim();if(!v)return;n.reasons.push({id:rid(),text:v,kind:$('#r-add-kind').value,who:'',status:'',evidence:'',star:false,parent:null});commitRes(n,true);const t=$('#r-add-in');if(t)t.focus();};
  box.querySelectorAll('[data-nf]').forEach(t=>t.oninput=()=>{n[t.dataset.nf]=t.value;commitRes(n,false);});
  const aa=$('#a-add');if(aa)aa.onclick=()=>{n.actors.push({id:aid(),name:'',wants:'',pains:''});renderRes(n);const ins=box.querySelectorAll('[data-af="name"]');if(ins.length)ins[ins.length-1].focus();};
  box.querySelectorAll('[data-af]').forEach(t=>t.oninput=()=>{let a=n.actors.find(x=>x.id===t.dataset.aid);if(a){a[t.dataset.af]=t.value;commitRes(n,false);}});
  box.querySelectorAll('[data-ax]').forEach(b=>b.onclick=()=>{n.actors=n.actors.filter(a=>a.id!==b.dataset.ax);commitRes(n,true);});
}

/* 各行動の分析に出典リンクを一緒に保存する。 */
function renderReferences(n){
  const area=$('#d-references');if(!area)return;
  const refs=n.references||[];
  area.innerHTML=`<div class="reference-section">
    <div class="reference-heading"><h3>参考ソース</h3><span class="muted">${refs.length?refs.length+'件':''}</span></div>
    <div class="reference-items">${refs.map(r=>{
      const url=referenceURL(r.url);if(!url)return '';
      let host='';try{host=new URL(url).hostname.replace(/^www\\./,'');}catch(e){}
      return `<div class="reference-item">
        <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(r.title||host||url)}を開く">
          <strong>${esc(r.title||host||url)}</strong><small>${esc(url)}</small>
        </a>
        <button class="reference-remove" type="button" data-ref-remove="${esc(r.id)}" aria-label="${esc(r.title||host||url)}を削除">✕</button>
      </div>`;
    }).join('')}</div>
    <form class="reference-add" id="referenceAdd">
      <input id="referenceUrl" type="text" inputmode="url" autocomplete="url" placeholder="URLを貼り付け" aria-label="参考ソースのURL" required>
      <div class="reference-add-row">
        <input id="referenceTitle" type="text" autocomplete="off" maxlength="160" placeholder="資料名（任意）" aria-label="参考ソースの資料名">
        <button class="btn sm" type="submit">＋ 追加</button>
      </div>
      <p class="reference-error" id="referenceError" role="status" hidden></p>
    </form>
  </div>`;
  $('#referenceAdd').onsubmit=e=>{
    e.preventDefault();
    const url=referenceURL($('#referenceUrl').value);
    if(!url){$('#referenceError').textContent='有効なURLを入力してください';$('#referenceError').hidden=false;return;}
    if((n.references||[]).some(r=>r.url===url)){toast('登録済みのURLです');return;}
    if(!Array.isArray(n.references))n.references=[];
    n.references.push({id:newId(),url,title:$('#referenceTitle').value.trim()});
    n.updated=Date.now();saveSoon();renderReferences(n);toast('ソースを追加しました');
  };
  area.querySelectorAll('[data-ref-remove]').forEach(b=>b.onclick=()=>{
    n.references=(n.references||[]).filter(r=>r.id!==b.dataset.refRemove);
    n.updated=Date.now();saveSoon();renderReferences(n);toast('ソースを削除しました');
  });
}

/* ---------- 分析シート ---------- */
function renderSheet(){const sh=$('#sheet');const n=S.sel&&S.nodes.get(S.sel);
  if(!n){S.detailFor=null;sh.innerHTML=`<div class="sec"><h3>使い方</h3><ol class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
    <li>起点の行動（L0）を決め、その下に観察した行動を書き出す。</li>
    <li>行動をタップして、「↑抽象化する」で何のためかを上に、「↓具体化する」で具体的なやり方を下に足す。</li>
    <li>「分析する」→「解像度」で、なぜこの行動をしているのかを、深さ・広さ・構造・時間の4つの視点で掘る。</li>
    <li>行動ごとに「本質的には何をしているか」を書く。同じ本質は別の起点の行動ともつながる。</li>
    <li>気になる行動はタネ候補にして、5つの要素で採点する。</li></ol></div>`;return;}
  if(S.detailFor!==n.id){buildSheet(n);S.detailFor=n.id;}else syncSheet(n);}
const STABS=[['res','解像度'],['tag','本質'],['seed','タネ'],['etc','その他']];
function buildSheet(n){const id=n.id;const sh=$('#sheet');S.whyFor=null;
  sh.innerHTML=`<div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><div style="min-width:0;flex:1"><div class="crumb" id="d-crumb"></div></div><button class="close" id="d-close" aria-label="閉じる">✕</button></div>
  <input class="title-in" id="d-text" aria-label="行動" autocomplete="off">
  <div class="stabs" role="tablist">${STABS.map(([k,l])=>`<button role="tab" data-st="${k}">${l}</button>`).join('')}</div>
  <div class="panel" data-panel="res"><div id="d-res" class="lens-body"></div><div id="d-references"></div></div>
  <div class="panel" data-panel="tag" hidden>
    <div class="sec"><h3>この行動は、本質的には何をしている？</h3><div class="tags" id="d-tags"></div>
    <form class="inline" id="d-tagf"><input id="d-tag-in" list="d-taglist" placeholder="例：モノの価値を決める" aria-label="本質" autocomplete="off"><datalist id="d-taglist"></datalist><button class="btn" type="submit">追加</button></form>
    <div class="tags" id="d-tagq"></div></div>
    <div class="sec"><h3>同じ本質を持つ行動</h3><div id="d-same"></div></div>
  </div>
  <div class="panel" data-panel="seed" hidden>
    <button class="tg seedtg" id="d-seed">タネ候補にする</button>
    <div class="score" id="d-score">${ELEMENTS.map(([k,l])=>`<div class="srow"><span>${l}</span><div class="dots">${[0,1,2].map(v=>`<button data-sk="${k}" data-sv="${v}" aria-label="${l} ${v}">${v}</button>`).join('')}</div></div>`).join('')}<div class="total" id="d-total"></div></div>
    <button class="btn" id="d-mkidea">この行動から事業案を作る</button>
  </div>
  <div class="panel" data-panel="etc" hidden>
    <label class="f">メモ<textarea id="d-memo" rows="4"></textarea></label>
    <div class="sec"><h3>並び順</h3><div class="inline"><button class="btn sm" id="d-mu">▲ 上へ</button><button class="btn sm" id="d-md">▼ 下へ</button></div></div>
    <div class="sec"><h3>削除</h3><div><button class="btn sm danger" id="d-del">この行動を削除</button></div></div>
  </div>`;
  sh.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.sheetTab=b.dataset.st;showSheetTab();});
  $('#d-close').onclick=()=>openSheet(false);
  $('#d-text').oninput=e=>patchLater(id,'text',e.target.value);
  $('#d-memo').oninput=e=>patchLater(id,'memo',e.target.value);
  const addTag=v=>{v=v.trim();if(!v)return;const cur=S.nodes.get(id).tags||[];if(!cur.includes(v))patch(id,{tags:[...cur,v]});};
  $('#d-tagf').onsubmit=e=>{e.preventDefault();addTag($('#d-tag-in').value);$('#d-tag-in').value='';};
  $('#d-tagq').addEventListener('click',e=>{const b=e.target.closest('[data-qt]');if(b)addTag(b.dataset.qt);});
  $('#d-same').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)select(b.dataset.go,true);});
  $('#d-seed').onclick=()=>patch(id,{seed:!S.nodes.get(id).seed});
  $('#d-mkidea').onclick=()=>{openSheet(false);mkIdea([{type:'node',id}],S.nodes.get(id).text);};
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const sc={...(S.nodes.get(id).scores||{})};sc[b.dataset.sk]=Number(b.dataset.sv);patch(id,{scores:sc});});
  $('#d-mu').onclick=()=>move(id,-1);$('#d-md').onclick=()=>move(id,1);
  const del=$('#d-del');let armed=false;
  del.onclick=()=>{if(!armed){armed=true;const c=descendants(id).length;del.textContent=c?`下の${c}件もまとめて削除する`:'本当に削除する';setTimeout(()=>{armed=false;if(del.isConnected)del.textContent='この行動を削除';},3500);return;}openSheet(false);delNode(id);};
  showSheetTab();syncSheet(n,true);renderReferences(n);}
function showSheetTab(){document.querySelectorAll('#sheet [data-st]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.st===S.sheetTab)));document.querySelectorAll('#sheet [data-panel]').forEach(p=>p.hidden=p.dataset.panel!==S.sheetTab);}
function syncSheet(n,first){
  const setVal=(sel,v)=>{const el=$(sel);if(el&&(first||document.activeElement!==el))el.value=v||'';};
  const cr=pathOf(n.id).slice(0,-1).map(p=>p.text).join(' › ');
  $('#d-crumb').textContent=`L${depth(n.id)}${cr?'　'+cr+' ›':''}`;
  setVal('#d-text',n.text);setVal('#d-memo',n.memo);
  const rb=$('#d-res');if(rb&&(first||!rb.contains(document.activeElement)))renderRes(n);
  const tags=n.tags||[];
  $('#d-tags').innerHTML=tags.map(t=>`<button class="tagx" data-rm="${esc(t)}" aria-label="${esc(t)}を外す">${esc(t)} ✕</button>`).join('')||`<span class="muted">まだありません</span>`;
  $('#d-tags').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>patch(n.id,{tags:(S.nodes.get(n.id).tags||[]).filter(t=>t!==b.dataset.rm)}));
  const idx=tagIndex();const others=[...idx.keys()].filter(t=>!tags.includes(t));
  $('#d-taglist').innerHTML=others.map(t=>`<option value="${esc(t)}"></option>`).join('');
  $('#d-tagq').innerHTML=others.length?`<span class="muted">これまでに書いた本質：</span>`+others.slice(0,8).map(t=>`<button class="tagx" data-qt="${esc(t)}">＋ ${esc(t)}</button>`).join(''):'';
  const same=[];for(const t of tags)for(const m of(idx.get(t)||[]))if(m.id!==n.id&&!same.some(s=>s.id===m.id))same.push(m);
  $('#d-same').innerHTML=same.length?same.map(hitBtn).join(''):`<span class="muted">同じ本質を持つ行動はまだありません。</span>`;
  $('#d-seed').setAttribute('aria-pressed',String(!!n.seed));$('#d-seed').textContent=n.seed?'タネ候補にしている':'タネ候補にする';
  $('#d-score').hidden=!n.seed;
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.setAttribute('aria-pressed',String((Number(n.scores?.[b.dataset.sk])||0)===Number(b.dataset.sv))));
  $('#d-total').textContent=`合計 ${scoreOf(n)} / 10`;}

/* ---------- 起動 ---------- */
$('#scrim').onclick=()=>openSheet(false);
$('#copyFallbackClose').onclick=()=>{$('#copyFallback').hidden=true;};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.adding){S.adding=null;renderMain();}else openSheet(false);}});
loadAll();
if(!S.nodes.size) S.tab='tree';
render();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js?v=35',{updateViaCache:'none'}).then(reg=>reg.update().catch(()=>{})).catch(()=>{});
</script>
</body>

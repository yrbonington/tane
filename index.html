<style>
/* 現場ノート：はしご（上が抽象、字下げするほど具体）を作業面にし、選んだ行動の場で操作する。分析シートは下からせり上がる。 */

  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#16202A; --ink-2:#56626C; --line:#D5DDDB;

  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#111518; --surface:#192024; --ink:#E5ECEA; --ink-2:#9AA6A3; --line:#2A3338;
  --accent:#8FA3FF; --accent-soft:rgba(143,163,255,.14); --on-accent:#0D1240;
  --seed:#B3D34C; --seed-soft:rgba(179,211,76,.30); --seed-ink:#1A2300;
  --warn:#E3A35A; --warn-soft:rgba(227,163,90,.14); color-scheme:dark } }

<body>
<div class="wrap">
  <header class="bar">
    <div class="bar-top"><h1>市場のタネ帳</h1><span class="status" id="status"></span></div>
    <div class="themes" id="themes"></div>
    <form class="newtheme" id="themeForm" hidden><input id="themeInput" placeholder="新しいテーマ（例：家を借りる）" aria-label="新しいテーマ" autocomplete="off"><button class="btn pri" type="submit">作る</button><button class="btn icon" type="button" id="themeCancel" aria-label="やめる">✕</button></form>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="tree">ツリー</button>
      <button class="tab" role="tab" data-tab="same">つながり<span class="n" id="n-same"></span></button>
      <button class="tab" role="tab" data-tab="seed">タネ<span class="n" id="n-seed"></span></button>
      <button class="tab" role="tab" data-tab="data">データ</button>
    </div>
  </header>
  <div class="grid">
    <main id="main" style="min-width:0"></main>
    <aside class="sheet" id="sheet" aria-label="選んだ行動の分析"></aside>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>
<script type="text/plain" id="aiPromptText">あなたは「市場のタネ帳」の相棒です。わたしが日常や仕事で観察した人の行動を一緒に分解し、新しい市場のタネを探します。最後に、タネ帳アプリに読み込めるJSONを出力します。

# あなたの役割
- わたしの観察を引き出し、整理し、問いを投げる相棒です。答えを決めるのはわたしです。
- わたしが見たこと（事実）と、あなたの推測（仮説）をはっきり分けてください。あなたの推測を書くときは、文頭に「仮説：」と付けます。
- わたしが言っていない行動や事実を、勝手に足さないでください。候補を出すのは歓迎ですが、採用するかはわたしが決めます。

# 話し方
- 日本語で、スマホで読みやすいように短く話してください。1回の返事は、長くても画面1枚分までにします。
- 質問は1回に1つだけにします。
- 前置きや褒め言葉は省き、すぐ本題に入ります。

# 進め方
次の順に進めます。わたしが別の順を望んだら、それに合わせてください。

1. 始める
   最初に「新しいテーマを始めますか？それとも、タネ帳から書き出したJSONを貼りますか？」と聞いてください。
   - JSONが貼られたら、中身を読み取り、テーマと行動のツリーを短くまとめて見せてから続けます。
   - 新しいテーマなら、テーマ名（例：家を借りる）を聞きます。

2. 行動を書き出す
   そのテーマで人がやっている行動を、思いつくまま挙げてもらいます。違和感がなくても、普通にやっている行動で構いません。
   書き出しが終わったら、番号付きの一覧にして見せます。

3. 上下に動かす（抽象化・具体化）
   気になる行動を1つ選んでもらい、次の2つの問いで上下に動かします。
   - 抽象化：「それは何のためにやっている？」（答えを1段上に置く）
   - 具体化：「具体的にはどうやっている？」（答えを1段下に置く）
   複数の当事者が関わる、書類や情報を人が手で集めて渡す、お金が動く、といった行動は、具体化して掘る価値が高いと伝えてください。
   深く掘りすぎて話が細かくなりすぎたら、一度上に戻ることを提案してください。

4. 分解する
   掘った行動について、次を1つずつ聞きます。
   - 摩擦のサイン：複数の当事者／書類・情報の手渡し／お金が動く／待ち時間／手作業／毎回やり直し、のうちどれがあるか
   - 背景：なぜ人はこのやり方をしているのか
   - 制約：何がこのやり方を強いているのか（技術、規制、慣習、コスト、情報の偏りなど）
   - その制約は今もあるか：まだある／薄れている／もう無い／未確認
   「制約が消えた・薄れているのに、行動だけが残っている」ものが見つかったら、市場のタネの典型として強調してください。

5. 本質を書く
   それぞれの行動が「本質的には何をしているか」を短く言い表します（例：協定価額を決める → モノの価値を決める）。
   場面の言葉（車の、家の、など）を外した言い方にして、他のテーマともつながるようにします。すでに使っている本質の言い方があれば、それを優先して使います。
   同じ本質が別の行動や別のテーマにも出てきたら、そのつながりを指摘してください。

6. タネとして評価する
   わたしが「これはタネかも」と言った行動は、次の5つを0〜2点で一緒に採点します。点の理由も一言添えてください。
   - alt：代わりの手段で無理やり済ませている
   - now：「なぜ今」がある（技術・規制・コストの変化）
   - money：お金がすでに別の名目で使われている
   - repeat：繰り返し起こり、広がっている
   - gap：大手がやりたがらない理由がある

# わたしが使う合図
- 「まとめ」：今のツリーを、字下げした一覧で見せてください（各行に、本質・摩擦・制約の状態・タネの点数があれば添える）。
- 「保存」または「JSON」：下の形式でJSONを出力してください。
- 「戻る」：1つ前の段階に戻ります。

# JSONの出力ルール
「保存」と言われたら、説明を最小限にして、次の形式のJSONを1つのコードブロックで出力します。

- JSONとして正しい形にします。コメント、末尾のカンマ、全角の引用符は使いません。
- nodes には、この会話で新しく作った行動と、内容を変えた行動だけを入れます。変えていない既存の行動は入れません。
- 既存の行動（最初に貼られたJSONにあったもの）を変えたときは、その id をそのまま使います。アプリは同じ id を上書きします。
- 新しい行動の id は、他と重ならないように「t」＋今日の日付8桁＋「-」＋3桁の連番にします（例：t20261010-001）。日付が分からなければ、最初にわたしに聞いてください。
- parent には親の行動の id を入れます。テーマ（いちばん上）だけ null にします。既存の行動の下に足すときは、その既存の id を parent に入れます。
- order は、同じ親の中での並び順です（0から）。
- frictions は次の英語のキーだけを使います：parties（複数の当事者）、docs（書類・情報の手渡し）、money（お金が動く）、wait（待ち時間）、manual（手作業）、repeat（毎回やり直し）。
- status は次のどれかです：still（まだある）、fading（薄れている）、gone（もう無い）、unknown（未確認）、""（未記入）。
- tags には「本質」の言い方を文字列で入れます。
- seed は、タネ候補なら true です。scores は alt, now, money, repeat, gap をそれぞれ 0〜2 の数字で入れます。
- why（背景）、constraint（制約）は、わたしが同意した内容だけを入れます。あなたの仮説のままのものは、memo に「仮説：〜」として入れます。
- 行動が多くて1回で出し切れないときは、「続く」と書いて分割し、わたしが「続き」と言ったら残りを出します。分割したそれぞれが、単独で正しいJSONになるようにします。

形式の例：
```json
{
  "app": "tane",
  "version": 1,
  "exportedAt": 0,
  "nodes": [
    {
      "id": "t20261010-001",
      "text": "家を借りる",
      "parent": null,
      "order": 0,
      "frictions": [],
      "why": "",
      "constraint": "",
      "status": "",
      "tags": [],
      "seed": false,
      "scores": {},
      "memo": ""
    },
    {
      "id": "t20261010-002",
      "text": "入居審査を受ける",
      "parent": "t20261010-001",
      "order": 0,
      "frictions": ["parties", "docs", "wait"],
      "why": "貸主が、家賃を払い続けられる人かを事前に確かめたい。",
      "constraint": "借り手の支払い能力を示す共通の情報がなく、毎回書類で証明するしかない。",
      "status": "fading",
      "tags": ["支払い能力を証明する"],
      "seed": true,
      "scores": {"alt": 2, "now": 1, "money": 1, "repeat": 2, "gap": 1},
      "memo": "仮説：保証会社ごとに審査をやり直している"
    }
  ]
}
```

では、始めてください。</script>

<script>
'use strict';
const KEY='tane.v1', KEY_EXPORT='tane.lastExport', KEY_THEME='tane.theme';
const FRICTIONS=[['parties','複数の当事者'],['docs','書類・情報の手渡し'],['money','お金が動く'],['wait','待ち時間'],['manual','手作業'],['repeat','毎回やり直し']];
const STATUS=[['still','まだある'],['fading','薄れている'],['gone','もう無い'],['unknown','未確認']];
const ELEMENTS=[['alt','代わりの手段で無理やり済ませている'],['now','「なぜ今」がある（技術・規制・コストの変化）'],['money','お金がすでに別の名目で使われている'],['repeat','繰り返し起こり、広がっている'],['gap','大手がやりたがらない理由がある']];
const S={nodes:new Map(),theme:null,sel:null,focus:null,tab:'tree',collapsed:new Set(),detailFor:null,sheetTab:'cut',adding:null,renaming:null,importText:null,confirmReplace:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const wide=()=>matchMedia('(min-width:900px)').matches;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}

/* ---------- 端末内の保存 ---------- */
function loadAll(){ try{ const o=JSON.parse(ls.get(KEY)||'null'); if(o&&Array.isArray(o.nodes)) S.nodes=new Map(o.nodes.filter(n=>n&&n.id).map(n=>[n.id,n])); }catch(e){} }
let saveTimer=null;
function saveNow(){ const ok=ls.set(KEY,JSON.stringify({version:1,savedAt:Date.now(),nodes:[...S.nodes.values()]})); if(!ok) toast('保存できませんでした。端末の空き容量を確認してください。'); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,300); }
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNow(); });

function blank(text,parent,order){return{text,parent,order,frictions:[],why:'',constraint:'',status:'',tags:[],seed:false,scores:{},memo:'',created:Date.now()};}
function put(id,data){ S.nodes.set(id,{id,...data}); saveSoon(); render(); }
function patch(id,data,quiet){ const n=S.nodes.get(id); if(!n) return; Object.assign(n,data); saveSoon(); if(!quiet) render(); else { renderMain(); renderTabs(); } }
function remove(id){ S.nodes.delete(id); }
const timers={};
function patchLater(id,field,value){ clearTimeout(timers[id+field]); timers[id+field]=setTimeout(()=>patch(id,{[field]:value},true),400); }

/* ---------- ツリーの道具 ---------- */
const kids=id=>[...S.nodes.values()].filter(n=>(n.parent||null)===id).sort((a,b)=>(a.order??0)-(b.order??0)||(a.created??0)-(b.created??0));
const roots=()=>kids(null);
function pathOf(id){const p=[];let n=S.nodes.get(id),g=0;while(n&&g++<60){p.unshift(n);n=n.parent?S.nodes.get(n.parent):null;}return p;}
const rootOf=id=>pathOf(id)[0]?.id||null;
const depth=id=>pathOf(id).length-1;
function descendants(id){const o=[];const w=x=>{for(const k of kids(x)){o.push(k.id);w(k.id);}};w(id);return o;}
const scoreOf=n=>ELEMENTS.reduce((s,[k])=>s+(Number(n.scores?.[k])||0),0);
const themeName=id=>S.nodes.get(rootOf(id))?.text||'';
function tagIndex(){const m=new Map();for(const n of S.nodes.values())for(const t of(n.tags||[])){if(!m.has(t))m.set(t,[]);m.get(t).push(n);}return m;}

/* ---------- 操作 ---------- */
function addChild(pid,text){const t=text.trim();if(!t)return null;const id=newId();const ks=kids(pid);S.collapsed.delete(pid);put(id,blank(t,pid,ks.length?Math.max(...ks.map(k=>k.order??0))+1:0));return id;}
function addParent(id,text){const t=text.trim();const n=S.nodes.get(id);if(!t||!n)return null;const pid=newId();
  S.nodes.set(pid,{id:pid,...blank(t,n.parent||null,n.order??0)}); n.parent=pid; n.order=0;
  if(S.theme===id){S.theme=pid;ls.set(KEY_THEME,pid);} if(S.focus===id)S.focus=pid; saveSoon(); return pid;}
function addSibling(id,text){const n=S.nodes.get(id);if(!n)return null;if(!n.parent)return addTheme(text);const t=text.trim();if(!t)return null;
  const sib=kids(n.parent);const i=sib.findIndex(s=>s.id===id);const nid=newId();
  S.nodes.set(nid,{id:nid,...blank(t,n.parent,0)});
  const after=[...sib.slice(0,i+1),S.nodes.get(nid),...sib.slice(i+1)]; after.forEach((x,k)=>x.order=k); saveSoon(); return nid;}
function addTheme(text){const t=text.trim();if(!t)return null;const id=newId();S.nodes.set(id,{id,...blank(t,null,roots().length)});S.theme=id;S.focus=null;ls.set(KEY_THEME,id);saveSoon();select(id,false);return id;}
function delNode(id){const n=S.nodes.get(id);if(!n)return;const all=[id,...descendants(id)];
  S.sel=n.parent||null;S.detailFor=null;S.adding=null;if(S.focus&&all.includes(S.focus))S.focus=null;if(!n.parent)S.theme=null;
  for(const x of all)remove(x); saveSoon(); render(); toast('削除しました');}
function move(id,dir){const n=S.nodes.get(id);const sib=kids(n.parent||null);const i=sib.findIndex(s=>s.id===id);const j=i+dir;if(j<0||j>=sib.length)return;
  const r=[...sib];r.splice(i,1);r.splice(j,0,n);r.forEach((x,k)=>x.order=k);saveSoon();render();}
function select(id,openDetail){
  if(S.sel!==id){S.adding=null;}
  S.sel=id; if(id){const r=rootOf(id);if(r&&r!==S.theme){S.theme=r;S.focus=null;ls.set(KEY_THEME,r);}}
  S.tab='tree'; render(); if(openDetail) openSheet(true);
  if(id) requestAnimationFrame(()=>{const el=document.querySelector(`[data-item="${CSS.escape(id)}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<170||r.bottom>innerHeight-20)el.scrollIntoView({block:'center',behavior:'smooth'});}});
}
function openSheet(on){$('#sheet').classList.toggle('open',on);$('#scrim').hidden=!on||wide();}

/* ---------- 描画 ---------- */
function daysSinceExport(){const t=Number(ls.get(KEY_EXPORT)||0);return t?Math.floor((Date.now()-t)/864e5):null;}
function render(){
  const act=document.activeElement; const keep=act&&act.id==='addIn'?{v:act.value}:null;
  const d=daysSinceExport(); const st=$('#status');
  if(S.nodes.size && (d===null||d>=7)){ st.textContent=d===null?'バックアップ未作成':`バックアップ ${d}日前`; st.className='status alert'; }
  else { st.textContent='この端末に保存'; st.className='status'; }
  if(S.theme&&!S.nodes.has(S.theme))S.theme=null;
  if(!S.theme){const sv=ls.get(KEY_THEME);S.theme=(sv&&S.nodes.has(sv)&&!S.nodes.get(sv).parent)?sv:(roots()[0]?.id||null);}
  if(S.sel&&!S.nodes.has(S.sel))S.sel=null; if(S.focus&&!S.nodes.has(S.focus))S.focus=null;
  renderThemes(); renderTabs(); renderMain(); renderSheet();
  if(keep){const i=$('#addIn');if(i){i.value=keep.v;i.focus();}}
}
function renderThemes(){
  const el=$('#themes');
  el.innerHTML=roots().map(r=>`<button class="chip" data-theme-id="${esc(r.id)}" aria-pressed="${r.id===S.theme&&S.tab!=='data'}">${esc(r.text)}</button>`).join('')+`<button class="chip ghost" id="themeNew">＋ テーマ</button>`;
  el.querySelectorAll('[data-theme-id]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeId;S.focus=null;ls.set(KEY_THEME,S.theme);S.sel=null;S.adding=null;S.tab='tree';render();openSheet(false);});
  $('#themeNew').onclick=()=>{$('#themeForm').hidden=false;$('#themeInput').focus();};
}
$('#status').onclick=()=>{S.tab='data';render();};
$('#themeForm').onsubmit=e=>{e.preventDefault();const v=$('#themeInput').value;$('#themeInput').value='';$('#themeForm').hidden=true;addTheme(v);};
$('#themeCancel').onclick=()=>{$('#themeForm').hidden=true;};
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t=>{t.setAttribute('aria-selected',String(t.dataset.tab===S.tab));t.onclick=()=>{S.tab=t.dataset.tab;if(S.tab!=='tree')openSheet(false);render();window.scrollTo({top:0});};});
  $('#n-same').textContent=[...tagIndex().values()].filter(a=>a.length>=2).length||'';
  $('#n-seed').textContent=[...S.nodes.values()].filter(n=>n.seed).length||'';
}
function badges(n){const o=[];const fr=(n.frictions||[]).length;
  if(n.status==='gone')o.push(`<span class="b b-gone">制約が消えた</span>`);else if(n.status==='fading')o.push(`<span class="b b-fade">制約が薄れている</span>`);
  if(fr)o.push(`<span class="b b-fr">摩擦のサイン ${fr}つ</span>`);
  for(const t of(n.tags||[]))o.push(`<span class="b b-tag">本質：${esc(t)}</span>`);
  if(n.seed)o.push(`<span class="b b-seed">タネ ${scoreOf(n)}点</span>`);
  return o.join('');}
function renderMain(){const m=$('#main');if(S.tab==='tree')return renderTree(m);if(S.tab==='same')return renderSame(m);if(S.tab==='seed')return renderSeeds(m);return renderData(m);}

/* ---------- ツリー ---------- */
function addHint(n,mode){
  if(mode==='up')return `「${n.text}」は、何のためにやっている？　答えをこの行動の1段上に入れます。`;
  if(mode==='down')return `「${n.text}」を、具体的にはどうやっている？　この行動の1段下に入れます。続けて何個でも追加できます。`;
  const p=n.parent&&S.nodes.get(n.parent);return p?`「${p.text}」のために、ほかにどんな行動をしている？　この行動と同じ段に入れます。`:'';
}
function renderTree(m){
  if(!S.theme){m.innerHTML=`<div class="empty"><b>まだテーマがありません。</b><br>上の「＋ テーマ」から、観察したい行動のまとまり（例：車を保有する）を作ってください。前のデータがある場合は「データ」タブから読み込めます。</div>`;return;}
  const top=S.focus||S.theme;const d0=depth(top);const rows=[];
  const walk=id=>{const n=S.nodes.get(id);const d=depth(id);const rel=d-d0;const ks=kids(id);const shut=S.collapsed.has(id);const sel=S.sel===id;
    rows.push(`<div class="item ${sel?'sel':''}" data-item="${esc(id)}"><div class="row"><span class="indent">${'<i></i>'.repeat(Math.min(rel,6))}</span>
      <button class="caret" data-caret="${esc(id)}" ${ks.length?'':'disabled'} aria-label="${shut?'開く':'閉じる'}">${ks.length?(shut?'▶':'▼'):''}</button>
      <button class="node ${d===0?'root':''}" data-node="${esc(id)}"><span class="line1"><span class="lv">L${d}</span><span class="t">${esc(n.text)}${ks.length&&shut?` <span class="muted">（下に${descendants(id).length}件）</span>`:''}</span></span>${badges(n)?`<span class="meta">${badges(n)}</span>`:''}</button>
      </div>${sel?actionBar(n,rel):''}</div>`);
    if(!shut)for(const k of ks)walk(k.id);};
  walk(top);
  const fb=S.focus?`<div class="focusbar"><button data-zoom="">全体</button>${pathOf(S.focus).map(p=>`› <button data-zoom="${esc(p.id)}">${esc(p.text)}</button>`).join('')}</div>`:'';
  m.innerHTML=fb+(S.sel?'':`<p class="tapnote">行動をタップすると、抽象化・具体化・分析のボタンが出ます。</p>`)+`<div class="rows">${rows.join('')}</div>`+(S.sel?'':`<div class="quick"><button class="btn" id="quickAdd">＋「${esc(S.nodes.get(top).text)}」の下に行動を追加</button></div>`);
  m.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{const id=b.dataset.node;if(S.sel===id)select(null);else select(id,false);});
  m.querySelectorAll('[data-caret]').forEach(b=>b.onclick=()=>{const id=b.dataset.caret;S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);renderMain();});
  m.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{S.focus=b.dataset.zoom||null;render();});
  const q=$('#quickAdd');if(q)q.onclick=()=>{select(top,false);startAdd(top,'down');};
  bindActionBar();
}
function actionBar(n,rel){const isRoot=!n.parent;const a=S.adding&&S.adding.id===n.id?S.adding.mode:null;const pad=Math.min(rel,6)*16+32;
  return `<div class="actions" style="padding-left:${pad}px">
    <button class="act ${a==='up'?'main':''}" data-add="up"><b><i>↑</i>抽象化する</b><small>何のためにやっているかを、1段上に追加</small></button>
    <button class="act ${a==='down'?'main':''}" data-add="down"><b><i>↓</i>具体化する</b><small>具体的にどうやっているかを、1段下に追加</small></button>
    ${isRoot?'':`<button class="act ${a==='sib'?'main':''}" data-add="sib"><b><i>→</i>同じ段に追加</b><small>この行動と並ぶ、別の行動を追加</small></button>`}
    <button class="act" id="openSheet"><b><i>◎</i>分析する</b><small>摩擦・背景・制約・本質・タネ評価</small></button>
    ${S.focus===n.id||!kids(n.id).length?'':`<button class="act" id="zoomHere"><b><i>⌕</i>この下だけ表示</b><small>ほかの行動を隠して、ここに集中する</small></button>`}
  </div>${a?`<div class="addbox" style="padding-left:${pad}px"><span class="hint">${esc(addHint(n,a))}</span>
    <form class="inline" id="addForm"><input id="addIn" enterkeyhint="done" autocomplete="off" aria-label="${esc(addHint(n,a))}"><button class="btn pri" type="submit">追加</button><button class="btn icon" type="button" id="addX" aria-label="閉じる">✕</button></form></div>`:''}`;}
function startAdd(id,mode){S.adding={id,mode};renderMain();const i=$('#addIn');if(i)i.focus();}
function bindActionBar(){if(!S.sel)return;const id=S.sel;
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const mode=b.dataset.add;if(S.adding&&S.adding.mode===mode){S.adding=null;renderMain();}else startAdd(id,mode);});
  const z=$('#zoomHere');if(z)z.onclick=()=>{S.focus=id;render();};
  const o=$('#openSheet');if(o)o.onclick=()=>{renderSheet();openSheet(true);};
  const f=$('#addForm');if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const i=$('#addIn');const v=i.value.trim();const mode=S.adding.mode;
    if(!v){S.adding=null;renderMain();return;}
    i.value='';
    if(mode==='down'){addChild(id,v);const ni=$('#addIn');if(ni){ni.value='';ni.focus();}}
    else if(mode==='up'){const pid=addParent(id,v);S.adding=null;if(pid)select(pid,false);}
    else{const nid=addSibling(id,v);S.adding=null;if(nid){select(nid,false);startAdd(nid,'sib');}}};
  $('#addX').onclick=()=>{S.adding=null;renderMain();};
}

/* ---------- つながり ---------- */
function bigrams(s){const t=s.replace(/\s/g,'');const a=new Set();for(let i=0;i<t.length-1;i++)a.add(t.slice(i,i+2));return a;}
function sim(a,b){const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let x=0;for(const g of A)if(B.has(g))x++;return x/(A.size+B.size-x);}
function similarGroups(){const ns=[...S.nodes.values()].filter(n=>n.parent&&(n.text||'').length>=3);
  const par=new Map(ns.map(n=>[n.id,n.id]));const find=x=>{while(par.get(x)!==x)x=par.get(x);return x;};
  const isAnc=(a,b)=>pathOf(b).some(p=>p.id===a);
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){const a=ns[i],b=ns[j];
    if((a.tags||[]).some(t=>(b.tags||[]).includes(t)))continue; if(isAnc(a.id,b.id)||isAnc(b.id,a.id))continue;
    if(a.text.trim()===b.text.trim()||sim(a.text,b.text)>=0.5)par.set(find(a.id),find(b.id));}
  const g=new Map();for(const n of ns){const r=find(n.id);if(!g.has(r))g.set(r,[]);g.get(r).push(n);}
  return [...g.values()].filter(a=>a.length>=2).slice(0,12);}
function hitBtn(n){return `<button class="hit" data-go="${esc(n.id)}"><span class="ht"><b>${esc(n.text)}</b><small>${esc(pathOf(n.id).slice(1,-1).map(p=>p.text).join(' › '))}</small></span><span class="thm">${esc(themeName(n.id))}・L${depth(n.id)}</span></button>`;}
function bindGo(m){m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go,true));}
function renderSame(m){
  const groups=[...tagIndex().entries()].map(([t,ns])=>({t,ns,themes:new Set(ns.map(n=>rootOf(n.id))).size})).sort((a,b)=>b.themes-a.themes||b.ns.length-a.ns.length);
  const cross=groups.filter(g=>g.themes>=2),within=groups.filter(g=>g.themes<2&&g.ns.length>=2),single=groups.filter(g=>g.ns.length<2);const cand=similarGroups();
  const card=g=>`<div class="card"><h4><span class="${g.ns.length>=2?'mark':''}">${esc(g.t)}</span><span class="b ${g.themes>=2?'b-gone':'b-tag'}">${g.themes>=2?`${g.themes}テーマ・`:''}${g.ns.length}か所</span><span class="sp"></span><button class="linkbtn" data-rename="${esc(g.t)}">名前を変える</button></h4>
    ${S.renaming===g.t?`<form class="inline" data-renform="${esc(g.t)}"><input value="${esc(g.t)}" aria-label="新しい名前"><button class="btn pri sm" type="submit">変更</button></form>`:''}${g.ns.map(hitBtn).join('')}</div>`;
  m.innerHTML=`<div class="list">
    <p class="muted" style="margin:0">行動ごとに「本質的には何をしているか」を書くと、同じ本質を持つ行動がここに集まります。「車の」など場面の言葉を外した書き方（例：モノの価値を決める）にすると、テーマをまたいでつながりやすくなります。</p>
    <p class="h2">テーマをまたいでつながる本質</p>${cross.length?cross.map(card).join(''):`<div class="muted">2つ以上のテーマで同じ本質が書かれると、ここに出ます。</div>`}
    <p class="h2">同じテーマの中で繰り返し出てくる本質</p>${within.length?within.map(card).join(''):`<div class="muted">まだありません。</div>`}
    <p class="h2">文言が似ている行動（同じ本質かもしれないもの）</p>
    ${cand.length?cand.map((ns,i)=>`<div class="card"><h4>${esc(ns[0].text)}<span class="b b-tag">${ns.length}か所</span></h4>${ns.map(hitBtn).join('')}<form class="inline" data-candform="${i}"><input placeholder="共通の本質（例：審査を受ける）" aria-label="共通の本質"><button class="btn sm" type="submit">この本質でまとめる</button></form></div>`).join(''):`<div class="muted">文言が似ている行動が見つかると、ここに候補として出ます。</div>`}
    ${single.length?`<p class="h2">1か所だけの本質</p><div class="card">${single.map(g=>`<div class="tags"><span class="b b-tag">${esc(g.t)}</span></div>${g.ns.map(hitBtn).join('')}`).join('')}</div>`:''}
  </div>`;
  bindGo(m);
  m.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{S.renaming=S.renaming===b.dataset.rename?null:b.dataset.rename;renderMain();const i=m.querySelector('[data-renform] input');if(i)i.focus();});
  m.querySelectorAll('[data-renform]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const from=f.dataset.renform;const to=f.querySelector('input').value.trim();S.renaming=null;
    if(to&&to!==from){for(const n of S.nodes.values())if((n.tags||[]).includes(from))n.tags=[...new Set(n.tags.map(t=>t===from?to:t))];saveSoon();toast('名前を変えました');}render();});
  m.querySelectorAll('[data-candform]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;const ns=cand[Number(f.dataset.candform)];
    for(const n of ns){const cur=n.tags||[];if(!cur.includes(v))n.tags=[...cur,v];}saveSoon();render();toast(`「${v}」で${ns.length}か所をまとめました`);});
}
function renderSeeds(m){const all=[...S.nodes.values()];
  const seeds=all.filter(n=>n.seed).sort((a,b)=>scoreOf(b)-scoreOf(a));
  const gone=all.filter(n=>!n.seed&&(n.status==='gone'||n.status==='fading'));
  const dig=all.filter(n=>!n.seed&&(n.frictions||[]).length>=2&&!n.why&&!n.constraint);
  const seedCard=n=>`<div class="card"><h4>${esc(n.text)}<span class="b b-seed">${scoreOf(n)}/10</span></h4><div class="bars">${ELEMENTS.map(([k,l])=>{const v=Number(n.scores?.[k])||0;return `<span><i class="${v>=1?'on':''}"></i><i class="${v>=2?'on':''}"></i>${esc(l.slice(0,6))}</span>`;}).join('')}</div>${hitBtn(n)}</div>`;
  m.innerHTML=`<div class="list">
    <p class="h2">タネ候補</p>${seeds.length?seeds.map(seedCard).join(''):`<div class="empty">まだタネ候補はありません。行動を選んで「分析する」→「タネ」で候補にすると、5つの要素で採点してここに並びます。</div>`}
    <p class="h2">制約が消えた・薄れているのに、行動が残っている</p>${gone.length?`<div class="card">${gone.map(hitBtn).join('')}</div>`:`<div class="muted">「分解」で、制約が「もう無い」「薄れている」とした行動がここに出ます。</div>`}
    <p class="h2">摩擦が多いのに、まだ分解していない行動</p>${dig.length?`<div class="card">${dig.map(hitBtn).join('')}</div>`:`<div class="muted">摩擦のサインが2つ以上あり、背景と制約が空の行動がここに出ます。</div>`}
  </div>`; bindGo(m);}

/* ---------- データ（バックアップ） ---------- */
function exportJSON(){return JSON.stringify({app:'tane',version:1,exportedAt:Date.now(),nodes:[...S.nodes.values()]},null,1);}
function stamp(){const d=new Date();const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;}
function markExported(){ls.set(KEY_EXPORT,String(Date.now()));render();}
function parseBackup(text){let o;try{o=JSON.parse(text);}catch(e){throw new Error('ファイルの形式が読み取れませんでした。タネ帳から書き出したファイルを選んでください。');}
  const arr=Array.isArray(o)?o:o&&Array.isArray(o.nodes)?o.nodes:null; if(!arr) throw new Error('タネ帳のバックアップではないようです。');
  const out=arr.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string').map(n=>({...blank('',null,0),...n}));
  if(!out.length) throw new Error('読み込める行動が入っていませんでした。'); return out;}
function renderData(m){
  const d=daysSinceExport(); const themes=roots().length;
  m.innerHTML=`<div class="list">
    <div class="card"><h4>この端末のデータ</h4><div class="stat"><span><b>${themes}</b>テーマ</span><span><b>${S.nodes.size-themes}</b>行動</span><span><b>${d===null?'—':d+'日前'}</b>最後のバックアップ</span></div>
      <p class="muted" style="margin:0">書いた内容は、このiPhoneの中にだけ保存されます。インターネットには送られません。機種変更や故障、Safariのデータ削除で消えることがあるので、週に1回はバックアップを取ってください。</p></div>
    <div class="card"><h4>AIと対話する</h4>
      <p class="muted" style="margin:0">「プロンプトをコピー」を押して、ChatGPTやClaudeの新しい会話に貼り付けてください。今のツリーも渡したい場合は、下のバックアップの「コピー」でJSONを追加してください。</p>
      <div class="btnrow"><button class="btn pri" type="button" id="aiCopyPrompt">AI対話用プロンプトをコピー</button></div>
      <div id="aiPromptFallback" hidden><p class="muted">自動コピーができませんでした。下の欄を長押しして、すべて選択してコピーしてください。</p><textarea id="aiPromptFallbackText" rows="6" readonly aria-label="AI対話用プロンプト"></textarea></div>
    </div>
    <div class="card"><h4>バックアップを取る</h4>
      <p class="muted" style="margin:0">「ファイルに保存」では、共有メニューから「"ファイル"に保存」を選ぶと、iPhoneの中かiCloud Driveに残せます。Claudeに分析を頼むときは「コピー」して、チャットに貼ってください。</p>
      <div class="btnrow"><button class="btn pri" id="exShare">ファイルに保存</button><button class="btn" id="exCopy">コピー</button></div></div>
    <div class="card"><h4>バックアップから読み込む</h4>
      <p class="muted" style="margin:0">前に書き出したファイル（.json）を選びます。同じ行動は読み込んだ内容で上書きし、新しい行動は追加します。</p>
      <div class="btnrow"><label class="btn" for="imFile">ファイルを選ぶ</label><input type="file" id="imFile" accept=".json,application/json,text/plain" hidden><button class="btn" id="imPasteOpen">貼り付けて読み込む</button></div>
      <div id="imPasteBox" hidden><textarea id="imText" rows="5" placeholder="書き出した内容を貼り付け"></textarea><div class="btnrow" style="margin-top:6px"><button class="btn pri" id="imPasteGo">読み込む</button></div></div>
      <div id="imResult" class="muted"></div></div>
    <div class="card"><h4>すべて消す</h4><p class="muted" style="margin:0">この端末のデータをすべて削除します。先にバックアップを取ってください。</p><div><button class="btn danger" id="wipe">すべて消す</button></div></div>
  </div>`;
  $('#aiCopyPrompt').onclick=async()=>{
    const text=$('#aiPromptText').textContent.trim();
    let copied=false;
    if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(text);copied=true;}catch(e){}}
    if(!copied){
      const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');
      t.style.cssText='position:fixed;left:0;top:0;opacity:0;pointer-events:none';
      document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);
      try{copied=document.execCommand('copy');}catch(e){}t.remove();
    }
    if(copied){$('#aiPromptFallback').hidden=true;toast('プロンプトをコピーしました');}
    else{const t=$('#aiPromptFallbackText');$('#aiPromptFallback').hidden=false;t.value=text;t.focus();t.select();toast('下の欄からコピーしてください');}
  };
  $('#exShare').onclick=async()=>{const name=`tane-backup-${stamp()}.json`;const blob=new Blob([exportJSON()],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); markExported(); toast('バックアップを渡しました'); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);markExported();};
  $('#exCopy').onclick=async()=>{try{await navigator.clipboard.writeText(exportJSON());markExported();toast('コピーしました');}catch(e){S.tab='data';renderMain();const t=$('#imText');$('#imPasteBox').hidden=false;t.value=exportJSON();t.select();toast('コピーできなかったので、下の欄から全選択してコピーしてください');}};
  const importNodes=list=>{let add=0,upd=0;for(const n of list){if(S.nodes.has(n.id))upd++;else add++;S.nodes.set(n.id,n);}saveNow();S.sel=null;S.detailFor=null;S.focus=null;S.theme=null;render();$('#imResult').textContent=`読み込みました：新しく${add}件、上書き${upd}件`;toast('読み込みました');};
  $('#imFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importNodes(parseBackup(String(r.result)));}catch(err){$('#imResult').textContent=err.message;}};r.readAsText(f);e.target.value='';};
  $('#imPasteOpen').onclick=()=>{$('#imPasteBox').hidden=false;$('#imText').focus();};
  $('#imPasteGo').onclick=()=>{try{importNodes(parseBackup($('#imText').value));}catch(err){$('#imResult').textContent=err.message;}};
  const w=$('#wipe');let armed=false;w.onclick=()=>{if(!armed){armed=true;w.textContent='本当にすべて消す';setTimeout(()=>{armed=false;if(w.isConnected)w.textContent='すべて消す';},3500);return;}S.nodes.clear();saveNow();S.sel=null;S.theme=null;S.focus=null;render();toast('すべて消しました');};
}

/* ---------- 分析シート ---------- */
function renderSheet(){const sh=$('#sheet');const n=S.sel&&S.nodes.get(S.sel);
  if(!n){S.detailFor=null;sh.innerHTML=`<div class="sec"><h3>使い方</h3><ol class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
    <li>テーマを作り、観察した行動をそのまま書き出す。</li>
    <li>行動をタップして、「↑抽象化する」で何のためかを上に、「↓具体化する」で具体的なやり方を下に足す。</li>
    <li>「分析する」で、摩擦のサイン、背景、制約、その制約が今もあるかを書く。</li>
    <li>行動ごとに「本質的には何をしているか」を書く。同じ本質はテーマをまたいでつながる。</li>
    <li>気になる行動はタネ候補にして、5つの要素で採点する。</li></ol></div>`;return;}
  if(S.detailFor!==n.id){buildSheet(n);S.detailFor=n.id;}else syncSheet(n);}
const STABS=[['cut','分解'],['tag','本質'],['seed','タネ'],['etc','その他']];
function buildSheet(n){const id=n.id;const sh=$('#sheet');
  sh.innerHTML=`<div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><div style="min-width:0;flex:1"><div class="crumb" id="d-crumb"></div></div><button class="close" id="d-close" aria-label="閉じる">✕</button></div>
  <input class="title-in" id="d-text" aria-label="行動" autocomplete="off">
  <div class="stabs" role="tablist">${STABS.map(([k,l])=>`<button role="tab" data-st="${k}">${l}</button>`).join('')}</div>
  <div class="panel" data-panel="cut">
    <div class="sec"><h3>摩擦のサイン</h3><div class="toggles" id="d-fr">${FRICTIONS.map(([k,l])=>`<button class="tg" data-fr="${k}">${l}</button>`).join('')}</div></div>
    <label class="f">なぜそうしているのか（背景）<textarea id="d-why" rows="2"></textarea></label>
    <label class="f">何がそうさせているのか（制約）<textarea id="d-con" rows="2"></textarea></label>
    <div class="sec"><h3>その制約は今もある？</h3><div class="seg" id="d-st">${STATUS.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</div>
    <div class="callout" id="d-gone" hidden>制約が消えたのに行動だけが残っています。市場のタネの典型的な形です。</div></div>
  </div>
  <div class="panel" data-panel="tag" hidden>
    <div class="sec"><h3>この行動は、本質的には何をしている？</h3><div class="tags" id="d-tags"></div>
    <form class="inline" id="d-tagf"><input id="d-tag-in" list="d-taglist" placeholder="例：モノの価値を決める" aria-label="本質" autocomplete="off"><datalist id="d-taglist"></datalist><button class="btn" type="submit">追加</button></form>
    <div class="tags" id="d-tagq"></div></div>
    <div class="sec"><h3>同じ本質を持つ行動</h3><div id="d-same"></div></div>
  </div>
  <div class="panel" data-panel="seed" hidden>
    <button class="tg seedtg" id="d-seed">タネ候補にする</button>
    <div class="score" id="d-score">${ELEMENTS.map(([k,l])=>`<div class="srow"><span>${l}</span><div class="dots">${[0,1,2].map(v=>`<button data-sk="${k}" data-sv="${v}" aria-label="${l} ${v}">${v}</button>`).join('')}</div></div>`).join('')}<div class="total" id="d-total"></div></div>
  </div>
  <div class="panel" data-panel="etc" hidden>
    <label class="f">メモ<textarea id="d-memo" rows="4"></textarea></label>
    <div class="sec"><h3>並び順</h3><div class="inline"><button class="btn sm" id="d-mu">▲ 上へ</button><button class="btn sm" id="d-md">▼ 下へ</button></div></div>
    <div class="sec"><h3>削除</h3><div><button class="btn sm danger" id="d-del">この行動を削除</button></div></div>
  </div>`;
  sh.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.sheetTab=b.dataset.st;showSheetTab();});
  $('#d-close').onclick=()=>openSheet(false);
  $('#d-text').oninput=e=>patchLater(id,'text',e.target.value);
  $('#d-why').oninput=e=>patchLater(id,'why',e.target.value);
  $('#d-con').oninput=e=>patchLater(id,'constraint',e.target.value);
  $('#d-memo').oninput=e=>patchLater(id,'memo',e.target.value);
  $('#d-fr').querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{const cur=new Set(S.nodes.get(id).frictions||[]);cur.has(b.dataset.fr)?cur.delete(b.dataset.fr):cur.add(b.dataset.fr);patch(id,{frictions:[...cur]});});
  $('#d-st').querySelectorAll('button').forEach(b=>b.onclick=()=>{const cur=S.nodes.get(id).status;patch(id,{status:cur===b.dataset.v?'':b.dataset.v});});
  const addTag=v=>{v=v.trim();if(!v)return;const cur=S.nodes.get(id).tags||[];if(!cur.includes(v))patch(id,{tags:[...cur,v]});};
  $('#d-tagf').onsubmit=e=>{e.preventDefault();addTag($('#d-tag-in').value);$('#d-tag-in').value='';};
  $('#d-tagq').addEventListener('click',e=>{const b=e.target.closest('[data-qt]');if(b)addTag(b.dataset.qt);});
  $('#d-same').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)select(b.dataset.go,true);});
  $('#d-seed').onclick=()=>patch(id,{seed:!S.nodes.get(id).seed});
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const sc={...(S.nodes.get(id).scores||{})};sc[b.dataset.sk]=Number(b.dataset.sv);patch(id,{scores:sc});});
  $('#d-mu').onclick=()=>move(id,-1);$('#d-md').onclick=()=>move(id,1);
  const del=$('#d-del');let armed=false;
  del.onclick=()=>{if(!armed){armed=true;const c=descendants(id).length;del.textContent=c?`下の${c}件もまとめて削除する`:'本当に削除する';setTimeout(()=>{armed=false;if(del.isConnected)del.textContent='この行動を削除';},3500);return;}openSheet(false);delNode(id);};
  showSheetTab();syncSheet(n,true);}
function showSheetTab(){document.querySelectorAll('#sheet [data-st]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.st===S.sheetTab)));document.querySelectorAll('#sheet [data-panel]').forEach(p=>p.hidden=p.dataset.panel!==S.sheetTab);}
function syncSheet(n,first){
  const setVal=(sel,v)=>{const el=$(sel);if(el&&(first||document.activeElement!==el))el.value=v||'';};
  const cr=pathOf(n.id).slice(0,-1).map(p=>p.text).join(' › ');
  $('#d-crumb').textContent=`L${depth(n.id)}${cr?'　'+cr+' ›':''}`;
  setVal('#d-text',n.text);setVal('#d-why',n.why);setVal('#d-con',n.constraint);setVal('#d-memo',n.memo);
  const fr=new Set(n.frictions||[]);$('#d-fr').querySelectorAll('[data-fr]').forEach(b=>b.setAttribute('aria-pressed',String(fr.has(b.dataset.fr))));
  $('#d-st').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(n.status===b.dataset.v)));
  $('#d-gone').hidden=n.status!=='gone';
  const tags=n.tags||[];
  $('#d-tags').innerHTML=tags.map(t=>`<button class="tagx" data-rm="${esc(t)}" aria-label="${esc(t)}を外す">${esc(t)} ✕</button>`).join('')||`<span class="muted">まだありません</span>`;
  $('#d-tags').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>patch(n.id,{tags:(S.nodes.get(n.id).tags||[]).filter(t=>t!==b.dataset.rm)}));
  const idx=tagIndex();const others=[...idx.keys()].filter(t=>!tags.includes(t));
  $('#d-taglist').innerHTML=others.map(t=>`<option value="${esc(t)}"></option>`).join('');
  $('#d-tagq').innerHTML=others.length?`<span class="muted">これまでに書いた本質：</span>`+others.slice(0,8).map(t=>`<button class="tagx" data-qt="${esc(t)}">＋ ${esc(t)}</button>`).join(''):'';
  const same=[];for(const t of tags)for(const m of(idx.get(t)||[]))if(m.id!==n.id&&!same.some(s=>s.id===m.id))same.push(m);
  $('#d-same').innerHTML=same.length?same.map(hitBtn).join(''):`<span class="muted">同じ本質を持つ行動はまだありません。</span>`;
  $('#d-seed').setAttribute('aria-pressed',String(!!n.seed));$('#d-seed').textContent=n.seed?'タネ候補にしている':'タネ候補にする';
  $('#d-score').hidden=!n.seed;
  $('#d-score').querySelectorAll('[data-sk]').forEach(b=>b.setAttribute('aria-pressed',String((Number(n.scores?.[b.dataset.sk])||0)===Number(b.dataset.sv))));
  $('#d-total').textContent=`合計 ${scoreOf(n)} / 10`;}

/* ---------- 起動 ---------- */
$('#scrim').onclick=()=>openSheet(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.adding){S.adding=null;renderMain();}else openSheet(false);}});
loadAll();
if(!S.nodes.size) S.tab='data';
render();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
